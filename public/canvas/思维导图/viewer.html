<!DOCTYPE html>
<html lang="zh">
<head>
    <script src="/js/storage-guard.js?v=1"></script>
<meta charset="UTF-8">
<title>思维导图查看器 · 大模型 XMind</title>
<style>
  :root{ --bg:#0f1218; --panel:#171d29; --line:#2a3446; --txt:#dde5f2; --sub:#8b97ab; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--txt); font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden;}
  #canvas{flex:1; overflow:auto; display:flex; align-items:center; justify-content:center;}
  #stage{transform-origin:center center; transition:transform .15s;}
  /* 嵌套树：经典思维导图连接线 */
  .tree{display:flex; align-items:center;}
  .tnode{position:relative; background:var(--panel); border:1.5px solid var(--nc,#4da3ff); border-radius:10px; padding:8px 14px; white-space:nowrap; box-shadow:0 2px 10px rgba(0,0,0,.35);}
  .tnode.root{font-size:19px; font-weight:700; padding:14px 26px; border-width:3px; cursor:default;}
  .tnode.branch{cursor:pointer; user-select:none;}
  .tnode.branch::after{content:" −"; color:var(--sub); font-weight:700;}
  .tnode.folded::after{content:" +";}
  .tnode.folded{opacity:.75;}
  ul.kids{list-style:none; display:flex; flex-direction:column; justify-content:center; margin-left:34px;}
  ul.kids li{position:relative; padding:7px 0 7px 30px; display:flex; align-items:center;}
  ul.kids li::before{content:""; position:absolute; left:0; top:50%; width:22px; border-top:2px solid var(--pc,#4da3ff); opacity:.5;}
  ul.kids li::after{content:""; position:absolute; left:0; top:0; bottom:0; border-left:2px solid var(--pc,#4da3ff); opacity:.5;}
  ul.kids li:first-child::after{top:50%;}
  ul.kids li:last-child::after{bottom:50%;}
  ul.kids li:only-child::after{display:none;}
  #zoom{position:fixed; bottom:14px; left:14px; display:flex; gap:6px; z-index:9;}
  #zoom button{width:34px; height:34px; border-radius:8px; background:var(--panel); border:1px solid var(--line); color:var(--txt); cursor:pointer; font-size:15px;}
  #status{color:var(--sub); font-size:12px; padding:6px 16px; border-top:1px solid var(--line); background:var(--panel);}
  #printBtn,#fileBtn{position:fixed; z-index:11; width:38px; height:38px; border-radius:50%; background:var(--panel); border:1px solid var(--line); color:var(--txt); font-size:18px; cursor:pointer;}
  #fileBtn{top:12px; right:12px;}
  #printBtn{top:58px; right:12px;}
  #sidebar{position:fixed; top:60px; right:16px; width:260px; max-height:60vh; overflow-y:auto; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; display:none; z-index:9;}
  #sidebar.open{display:block;}
  #sidebar a{display:block; color:var(--sub); padding:6px 8px; border-radius:6px; cursor:pointer; font-size:13px;}
  #sidebar a:hover{background:#1e2739; color:var(--txt);}
  @media print{
    body{background:#fff; height:auto; overflow:visible;}
    #zoom,#status,#fileBtn,#printBtn,#sidebar{display:none !important;}
    #canvas{overflow:visible;}
    #stage{transform:none !important;}
    .tnode{background:#fff; color:#000; border-color:#555; box-shadow:none;}
    ul.kids li::before,ul.kids li::after{border-color:#999;}
  }
</style>
</head>
<body>
<div id="canvas"><div id="stage"></div></div>
<div id="zoom">
  <button id="zin" title="放大">＋</button>
  <button id="zout" title="缩小">－</button>
  <button id="zfit" title="适应窗口">▢</button>
</div>
<div id="status">加载中…</div>
<button id="fileBtn" title="导图列表">📂</button>
<button id="printBtn" title="打印 / 导出 PDF">🖨</button>
<div id="sidebar"><h3 style="color:var(--sub);font-size:13px;margin-bottom:8px;">导图文件</h3><div id="filelist"></div></div>
<script>
const qs=new URLSearchParams(location.search);
let DATA=null, zoom=1, folded=new Set();

async function boot(){
  try{
    const r=await (await fetch('/api/minds/list')).json();
    const items=r.data&&r.data.items||r.items||[];
    const file=qs.get('file')||(items[0]&&items[0].file);
    if(file){
      const g=await (await fetch('/api/minds/get?file='+encodeURIComponent(file))).json();
      DATA=g.data; loadFileList(items);
    }
  }catch(e){}
  if(DATA) render(); else document.getElementById('status').textContent='未找到导图文件。可通过 ?file=xxx.mind.json 指定。';
}
function loadFileList(items){
  const box=document.getElementById('filelist'); box.innerHTML='';
  items.forEach(it=>{
    const a=document.createElement('a'); a.textContent=it.title||it.file;
    a.onclick=()=>location.href='/思维导图/viewer.html?file='+encodeURIComponent(it.file);
    box.appendChild(a);
  });
}

const PALETTE=['#4da3ff','#4fd08a','#ffb64d','#ff6f91','#9f7bff','#4dd8d0'];
function count(n){ return 1+(n.children||[]).reduce((s,c)=>s+count(c),0); }

function render(){
  const stage=document.getElementById('stage'); stage.innerHTML='';
  const root=DATA.root||{text:(DATA.meta&&DATA.meta.title)||'导图'};
  stage.appendChild(build(root,0,root.color||PALETTE[0],PALETTE[0]));
  fit();
  document.getElementById('status').textContent=(DATA.meta&&DATA.meta.title||'导图')+' · 共 '+count(root)+' 个节点';
}
function build(node,depth,color,parentColor){
  const el=document.createElement('div'); el.className='tnode'+(depth===0?' root':' branch');
  el.textContent=node.text||'(空)';
  el.style.setProperty('--nc',color);
  el.style.setProperty('--pc',parentColor||color);
  const kids=node.children||[];
  const key=node._id||(node._id=node.text+'#'+depth+'#'+Math.random().toString(36).slice(2,7));
  if(kids.length){
    if(folded.has(key)) el.classList.add('folded');
    el.onclick=(ev)=>{ ev.stopPropagation();
      folded.has(key)?folded.delete(key):folded.add(key); render(); };
    if(!folded.has(key)){
      const ul=document.createElement('ul'); ul.className='kids';
      kids.forEach((k,i)=>{
        const li=document.createElement('li');
        const kc=k.color||PALETTE[(depth+i)%PALETTE.length];
        li.appendChild(build(k,depth+1,kc,color));
        ul.appendChild(li);
      });
      const wrap=document.createElement('div'); wrap.className='tree';
      wrap.appendChild(el); wrap.appendChild(ul);
      return wrap;
    }
  }
  return el;
}
function fit(){
  const st=document.getElementById('stage');
  st.style.transform='scale(1)';
  const r=st.getBoundingClientRect(), cw=innerWidth-40, ch=innerHeight-90;
  zoom=Math.min(1.2, Math.min(cw/Math.max(r.width,1), ch/Math.max(r.height,1)));
  if(!isFinite(zoom)||zoom<=0) zoom=1;
  applyZoom();
}
function applyZoom(){
  document.getElementById('stage').style.transform='scale('+zoom+')';
}
document.getElementById('zin').onclick=()=>{zoom=Math.min(2,zoom+0.1); applyZoom();};
document.getElementById('zout').onclick=()=>{zoom=Math.max(0.3,zoom-0.1); applyZoom();};
document.getElementById('zfit').onclick=fit;
document.getElementById('fileBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
document.getElementById('printBtn').onclick=()=>window.print();
boot();
</script>
</body>
</html>
