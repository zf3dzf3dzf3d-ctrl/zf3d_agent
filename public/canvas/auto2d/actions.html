<!DOCTYPE html>
<html lang="zh">
<head>
    <script src="/js/storage-guard.js?v=1"></script>
<meta charset="UTF-8">
<title>Auto2D 角色动作库</title>
<style>
  body { margin:0; background:#12141c; color:#cdd3e0; font-family:system-ui; display:flex; flex-direction:column; align-items:center; }
  h1 { font-size:16px; margin:12px; }
  .bar { display:flex; gap:8px; margin:8px; flex-wrap:wrap; justify-content:center; }
  button { background:#232a40; color:#cdd3e0; border:1px solid #35406a; border-radius:6px; padding:8px 18px; font-size:14px; cursor:pointer; }
  button.on { background:#3b5bd6; color:#fff; border-color:#5b7bff; }
  canvas { background:linear-gradient(#1b2030,#141824); border:1px solid #2a3350; border-radius:8px; }
  p { font-size:13px; color:#7a86a3; margin:6px; }
</style>
</head>
<body>
<h1>角色动作库 — 点击切换动作</h1>
<div class="bar" id="bar"></div>
<canvas id="cv" width="768" height="768"></canvas>
<p>拆件: parts/*.png · 骨骼: parts.json · 动作: 程序化关键帧（待机/行走/奔跑/挥剑/跳跃/受击/死亡）</p>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let parts = null, imgs = {}, anim = 'idle', t = 0, last = performance.now();

// ---- 动作定义：每个部件 [角度幅度(弧度), 频率, 相位, 额外y偏移幅度, 额外缩放幅度] ----
// 更直观：每个动作返回 {rot, dy, scale} per part，t 为动作内部时间
const ACTIONS = {
  idle: { name:'待机', loop:2.0, f(p, t, s) {
    const b = Math.sin(t*2*Math.PI/2.0)*0.5+0.5;
    const rot = { head: Math.sin(t*3.1)*0.02, torso: Math.sin(t*2.2)*0.006,
      armL: Math.sin(t*1.6)*0.05, armR:-Math.sin(t*1.6)*0.05, legL:0, legR:0 };
    return { rot: rot[p]||0, dy: Math.sin(t*1.6)*5, sc: 1+Math.sin(t*2.2)*0.006 };
  }},
  walk: { name:'行走', loop:1.0, f(p, t) {
    const w = t*2*Math.PI;
    const rot = { head: Math.sin(w)*0.03, torso: Math.sin(w*2)*0.01,
      armL: Math.sin(w)*0.35, armR:-Math.sin(w)*0.35,
      legL:-Math.sin(w)*0.30, legR: Math.sin(w)*0.30 };
    return { rot: rot[p]||0, dy: Math.abs(Math.sin(w))*-6, sc: 1 };
  }},
  run: { name:'奔跑', loop:0.6, f(p, t) {
    const w = t*2*Math.PI/0.6;
    const rot = { head: Math.sin(w)*0.05+0.06, torso: 0.06+Math.sin(w*2)*0.02,
      armL: Math.sin(w)*0.7, armR:-Math.sin(w)*0.7,
      legL:-Math.sin(w)*0.55, legR: Math.sin(w)*0.55 };
    return { rot: rot[p]||0, dy: Math.abs(Math.sin(w))*-14, sc: 1 };
  }},
  slash: { name:'挥剑', loop:0.8, once:true, f(p, t) {
    // 0~0.3 举臂蓄力, 0.3~0.5 快速下劈, 0.5~0.8 收势
    let swing;
    if (t < 0.3) swing = -0.9 * (t/0.3);
    else if (t < 0.5) swing = -0.9 + 2.4*((t-0.3)/0.2);
    else swing = 1.5 * (1-(t-0.5)/0.3);
    const rot = { head: swing*0.15, torso: swing*0.25,
      armR: swing*0.8, armL: -swing*0.2, legL: -swing*0.1, legR: swing*0.1 };
    return { rot: rot[p]||0, dy: Math.abs(swing)*4, sc: 1+Math.abs(swing)*0.02 };
  }},
  jump: { name:'跳跃', loop:1.2, once:true, f(p, t) {
    // 抛物线跳：0~0.15 蹲, 0.15~0.7 空中, 0.7~1.0 落地恢复
    let dy, crouch;
    if (t < 0.15) { crouch = t/0.15; dy = crouch*14; }
    else if (t < 0.7) { const u=(t-0.15)/0.55; dy = -Math.sin(u*Math.PI)*130; crouch=0; }
    else { crouch = 1-(t-0.7)/0.3; dy = crouch*10; }
    const rot = { head: -crouch*0.1, torso: crouch*0.12,
      armL: -dy*0.004 - crouch*0.3, armR: -dy*0.004 - crouch*0.3,
      legL: crouch*0.35 + (dy<-10?0.25:0), legR: crouch*0.35 + (dy<-10?0.25:0) };
    return { rot: rot[p]||0, dy, sc: 1-crouch*0.03 };
  }},
  hit: { name:'受击', loop:0.5, once:true, f(p, t) {
    const k = Math.sin(Math.min(t/0.5,1)*Math.PI);
    const rot = { head:-k*0.25, torso:-k*0.3, armL:-k*0.5, armR:-k*0.4, legL:k*0.1, legR:-k*0.1 };
    return { rot: rot[p]||0, dx:-k*30, dy:k*3, sc:1 };
  }},
  die: { name:'倒地', loop:1.4, once:true, f(p, t) {
    const k = Math.min(t/1.2, 1); // 0→1 倒下
    const e = k*k;
    const rot = { head:e*0.9, torso:e*1.1, armL:e*1.3, armR:e*1.2, legL:e*0.2, legR:e*0.15 };
    return { rot: rot[p]||0, dy:e*160, sc:1, alpha:1-e*0.4, fall:e*1.2 };
  }},
};

const bar = document.getElementById('bar');
Object.keys(ACTIONS).forEach(k => {
  const b = document.createElement('button');
  b.textContent = ACTIONS[k].name;
  b.onclick = () => select(k);
  b.dataset.k = k;
  bar.appendChild(b);
});
function select(k) {
  anim = k; t = 0;
  document.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
}
select('idle');

fetch('parts/parts.json').then(r => r.json()).then(j => {
  parts = j.parts.sort((a,b) => a.z - b.z);
  let left = parts.length;
  parts.forEach(p => {
    const im = new Image();
    im.onload = () => { if (--left === 0) loop(); };
    im.src = 'parts/' + p.file;
    imgs[p.name] = im;
  });
});

function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - last)/1000, 0.05); last = now;
  const A = ACTIONS[anim];
  t += dt;
  if (!A.once && t > A.loop) t -= A.loop;
  if (A.once && t > A.loop) { /* 定格在最后一帧 */ t = A.loop; }
  const tt = t;

  ctx.clearRect(0, 0, cv.width, cv.height);

  // 地面影
  let anyInfo = null;
  const poses = {};
  parts.forEach(p => { poses[p.name] = A.f(p.name, tt); anyInfo = poses[p.name]; });
  const dy = anyInfo ? anyInfo.dy : 0;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  const shScale = Math.max(0.4, 1 + dy/200);
  ctx.beginPath();
  ctx.ellipse(cv.width/2, cv.height*0.965, 110*shScale, 16*shScale, 0, 0, 7);
  ctx.fill();

  const hipX = 0.5*cv.width, hipY = 0.58*cv.height;
  parts.forEach(p => {
    const im = imgs[p.name];
    if (!im || !im.complete) return;
    const s = poses[p.name] || {};
    const rot = s.rot || 0, dyy = s.dy || 0, dxx = s.dx || 0;
    const sc = s.sc || 1, alpha = s.alpha == null ? 1 : s.alpha, fall = s.fall || 0;
    // 部件 root（旋转轴）在画布坐标
    const rX = p.root[0]*768 + dxx, rY = p.root[1]*768 + dyy;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(rX, rY);
    if (fall) ctx.rotate(fall*0.15); // 整体前倾
    ctx.scale(sc, sc);
    // 绕自身 root 旋转
    const rx = p.root[0]*768 - p.bbox[0], ry = p.root[1]*768 - p.bbox[1];
    ctx.translate(rx, ry); ctx.rotate(rot); ctx.translate(-rx, -ry);
    ctx.drawImage(im, p.bbox[0] + dxx, p.bbox[1]);
    ctx.restore();
  });
}
</script>
</body>
</html>
