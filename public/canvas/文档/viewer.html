<!DOCTYPE html>
<html lang="zh">
<head>
    <script src="/js/storage-guard.js?v=1"></script>
<meta charset="UTF-8">
<title>文档查看器 · 大模型 Word</title>
<style>
  :root{ --bg:#0f1218; --paper:#161b26; --line:#2a3446; --txt:#dde5f2; --sub:#8b97ab; --acc:#4da3ff; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--txt); font:15px/1.8 "Segoe UI","Microsoft YaHei",sans-serif; height:100vh; display:flex; overflow:hidden;}
  #toc{width:260px; min-width:260px; background:var(--panel,#141926); border-right:1px solid var(--line); overflow-y:auto; padding:18px 12px;}
  #toc h3{font-size:13px; color:var(--sub); margin-bottom:10px; letter-spacing:2px;}
  #toc a{display:block; color:var(--sub); padding:6px 10px; border-radius:6px; cursor:pointer; font-size:13px; text-decoration:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #toc a.lv2{padding-left:24px;}
  #toc a:hover,#toc a.on{background:#1e2739; color:var(--txt);}
  #main{flex:1; overflow-y:auto; padding:40px 0;}
  #paper{max-width:820px; margin:0 auto; background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:56px 64px;}
  h1{font-size:30px; margin-bottom:6px; line-height:1.3;}
  .docmeta{color:var(--sub); font-size:13px; margin-bottom:26px; padding-bottom:16px; border-bottom:1px solid var(--line);}
  h2{font-size:21px; margin:34px 0 12px; padding-left:10px; border-left:4px solid var(--acc);}
  h3{font-size:17px; margin:24px 0 8px;}
  p{margin:10px 0;}
  blockquote{border-left:3px solid var(--acc); background:#1a2233; padding:10px 16px; margin:14px 0; border-radius:0 8px 8px 0; color:#b9c6dd;}
  ul,ol{margin:10px 0 10px 26px;}
  li{margin:4px 0;}
  hr{border:none; border-top:1px solid var(--line); margin:26px 0;}
  img{max-width:100%; border-radius:8px; margin:12px 0;}
  table{border-collapse:collapse; width:100%; margin:14px 0;}
  th,td{border:1px solid var(--line); padding:7px 12px; text-align:left;}
  th{background:#1b2334; color:var(--acc);}
  code{background:#0d1119; border:1px solid var(--line); border-radius:4px; padding:1px 6px; font-size:13px;}
  pre{background:#0d1119; border:1px solid var(--line); border-radius:8px; padding:14px; overflow-x:auto; margin:12px 0;}
  pre code{border:none; background:none; padding:0;}
  #toolbar{position:fixed; top:14px; right:16px; display:flex; gap:8px; z-index:9;}
  #toolbar button{width:36px; height:36px; border-radius:50%; background:var(--paper); border:1px solid var(--line); color:var(--txt); font-size:15px; cursor:pointer;}
  #toolbar button:hover{border-color:var(--acc);}
  #sidebar{position:fixed; top:60px; right:16px; width:260px; max-height:60vh; overflow-y:auto; background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:12px; display:none; z-index:9;}
  #sidebar.open{display:block;}
  #sidebar a{display:block; color:var(--sub); padding:6px 8px; border-radius:6px; cursor:pointer; font-size:13px;}
  #sidebar a:hover{background:#1e2739; color:var(--txt);}
  @media print{
    body{background:#fff; color:#000; overflow:visible; height:auto; display:block;}
    #toc,#toolbar,#sidebar{display:none !important;}
    #main{overflow:visible; padding:0;}
    #paper{max-width:100%; border:none; border-radius:0; background:#fff; color:#000; padding:0 10mm; box-shadow:none;}
    h1,h2,h3,p,li,td,th,.docmeta{color:#000 !important;}
    blockquote{background:#f4f4f4; color:#333;}
    th{background:#eee; color:#000;}
    pre,code,td,th{border-color:#ccc;}
  }
</style>
</head>
<body>
<nav id="toc"><h3>目 录</h3><div id="toclist"></div></nav>
<div id="toolbar">
  <button id="fab" title="文件列表">📂</button>
  <button id="fontA-" title="缩小字号">A-</button>
  <button id="fontA+" title="放大字号">A+</button>
  <button id="printBtn" title="打印 / 导出 PDF">🖨</button>
  <button id="editBtn" title="编辑 JSON">✏️</button>
</div>
<div id="editOverlay" style="display:none; position:fixed; inset:0; background:rgba(5,8,14,.88); z-index:99; padding:40px;">
  <div style="max-width:900px; margin:0 auto; height:100%; display:flex; flex-direction:column; background:var(--paper); border:1px solid var(--line); border-radius:12px; overflow:hidden;">
    <div style="display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--line); background:#121724;">
      <b style="color:var(--txt);">✏️ 编辑文档 JSON</b>
      <span class="docmeta" id="editFileName" style="border:none; margin:0; padding:0;"></span>
      <span style="flex:1"></span>
      <button id="editSave" style="background:var(--acc); color:#06121f; border:none; border-radius:6px; padding:7px 18px; cursor:pointer; font-weight:600;">💾 保存</button>
      <button id="editClose" style="background:#1e2739; color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:7px 14px; cursor:pointer;">✕</button>
    </div>
    <textarea id="editArea" spellcheck="false" style="flex:1; background:#0b0f18; color:#c9f0d0; border:none; outline:none; resize:none; padding:18px; font:13px/1.6 Consolas,monospace;"></textarea>
  </div>
</div>
<div id="sidebar"><h3 style="color:var(--sub);font-size:13px;margin-bottom:8px;">文档文件</h3><div id="filelist"></div></div>
<div id="main"><article id="paper">加载中…</article></div>
<script>
const qs = new URLSearchParams(location.search);
let DATA=null, baseFont=15;

async function boot(){
  const file = qs.get('file');
  try{
    if(file){
      const j = await (await fetch('/api/docs/get?file='+encodeURIComponent(file))).json();
      if(j.ok) DATA=j.data;
    } else {
      const j = await (await fetch('/api/docs/list')).json();
      if(j.ok && j.items.length){
        DATA = (await (await fetch('/api/docs/get?file='+encodeURIComponent(j.items[0].file))).json()).data;
        loadFileList(j.items);
      }
    }
  }catch(e){}
  if(DATA) render(); else document.getElementById('paper').textContent='未找到文档文件。可通过 ?file=xxx.doc.json 指定。';
}

async function loadFileList(items){
  const box=document.getElementById('filelist'); box.innerHTML='';
  items.forEach(it=>{
    const a=document.createElement('a');
    a.textContent='📄 '+(it.title||it.file);
    a.onclick=()=>{ location.search='?file='+encodeURIComponent(it.file); };
    box.appendChild(a);
  });
}

function render(){
  const m=DATA.meta||{};
  const paper=document.getElementById('paper');
  paper.innerHTML='';
  const h1=document.createElement('h1'); h1.textContent=m.title||'未命名文档'; paper.appendChild(h1);
  const meta=document.createElement('div'); meta.className='docmeta';
  meta.textContent=[m.author?'作者：'+m.author:'', m.created?'日期：'+m.created:''].filter(Boolean).join('　·　')||'　';
  paper.appendChild(meta);
  const toclist=document.getElementById('toclist'); toclist.innerHTML='';
  (DATA.blocks||[]).forEach(b=>addBlock(paper,toclist,b));
  document.title=(m.title||'文档')+' · 大模型 Word';
}

function addBlock(paper,toc,b){
  switch((b.type||'p')){
    case 'h2': {
      const el=document.createElement('h2'); el.textContent=b.text||''; paper.appendChild(el);
      const a=document.createElement('a'); a.textContent='▍'+(b.text||''); a.onclick=()=>el.scrollIntoView({behavior:'smooth'}); toc.appendChild(a);
      el._tocA=a; return el;
    }
    case 'h3': {
      const el=document.createElement('h3'); el.textContent=b.text||''; paper.appendChild(el);
      const a=document.createElement('a'); a.className='lv2'; a.textContent=b.text||''; a.onclick=()=>el.scrollIntoView({behavior:'smooth'}); toc.appendChild(a);
      return el;
    }
    case 'quote': { const el=document.createElement('blockquote'); el.textContent=b.text||''; paper.appendChild(el); return el; }
    case 'ul': { const el=document.createElement('ul'); (b.items||[]).forEach(t=>{const li=document.createElement('li'); li.textContent=t; el.appendChild(li);}); paper.appendChild(el); return el; }
    case 'ol': { const el=document.createElement('ol'); (b.items||[]).forEach(t=>{const li=document.createElement('li'); li.textContent=t; el.appendChild(li);}); paper.appendChild(el); return el; }
    case 'table': {
      const el=document.createElement('table');
      const trh=document.createElement('tr'); (b.columns||[]).forEach(c=>{const th=document.createElement('th'); th.textContent=c; trh.appendChild(th);}); el.appendChild(trh);
      (b.rows||[]).forEach(r=>{ const tr=document.createElement('tr'); r.forEach(c=>{const td=document.createElement('td'); td.textContent=c; tr.appendChild(td);}); el.appendChild(tr); });
      paper.appendChild(el); return el;
    }
    case 'img': { const el=document.createElement('img'); el.src=b.src||''; if(b.alt) el.alt=b.alt; paper.appendChild(el); return el; }
    case 'code': { const pre=document.createElement('pre'); const c=document.createElement('code'); c.textContent=b.text||''; pre.appendChild(c); paper.appendChild(pre); return pre; }
    case 'hr': { paper.appendChild(document.createElement('hr')); return null; }
    case 'divider': { paper.appendChild(document.createElement('hr')); return null; }
    default: { const el=document.createElement('p'); el.textContent=b.text||''; paper.appendChild(el); return el; }
  }
}

document.getElementById('fab').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
document.getElementById('fontA+').onclick=()=>{baseFont=Math.min(24,baseFont+1); document.getElementById('paper').style.fontSize=baseFont+'px';};
document.getElementById('fontA-').onclick=()=>{baseFont=Math.max(12,baseFont-1); document.getElementById('paper').style.fontSize=baseFont+'px';};
document.getElementById('printBtn').onclick=()=>window.print();
// ---- 编辑模式 ----
function currentFileName(){ return qs.get('file')||'guide_demo.doc.json'; }
document.getElementById('editBtn').onclick=()=>{
  const ov=document.getElementById('editOverlay');
  document.getElementById('editFileName').textContent=currentFileName();
  document.getElementById('editArea').value=JSON.stringify(DATA,null,2);
  ov.style.display='block';
};
document.getElementById('editClose').onclick=()=>{ document.getElementById('editOverlay').style.display='none'; };
document.getElementById('editSave').onclick=async()=>{
  let obj;
  try{ obj=JSON.parse(document.getElementById('editArea').value); }
  catch(e){ alert('JSON 格式错误：'+e.message); return; }
  const btn=document.getElementById('editSave'); btn.textContent='保存中…'; btn.disabled=true;
  try{
    const r=await fetch('/api/docs/save',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({file:currentFileName(),data:obj})});
    const j=await r.json();
    if(j.ok){ DATA=obj; document.getElementById('editOverlay').style.display='none'; render(); btn.textContent='✅ 已保存'; }
    else alert('保存失败：'+(j.err||'未知错误'));
  }catch(e){ alert('保存失败：'+e.message); }
  setTimeout(()=>{ btn.textContent='💾 保存'; btn.disabled=false; },1500);
};
boot();
</script>
</body>
</html>
