<!DOCTYPE html>
<html lang="zh">
<head>
    <script src="/js/storage-guard.js?v=1"></script>
<meta charset="utf-8">
<title>关卡编辑器</title>
<style>
body{margin:0;background:#1a1d23;color:#ccc;font-family:monospace;display:flex;flex-direction:column;height:100vh;overflow:hidden}
#bar{background:#22262e;padding:6px 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #333;font-size:12px;flex-shrink:0}
#bar .sep{width:1px;height:20px;background:#444;margin:0 4px}
#bar button{background:#2a4a6a;color:#cde;border:1px solid #456;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:12px}
#bar button:hover{background:#3a6a9a}
#bar button.warn{background:#6a3a3a;border-color:#a55}
#bar button.warn:hover{background:#8a4a4a}
#bar span{color:#888}
#main{flex:1;display:flex;overflow:hidden}
#side{width:240px;background:#22262e;padding:10px;overflow-y:auto;font-size:12px;flex-shrink:0}
#side h3{margin:8px 0 4px;color:#8cf;font-size:13px}
#entList div{padding:3px 6px;cursor:pointer;border-radius:3px;display:flex;justify-content:space-between}
#entList div.sel{background:#3a5f8a;color:#fff}
#entList div .lock{color:#fa0}
#props input,#props select{width:100%;box-sizing:border-box;margin:2px 0;background:#111;color:#cf9;border:1px solid #444;padding:3px}
#stage{flex:1;position:relative;overflow:hidden}
canvas{display:block;cursor:crosshair}
#tip{position:absolute;bottom:6px;left:10px;font-size:11px;color:#888;background:#0008;padding:2px 8px;border-radius:3px}
#zoomLab{position:absolute;top:6px;right:10px;font-size:11px;color:#8cf;background:#0008;padding:2px 8px;border-radius:3px}
#toast{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-size:12px;color:#cfc;background:#000c;padding:4px 14px;border-radius:4px;display:none}
</style>
</head>
<body>
<div id="bar">
  <b style="color:#8cf">🎮 关卡编辑器</b>
  <div class="sep"></div>
  <button onclick="undo()">↶ 撤销 (Ctrl+Z)</button>
  <button onclick="redo()">↷ 重做 (Ctrl+Y)</button>
  <div class="sep"></div>
  <button onclick="dupSel()">⧉ 复制 (Ctrl+D)</button>
  <button onclick="delSel()">✖ 删除 (Del)</button>
  <button onclick="rotSel()">⟳ 旋转 (R)</button>
  <div class="sep"></div>
  <button onclick="layerSel('front')">置顶</button>
  <button onclick="layerSel('up')">上移</button>
  <button onclick="layerSel('down')">下移</button>
  <button onclick="layerSel('back')">置底</button>
  <div class="sep"></div>
  <button onclick="alignSel('left')">左对齐</button>
  <button onclick="alignSel('top')">上对齐</button>
  <button onclick="alignSel('snap')">对齐网格</button>
  <div class="sep"></div>
  <button onclick="toggleLock()" id="lockBtn">🔒 锁定</button>
  <button class="warn" onclick="newSceneBtn()">新建</button>
  <span id="statLab"></span>
</div>
<div id="main">
<div id="side">
  <h3>实体列表 <span style="color:#666" id="entCount"></span></h3>
  <div id="entList"></div>
  <h3>添加关卡元素</h3>
  <div id="addBtns"></div>
  <h3>属性</h3>
  <div id="props">未选中</div>
  <h3>场景设置</h3>
  <div id="props2"></div>
  <h3>文件</h3>
  <button onclick="saveScene()">保存到服务器</button>
  <button onclick="loadScene()">载入</button>
  <button onclick="exportJSON()">导出 JSON</button>
  <button onclick="importJSON()">导入 JSON</button>
</div>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="zoomLab">100%</div>
  <div id="toast"></div>
  <div id="tip">左键选择/拖动 · 拖角缩放 · 右键删除 · 滚轮缩放 · 中键/空格平移 · Ctrl+D复制 · Del删除 · R旋转</div>
</div>
</div>
<script src="scene-editor.js"></script>
<script>
let scene = SceneEditor.newScene("演示关卡");
scene.entities.push({type:"rect",x:200,y:420,w:520,h:40,color:"#675",name:"地面",props:{}});
scene.entities.push({type:"spawn",x:120,y:360,w:32,h:32,color:"#fd4",name:"出生点",props:{}});
scene.entities.push({type:"coin",x:320,y:340,w:24,h:24,color:"#fc4",name:"金币",props:{value:10}});
scene.entities.push({type:"goal",x:640,y:412,w:32,h:48,color:"#5c5",name:"终点旗",props:{next:""}});

let sel = -1, selSet = new Set();      // 多选（shift点击）
let drag = null, resizeH = -1;          // resizeH: 被拖的角 0~3
let cam = { x: 0, y: 0, z: 1 };         // 相机：平移 + 缩放
let undoStack = [], redoStack = [];
let locked = false;

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const stage = document.getElementById("stage");
function fitCanvas(){ cv.width = stage.clientWidth; cv.height = stage.clientHeight; }
window.addEventListener("resize", fitCanvas); fitCanvas();

// ===== 撤销/重做（JSON 快照） =====
function snapshot(){ undoStack.push(JSON.stringify(scene)); if (undoStack.length > 60) undoStack.shift(); redoStack.length = 0; }
function undo(){ if(!undoStack.length) return toast("没有可撤销的操作"); redoStack.push(JSON.stringify(scene)); scene = JSON.parse(undoStack.pop()); sel=-1; selSet.clear(); refreshList(); showProps(); }
function redo(){ if(!redoStack.length) return toast("没有可重做的操作"); undoStack.push(JSON.stringify(scene)); scene = JSON.parse(redoStack.pop()); sel=-1; selSet.clear(); refreshList(); showProps(); }

function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none",1400); }

// ===== 添加按钮（来自类型注册表） =====
document.getElementById("addBtns").innerHTML = Object.entries(SceneEditor.TYPES)
  .map(([k,v]) => `<button onclick="addEnt('${k}')" style="margin:2px">${v.label}</button>`).join("");

function refreshList() {
  const el = document.getElementById("entList");
  el.innerHTML = "";
  scene.entities.forEach((e, i) => {
    const d = document.createElement("div");
    d.textContent = i + ". " + (e.name || e.type);
    if (selSet.has(i)) d.classList.add("sel");
    d.onclick = (ev) => { sel = i; selSet = ev.shiftKey ? new Set([...selSet, i]) : new Set([i]); refreshList(); showProps(); };
    el.appendChild(d);
  });
  document.getElementById("entCount").textContent = "(" + scene.entities.length + ")";
  document.getElementById("statLab").textContent = " 实体:" + scene.entities.length + " 撤销:" + undoStack.length;
}
function showProps() {
  const box = document.getElementById("props");
  if (sel < 0 || !scene.entities[sel]) { box.innerHTML = "未选中"; document.getElementById("props2").innerHTML = sceneSettings(); return; }
  const e = scene.entities[sel];
  const tdef = SceneEditor.typeOf(e.type);
  const fields = ["name","x","y","w","h","color","rotation"];
  let html = `<div style="color:#888">类型: ${tdef.label}</div>`;
  html += fields.map(f => `${f}: <input id="p_${f}" value="${e[f] ?? ""}">`).join("<br>");
  // 类型专属 props
  const pk = Object.keys(e.props || {});
  if (pk.length) html += "<br><b style='color:#9cf'>参数</b>" + pk.map(k => `${k}: <input id="pp_${k}" value="${e.props[k]}">`).join("<br>");
  html += `<br><button onclick="applyProps()">应用</button>`;
  box.innerHTML = html;
  document.getElementById("props2").innerHTML = sceneSettings();
}
function sceneSettings(){
  return `重力: <input id="s_gravity" value="${scene.gravity}"><br>网格: <input id="s_tile" value="${scene.tileSize}"><br><button onclick="applySceneSet()">应用场景设置</button>`;
}
function applySceneSet(){ scene.gravity = +document.getElementById("s_gravity").value || 0; scene.tileSize = +document.getElementById("s_tile").value || 32; snapshot(); toast("场景设置已更新"); }
function applyProps() {
  const e = scene.entities[sel]; if (!e) return;
  snapshot();
  ["name","x","y","w","h","color","rotation"].forEach(f => {
    const el = document.getElementById("p_" + f); if (!el) return;
    const v = el.value;
    e[f] = (f==="x"||f==="y"||f==="w"||f==="h"||f==="rotation") ? +v : v;
  });
  Object.keys(e.props || {}).forEach(k => { const el = document.getElementById("pp_"+k); if (el) e.props[k] = isNaN(+el.value) ? el.value : +el.value; });
  refreshList();
}
function addEnt(type) {
  snapshot();
  const w = cv.width / cam.z, h = cv.height / cam.z;
  const e = SceneEditor.makeEnt(type, SceneEditor.snap((cv.width/2 + cam.x) / cam.z, scene.tileSize) - 32, SceneEditor.snap((cv.height/2 + cam.y) / cam.z, scene.tileSize) - 32);
  scene.entities.push(e); sel = scene.entities.length - 1; selSet = new Set([sel]);
  refreshList(); showProps();
}
function dupSel(){ if (sel < 0) return toast("先选中一个实体"); snapshot(); sel = SceneEditor.duplicate(scene, sel); selSet = new Set([sel]); refreshList(); showProps(); }
function delSel(){
  const idxs = [...selSet].sort((a,b)=>b-a);
  if (!idxs.length) return toast("先选中实体");
  snapshot(); idxs.forEach(i => SceneEditor.removeAt(scene, i));
  sel = -1; selSet.clear(); refreshList(); showProps();
}
function rotSel(){ if (sel<0) return toast("先选中实体"); snapshot(); SceneEditor.rotateEnt(scene, sel, 15); showProps(); }
function layerSel(op){ if (sel<0) return toast("先选中实体"); snapshot(); sel = SceneEditor.layerOp(scene, sel, op) ?? sel; selSet = new Set([sel]); refreshList(); }
function alignSel(mode){ const idxs=[...selSet]; if(idxs.length<2 && mode!=="snap") return toast("选中两个以上实体"); snapshot(); SceneEditor.align(scene, idxs.length?idxs:(sel>=0?[sel]:[]), mode, scene.tileSize); showProps(); }
function toggleLock(){ locked = !locked; document.getElementById("lockBtn").textContent = locked ? "🔓 解锁" : "🔒 锁定"; toast(locked ? "画布已锁定（只读预览）" : "已解锁"); }
function newSceneBtn(){ if (!confirm("新建场景（当前内容将清空）？")) return; snapshot(); scene = SceneEditor.newScene("新关卡"); sel=-1; selSet.clear(); refreshList(); showProps(); }

// ===== 文件操作 =====
async function saveScene() {
  const name = prompt("场景名：", scene.name) || scene.name;
  scene.name = name;
  const r = await fetch("/api/scenes/" + encodeURIComponent(name), { method: "POST", body: SceneEditor.serialize(scene) });
  const j = await r.json();
  toast(j.ok ? "已保存: " + name : "失败: " + j.error);
}
async function loadScene() {
  const list = await (await fetch("/api/scenes")).json();
  const name = prompt("载入哪个场景：\n" + (list.scenes.join(", ") || "(空)"));
  if (!name) return;
  const r = await fetch("/api/scenes/" + encodeURIComponent(name));
  if (!r.ok) return toast("未找到该场景");
  snapshot(); scene = SceneEditor.deserialize(await r.json()); sel = -1; selSet.clear();
  refreshList(); showProps(); toast("已载入: " + name);
}
function exportJSON(){ prompt("场景 JSON（Ctrl+C 复制）：", SceneEditor.serialize(scene)); }
function importJSON(){
  const s = prompt("粘贴场景 JSON："); if (!s) return;
  try { snapshot(); scene = SceneEditor.deserialize(s); sel=-1; selSet.clear(); refreshList(); showProps(); toast("导入成功"); }
  catch(e){ toast("导入失败: " + e.message); }
}

// ===== 坐标换算 =====
function toWorld(px, py){ return { x: px / cam.z + cam.x, y: py / cam.z + cam.y }; }

// 拖角检测（选中实体的四角，8px 屏幕容差）
function cornerHit(e, wx, wy){
  const tol = 8 / cam.z;
  const pts = [[e.x,e.y],[e.x+e.w,e.y],[e.x,e.y+e.h],[e.x+e.w,e.y+e.h]];
  for (let i = 0; i < 4; i++) if (Math.abs(wx-pts[i][0])<tol && Math.abs(wy-pts[i][1])<tol) return i;
  return -1;
}

cv.addEventListener("mousedown", ev => {
  const r = cv.getBoundingClientRect();
  const w = toWorld(ev.clientX - r.left, ev.clientY - r.top);
  if (ev.button === 1 || spaceDown) { drag = { pan: true, sx: ev.clientX, sy: ev.clientY, cx: cam.x, cy: cam.y }; return; }
  if (locked) return;
  if (ev.button === 2) {
    const i = SceneEditor.hitTest(scene, w.x, w.y);
    if (i >= 0) { snapshot(); scene.entities.splice(i, 1); sel = -1; selSet.delete(i); refreshList(); showProps(); }
    return;
  }
  // 拖角缩放
  if (sel >= 0 && scene.entities[sel]) {
    const h = cornerHit(scene.entities[sel], w.x, w.y);
    if (h >= 0) { snapshot(); resizeH = h; drag = { resize: true, start: scene.entities[sel].w, startH: scene.entities[sel].h, ox: scene.entities[sel].x, oy: scene.entities[sel].y }; return; }
  }
  const i = SceneEditor.hitTest(scene, w.x, w.y);
  if (i >= 0) {
    const wasSel = selSet.has(i);
    sel = i;
    selSet = ev.shiftKey ? new Set([...selSet, i]) : (wasSel && selSet.size > 1 ? new Set([i]) : new Set([i]));
    const e = scene.entities[i];
    drag = { dx: e.x - w.x, dy: e.y - w.y, moved: false };
    snapshotOnce = true;
  } else {
    sel = -1; selSet.clear();
  }
  refreshList(); showProps();
});
let snapshotOnce = false;
cv.addEventListener("mousemove", ev => {
  const r = cv.getBoundingClientRect();
  const px = ev.clientX - r.left, py = ev.clientY - r.top;
  const w = toWorld(px, py);
  // 状态栏坐标
  cv.title = `世界坐标: ${Math.round(w.x)}, ${Math.round(w.y)}`;
  if (!drag) {
    // 拖角光标提示
    if (sel >= 0 && scene.entities[sel] && cornerHit(scene.entities[sel], w.x, w.y) >= 0) cv.style.cursor = "nwse-resize";
    else cv.style.cursor = "crosshair";
    return;
  }
  if (drag.pan) { cam.x = drag.cx - (ev.clientX - drag.sx) / cam.z; cam.y = drag.cy - (ev.clientY - drag.sy) / cam.z; return; }
  if (locked || sel < 0 || !scene.entities[sel]) return;
  const e = scene.entities[sel];
  if (drag.resize) {
    if (resizeH === 1 || resizeH === 3) e.w = Math.max(8, SceneEditor.snap(w.x - e.x, 4));
    if (resizeH === 2 || resizeH === 3) e.h = Math.max(8, SceneEditor.snap(w.y - e.y, 4));
  } else {
    if (snapshotOnce) { snapshot(); snapshotOnce = false; }
    e.x = SceneEditor.snap(w.x + drag.dx, ev.ctrlKey ? 1 : scene.tileSize);
    e.y = SceneEditor.snap(w.y + drag.dy, ev.ctrlKey ? 1 : scene.tileSize);
    drag.moved = true;
  }
  const p = document.getElementById("p_x"); if (p) p.value = e.x;
  const q = document.getElementById("p_y"); if (q) q.value = e.y;
  const pw = document.getElementById("p_w"); if (pw) pw.value = e.w;
  const ph = document.getElementById("p_h"); if (ph) ph.value = e.h;
});
window.addEventListener("mouseup", () => drag = null);
cv.addEventListener("contextmenu", ev => ev.preventDefault());
cv.addEventListener("wheel", ev => {
  ev.preventDefault();
  const r = cv.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const old = cam.z;
  cam.z = Math.min(4, Math.max(0.25, cam.z * (ev.deltaY < 0 ? 1.12 : 0.89)));
  // 以鼠标为锚点缩放
  cam.x += mx / old - mx / cam.z;
  cam.y += my / old - my / cam.z;
  document.getElementById("zoomLab").textContent = Math.round(cam.z * 100) + "%";
}, { passive: false });

// 键盘快捷键
let spaceDown = false;
window.addEventListener("keydown", ev => {
  if (ev.code === "Space") { spaceDown = true; ev.preventDefault(); }
  if (ev.target.tagName === "INPUT") return;
  if (ev.ctrlKey && ev.key === "z") { undo(); ev.preventDefault(); }
  else if (ev.ctrlKey && ev.key === "y") { redo(); ev.preventDefault(); }
  else if (ev.ctrlKey && ev.key === "d") { dupSel(); ev.preventDefault(); }
  else if (ev.key === "Delete" || ev.key === "Backspace") { delSel(); ev.preventDefault(); }
  else if (ev.key === "r" || ev.key === "R") rotSel();
  else if (ev.key === "Escape") { sel = -1; selSet.clear(); refreshList(); showProps(); }
  else if (ev.key === "ArrowLeft" && sel >= 0) { scene.entities[sel].x -= ev.shiftKey ? scene.tileSize : 1; showProps(); }
  else if (ev.key === "ArrowRight" && sel >= 0) { scene.entities[sel].x += ev.shiftKey ? scene.tileSize : 1; showProps(); }
  else if (ev.key === "ArrowUp" && sel >= 0) { scene.entities[sel].y -= ev.shiftKey ? scene.tileSize : 1; showProps(); }
  else if (ev.key === "ArrowDown" && sel >= 0) { scene.entities[sel].y += ev.shiftKey ? scene.tileSize : 1; showProps(); }
});
window.addEventListener("keyup", ev => { if (ev.code === "Space") spaceDown = false; });

// ===== 渲染 =====
function draw() {
  ctx.fillStyle = "#1a1d23"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.save();
  ctx.scale(cam.z, cam.z);
  ctx.translate(-cam.x, -cam.y);
  // 网格
  const g = scene.tileSize || 32;
  const x0 = Math.floor(cam.x / g) * g, y0 = Math.floor(cam.y / g) * g;
  const x1 = cam.x + cv.width / cam.z, y1 = cam.y + cv.height / cam.z;
  ctx.strokeStyle = "#26292f"; ctx.lineWidth = 1 / cam.z;
  for (let x = x0; x < x1; x += g) { ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke(); }
  for (let y = y0; y < y1; y += g) { ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); }
  // 原点轴
  ctx.strokeStyle = "#553"; ctx.beginPath(); ctx.moveTo(0, y0); ctx.lineTo(0, y1); ctx.moveTo(x0, 0); ctx.lineTo(x1, 0); ctx.stroke();
  scene.entities.forEach((e, i) => {
    ctx.save();
    ctx.translate(e.x + e.w/2, e.y + e.h/2);
    ctx.rotate((e.rotation || 0) * Math.PI / 180);
    ctx.fillStyle = e.color || "#4a9";
    if (e.type === "circle") { ctx.beginPath(); ctx.arc(0, 0, Math.min(e.w,e.h)/2, 0, 7); ctx.fill(); }
    else if (e.type === "coin") { ctx.beginPath(); ctx.arc(0, 0, Math.min(e.w,e.h)/2, 0, 7); ctx.fill(); ctx.strokeStyle = "#863"; ctx.stroke(); }
    else if (e.type === "spawn") { ctx.fillRect(-e.w/2, -e.h/2, e.w, e.h); ctx.strokeStyle = "#fff"; ctx.strokeRect(-e.w/2, -e.h/2, e.w, e.h); }
    else if (e.type === "spike") { ctx.beginPath(); const n = Math.max(2, Math.round(e.w/16)); for(let k=0;k<n;k++){ ctx.moveTo(-e.w/2 + k*e.w/n, e.h/2); ctx.lineTo(-e.w/2 + (k+0.5)*e.w/n, -e.h/2); ctx.lineTo(-e.w/2 + (k+1)*e.w/n, e.h/2); } ctx.closePath(); ctx.fill(); }
    else if (e.type === "goal") { ctx.fillRect(-e.w/2, -e.h/2, 4, e.h); ctx.fillStyle = e.color; ctx.beginPath(); ctx.moveTo(-e.w/2+4, -e.h/2); ctx.lineTo(e.w/2, -e.h/2+8); ctx.lineTo(-e.w/2+4, -e.h/2+16); ctx.fill(); }
    else if (e.type === "platform") { ctx.fillRect(-e.w/2, -e.h/2, e.w, e.h); ctx.strokeStyle = "#fff8"; ctx.setLineDash([4,3]); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo((e.props&&e.props.dx)||0, (e.props&&e.props.dy)||0); ctx.stroke(); ctx.setLineDash([]); }
    else if (e.type === "text") { ctx.font = "14px monospace"; ctx.fillStyle = e.color; ctx.fillText((e.props&&e.props.text)||e.name, -e.w/2, 0); }
    else ctx.fillRect(-e.w/2, -e.h/2, e.w, e.h);
    ctx.restore();
    if (selSet.has(i)) {
      ctx.strokeStyle = "#8cf"; ctx.setLineDash([4,3]); ctx.lineWidth = 1 / cam.z;
      ctx.strokeRect(e.x-2, e.y-2, e.w+4, e.h+4); ctx.setLineDash([]);
      // 四角拖拽手柄
      ctx.fillStyle = "#8cf";
      [[e.x,e.y],[e.x+e.w,e.y],[e.x,e.y+e.h],[e.x+e.w,e.y+e.h]].forEach(p => ctx.fillRect(p[0]-4/cam.z, p[1]-4/cam.z, 8/cam.z, 8/cam.z));
    }
    ctx.fillStyle = "#aaa"; ctx.font = 11 / cam.z + "px monospace";
    ctx.fillText(e.name, e.x, e.y - 4 / cam.z);
  });
  ctx.restore();
  requestAnimationFrame(draw);
}
refreshList(); showProps(); draw();
</script>
</body>
</html>
