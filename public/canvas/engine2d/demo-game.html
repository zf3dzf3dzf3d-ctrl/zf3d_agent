<!DOCTYPE html>
<html lang="zh">
<head>
    <script src="/js/storage-guard.js?v=1"></script>
<meta charset="utf-8">
<title>星火守卫 - 引擎能力演示</title>
<style>
  body{margin:0;background:#05070d;overflow:hidden;font-family:monospace}
  canvas{display:block;background:radial-gradient(ellipse at center,#0a1020 0%,#05070d 70%)}
  /* ===== 载入界面 ===== */
  #boot{position:fixed;inset:0;background:radial-gradient(ellipse at center,#0a1020 0%,#05070d 70%);
    display:flex;align-items:center;justify-content:center;z-index:50;transition:opacity .6s ease}
  #boot.hide{opacity:0;pointer-events:none}
  .panel{background:rgba(12,18,34,.92);border:1px solid rgba(80,160,255,.35);border-radius:14px;
    box-shadow:0 0 40px rgba(40,120,255,.25),inset 0 0 30px rgba(40,120,255,.06);
    padding:34px 46px;text-align:center;color:#cfe6ff;min-width:340px;
    animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .panel h1{margin:0 0 6px;font-size:26px;letter-spacing:6px;color:#7fc4ff;
    text-shadow:0 0 18px rgba(80,160,255,.8)}
  .panel .sub{font-size:12px;color:#5a7ba6;margin-bottom:20px;letter-spacing:2px}
  .bar{height:10px;background:rgba(60,90,140,.25);border-radius:6px;overflow:hidden;margin:0 0 12px}
  .bar>div{height:100%;width:0%;border-radius:6px;transition:width .18s ease;
    background:linear-gradient(90deg,#2b6cff,#66e0ff);box-shadow:0 0 12px rgba(90,180,255,.9)}
  #bootmsg{font-size:12px;color:#8fb4d8;min-height:16px}
  .blink{animation:bl 1s steps(2) infinite}
  @keyframes bl{50%{opacity:.25}}
  /* ===== 游戏内对话框 ===== */
  #dlg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    z-index:40;pointer-events:none;opacity:0;transition:opacity .25s ease}
  #dlg.show{opacity:1}
  #dlg .panel{min-width:300px}
  #dlg h2{margin:0 0 14px;font-size:22px;letter-spacing:4px;color:#ffd76a;
    text-shadow:0 0 16px rgba(255,190,60,.7)}
  #dlg.show .panel{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
  #dlg h2{animation:titleGlow 2s ease-in-out infinite alternate}
  @keyframes titleGlow{
    from{text-shadow:0 0 10px rgba(255,190,60,.4);transform:scale(1)}
    to{text-shadow:0 0 26px rgba(255,200,80,.95),0 0 60px rgba(255,160,40,.5);transform:scale(1.04)}
  }
  /* 标题欢迎界面旋转光环 */
  #boot .ring{width:120px;height:120px;margin:0 auto 14px;border-radius:50%;
    border:3px solid transparent;border-top-color:#4a9cff;border-right-color:#66e0ff;
    box-shadow:0 0 20px rgba(80,160,255,.4);animation:spin 1.4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* 死亡对话框入场 */
  #dlg.dying .panel{animation:deathIn .6s cubic-bezier(.2,1.2,.3,1)}
  @keyframes deathIn{
    0%{transform:scale(1.6) translateY(-30px);opacity:0}
    60%{transform:scale(.96);opacity:1}
    100%{transform:scale(1)}
  }
  .panel .logo{font-size:34px;margin-bottom:4px;animation:float 2.4s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  #dlg .line{font-size:13px;color:#cfe6ff;margin:6px 0}
  #dlg .hint{margin-top:18px;font-size:13px;color:#7fc4ff}
  #dlg .hint.blink{color:#ffd76a}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- 载入界面 -->
<div id="boot">
  <div class="panel">
    <div class="logo">✦</div>
    <h1>星火守卫</h1>
    <div class="sub">SPARK GUARDIAN · 引擎能力演示</div>
    <div class="bar"><div id="bootbar"></div></div>
    <div id="bootmsg">正在初始化渲染器...</div>
  </div>
</div>

<!-- 退出游戏：任何状态（含游玩中）都可点 -->
<div id="gameExitBar" style="position:fixed;right:10px;top:10px;z-index:60">
  <button id="gameExit" style="cursor:pointer;background:rgba(20,28,44,.8);border:1px solid rgba(255,110,70,.55);
    color:#ffb9a0;padding:5px 14px;border-radius:8px;font-family:monospace;font-size:12px;letter-spacing:2px;
    box-shadow:0 2px 12px rgba(0,0,0,.4)" title="退出游戏（返回主页或关闭窗口）">✕ 退出</button>
</div>

<!-- 游戏内对话框（标题 / 死亡 / 暂停） -->
<div id="dlg"><div class="panel">
  <h2 id="dlgTitle"></h2>
  <div id="dlgBody"></div>
  <div class="hint blink" id="dlgHint"></div>
  <div style="margin-top:16px;display:flex;gap:10px;justify-content:center">
    <button id="dlgExit" style="cursor:pointer;background:rgba(255,90,60,.12);border:1px solid rgba(255,110,70,.5);
      color:#ffb9a0;padding:8px 22px;border-radius:8px;font-family:inherit;font-size:12px;letter-spacing:2px"
      title="退出游戏（返回主页或关闭窗口）">✕ 退出游戏</button>
  </div>
</div></div>

<!-- Bug 报告对话框：脚本异常时弹出 -->
<div id="errdlg" style="position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:99;background:rgba(20,0,0,.55)">
  <div class="panel" style="border-color:rgba(255,90,60,.5);box-shadow:0 0 40px rgba(255,80,40,.3),inset 0 0 30px rgba(255,80,40,.06)">
    <h1 style="font-size:20px;color:#ff9a7a;text-shadow:0 0 14px rgba(255,90,50,.8)">⚠ 出现了点问题</h1>
    <div class="sub">游戏内部发生错误，但已自动恢复运行</div>
    <div id="errmsg" style="font-size:12px;color:#ffb59e;margin:10px 0;max-width:360px;word-break:break-all;text-align:left;max-height:120px;overflow:auto;background:rgba(60,20,10,.4);padding:8px;border-radius:8px"></div>
    <div style="display:flex;gap:10px;justify-content:center">
      <button onclick="this.closest('#errdlg').style.display='none'" style="cursor:pointer;background:rgba(80,160,255,.15);border:1px solid rgba(80,160,255,.5);color:#cfe6ff;padding:8px 20px;border-radius:8px;font-family:inherit">继续游戏</button>
      <button onclick="location.reload()" style="cursor:pointer;background:rgba(255,120,60,.15);border:1px solid rgba(255,120,60,.5);color:#ffd0b8;padding:8px 20px;border-radius:8px;font-family:inherit">重新载入</button>
    </div>
  </div>
</div>

<script src="engine.js"></script>
<script src="text.js"></script>
<script src="camera.js"></script>
<script src="input.js"></script>
<script src="audio.js"></script>
<script src="ui.js"></script>
<script>
"use strict";
(() => {
  // ================= 载入界面 =================
  const bootEl = document.getElementById("boot");
  const bootBar = document.getElementById("bootbar");
  const bootMsg = document.getElementById("bootmsg");
  const dlgEl = document.getElementById("dlg");
  const dlgTitle = document.getElementById("dlgTitle");
  const dlgBody = document.getElementById("dlgBody");
  const dlgHint = document.getElementById("dlgHint");

  const dlgShow = (title, lines, hint, dying) => {
    dlgTitle.textContent = title;
    dlgBody.innerHTML = lines.map(l => `<div class="line">${l}</div>`).join("");
    dlgHint.textContent = hint || "";
    dlgEl.classList.remove("dying");
    if (dying) { void dlgEl.offsetWidth; dlgEl.classList.add("dying"); } // 重触发死亡入场动画
    dlgEl.classList.add("show");
  };
  const dlgHide = () => dlgEl.classList.remove("show");

  // ================= 退出游戏 =================
  // 退出逻辑：返回引擎主菜单（/engine2d/），由主菜单的「返回画布」按钮或
  // 画布节点右上角 ✕ 关闭节点。不再直接关闭游戏引擎节点。
  function exitGame() {
    sfx.ui();
    location.href = "/engine2d/";
  }

  // 分步假加载（模拟资源准备，同时给引擎初始化留时间）
  const bootSteps = [
    [12, "正在初始化渲染器..."],
    [34, "正在加载着色器与实例缓冲..."],
    [58, "正在生成星域背景..."],
    [80, "正在校准摄像机与输入系统..."],
    [96, "正在预热音频引擎..."],
    [100, "准备完毕!"],
  ];
  let bootIdx = 0;
  const bootTick = () => {
    if (bootIdx < bootSteps.length) {
      const [p, msg] = bootSteps[bootIdx++];
      bootBar.style.width = p + "%";
      bootMsg.textContent = msg;
      setTimeout(bootTick, 260 + Math.random() * 300);
    } else {
      setTimeout(() => bootEl.classList.add("hide"), 350);
    }
  };
  bootTick();

  // ================= 引擎初始化 =================
  const renderer = new Renderer(document.getElementById("cv"));
  renderer._autoCam = false; // demo 自己在帧末统一 update 相机，避免 render() 内重复更新
  renderer.text = new TextRenderer(renderer);   // 挂载文本渲染（若引擎提供）
  const camera = new Camera(0, 0, 1);
  renderer.camera = camera;
  const input = new Input(renderer.canvas);
  const audio = new AudioSys();
  const ui = new UIManager();
  const hud = ui.hud("main");

  // ================= 游戏状态 =================
  const G = {
    state: "title",        // title / play / pause / dead
    time: 0, wave: 1, score: 0, kills: 0,
    waveTimer: 0, spawnTimer: 0, spawnInterval: 0.8,
    difficulty: 1,
    spawned: 0, waveQuota: 13,
    weapon: "gun",                        // 当前武器：gun/sword/laser/bomb
  };
  // 武器定义：初始可选四种攻击方式（1~4 切换）
  const WEAPONS = {
    gun:   { name: "散射炮", cd: 0.16, key: "1", color: [1,0.9,0.4], desc: "三连扇形弹" },
    sword: { name: "光刃斩", cd: 0.30, key: "2", color: [0.5,1,0.9], desc: "近身大范围劈砍" },
    laser: { name: "激光束", cd: 0.10, key: "3", color: [0.4,0.7,1], desc: "贯穿射线" },
    bomb:  { name: "炸弹",   cd: 0.85, key: "4", color: [1,0.5,0.2], desc: "爆炸范围伤害" },
  };

  const player = { x: 0, y: 0, vx: 0, vy: 0, r: 16, speed: 340, hp: 100, maxHp: 100, fireCd: 0, dashCd: 0, iframe: 0 };
  camera.follow(player, 0.12);

  const bullets = [];      // {x,y,vx,vy,life,friendly}
  const enemies = [];      // {x,y,vx,vy,r,hp,speed,color,hitFlash}
  const pickups = [];      // {x,y,type,t}
  const particles = [];    // {x,y,vx,vy,life,maxLife,color,size}
  const stars = [];        // 背景视差星
  for (let i = 0; i < 220; i++)
    stars.push({ x: (Math.random()-0.5)*3000, y: (Math.random()-0.5)*3000, z: 0.25+Math.random()*0.75, s: 1+Math.random()*2 });

  const inst = renderer.instanceData;
  const FL = renderer.INSTANCE_FLOATS;
  let n = 0;
  function push(x, y, w, h, r, g, b) {
    if (n * FL + FL > inst.length) return;
    const o = n * FL;
    inst[o]=x; inst[o+1]=y; inst[o+2]=w; inst[o+3]=h; inst[o+4]=r; inst[o+5]=g; inst[o+6]=b; inst[o+7]=0; inst[o+8]=0;
    n++;
  }

  // ================= 特效 =================
  function burst(x, y, color, count = 14, spd = 260) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, v = spd * (0.3 + Math.random());
      particles.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, life: 0.5+Math.random()*0.4, maxLife: 0.9, color, size: 3+Math.random()*5 });
    }
  }
  function shake(px) { camera.shakeFor(px); }

  // ================= 音效封装 =================
  const sfx = {
    shoot: () => audio.play("shoot", 0.35),
    slash: () => audio.play("hit", 0.45),
    hit:   () => audio.play("hit", 0.5),
    boom:  () => audio.play("explode", 0.7),
    pick:  () => audio.play("pickup", 0.6),
    hurt:  () => audio.play("hit", 0.8),
    ui:    () => audio.play("ui", 0.5),
  };

  // ================= 敌人 / 波次 =================
  function spawnEnemy(burst, kind) {
    const b = camera.bounds();
    const m = 120;
    if (!kind) {
      // 新怪种随波次解锁：2波冲撞怪、3波斜线奔跑队、4波全向疾冲怪
      const pool = ["chaser"];
      if (G.wave >= 2) pool.push("dasher", "dasher");
      if (G.wave >= 3) pool.push("runner");
      if (G.wave >= 4) pool.push("dart", "dart");
      kind = pool[Math.floor(Math.random()*pool.length)];
    }
    const speedMul = 1 + G.difficulty*0.10 + (burst?0.25:0);

    // ---- 斜线奔跑队：一排无敌怪，直线高速冲过战场 ----
    if (kind === "runner") {
      const side = Math.floor(Math.random()*4);
      let bx, by;
      if (side===0){bx=b.left-m; by=player.y+(Math.random()-0.5)*800;}
      else if(side===1){bx=b.right+m; by=player.y+(Math.random()-0.5)*800;}
      else if(side===2){by=b.top-m; bx=player.x+(Math.random()-0.5)*1200;}
      else {by=b.bottom+m; bx=player.x+(Math.random()-0.5)*1200;}
      const ang = Math.PI/4 + Math.floor(Math.random()*4)*Math.PI/2 + (Math.random()-0.5)*0.4; // 斜向
      const px=-Math.sin(ang), py=Math.cos(ang);
      for (let k=-2;k<=3;k++) {
        enemies.push({
          x:bx+px*k*64, y:by+py*k*64, r:14, kind, invuln:true,
          ang, speed:(360+G.wave*18)*Math.min(speedMul,2),
          color:[0.55,1,0.85], hitFlash:0, wobble:0,
        });
        G.spawned++;
      }
      return;
    }

    // ---- 全向疾冲怪：四面八方随机点出生，直线扑向玩家 ----
    if (kind === "dart") {
      const a = Math.random()*Math.PI*2;
      const R = 900+Math.random()*400;
      const x = player.x+Math.cos(a)*R, y = player.y+Math.sin(a)*R;
      const va = Math.atan2(player.y-y, player.x-x) + (Math.random()-0.5)*0.5;
      const sp = (300+G.wave*20)*Math.min(speedMul,2.2);
      enemies.push({
        x, y, r:13, kind, hp:Math.max(1,Math.floor(G.wave/3)), speed:sp,
        vx:Math.cos(va)*sp, vy:Math.sin(va)*sp,
        color:[0.75,0.5,1], hitFlash:0, wobble:0,
      });
      G.spawned++;
      return;
    }

    // ---- chaser / dasher：常规边缘出生 ----
    const side = Math.floor(Math.random()*4);
    let x, y;
    if (side===0){x=b.left-m;y=player.y+(Math.random()-0.5)*900;}
    else if(side===1){x=b.right+m;y=player.y+(Math.random()-0.5)*900;}
    else if(side===2){y=b.top-m;x=player.x+(Math.random()-0.5)*1400;}
    else {y=b.bottom+m;x=player.x+(Math.random()-0.5)*1400;}
    const tierChance = Math.min(0.08 + G.wave*0.05 + G.difficulty*0.04, 0.55);   // 精英概率陡增
    const tier = kind==="dasher" ? 0 : (Math.random() < tierChance ? 1 : 0);

    if (kind === "dasher") {
      // 冲撞怪：缓慢逼近 → 瞄准蓄力 → 极速冲撞，循环往复
      enemies.push({
        x, y, r:20, kind, hp:2+Math.floor(G.wave/2),
        speed:70*Math.min(speedMul,2), dashSpeed:(620+G.wave*25)*Math.min(speedMul,2.4),
        phase:"stalk", phaseT:1+Math.random(), vx:0, vy:0,
        color:[1,0.65,0.1], hitFlash:0, wobble:0,
      });
    } else {
      enemies.push({
        x, y, r: tier?30:16+Math.random()*6, kind:"chaser",
        hp: tier? Math.round((3+G.wave)*Math.min(1+G.difficulty*0.12,3)) : Math.max(1, Math.floor(G.wave/2)),
        speed: (70+Math.random()*60) * (tier?0.75:1) * Math.min(speedMul, 3),
        color: tier? [1,0.4,0.15] : [0.95,0.25,0.45],
        tier, hitFlash: 0, wobble: Math.random()*6.28,
      });
    }
    G.spawned++;
  }

  function startWave() {
    G.spawned = 0;
    G.waveQuota = Math.round(16 + G.wave*13 + G.difficulty*6);  // 每波怪量陡增，后期满屏
    G.spawnInterval = Math.max(0.05, 0.55 - G.wave*0.07);       // 刷怪间隔快速缩短
    G.spawnTimer = 0;
    ui.toast(`第 ${G.wave} 波来袭!`, 1400);
  }

  // 击杀敌人（统一处理特效/分数/掉落/移除）
  function killEnemy(j, giveScore = true) {
    const e = enemies[j];
    burst(e.x,e.y,e.color,e.tier?40:(e.kind==="dasher"?26:16),e.tier?380:(e.kind==="dasher"?320:260));
    if (giveScore) { G.kills++; G.score+=e.tier?50:(e.kind==="dasher"?25:10); }
    shake(e.tier?10:3); sfx.boom();
    if (Math.random()<0.22) dropPickup(e.x,e.y);
    enemies.splice(j,1);
  }
  // 炸弹爆炸：范围伤害 + 冲击波特效
  function explodeBomb(x, y) {
    const R = 150;
    burst(x,y,[1,0.6,0.2],36,420); burst(x,y,[1,0.9,0.5],20,260);
    shake(12); sfx.boom();
    for (let j=enemies.length-1;j>=0;j--) {
      const e=enemies[j];
      if (e.invuln) continue;
      const d=Math.hypot(e.x-x,e.y-y);
      if (d < R+e.r) {
        e.hp-=4; e.hitFlash=1;
        const kb=Math.atan2(e.y-y,e.x-x);
        if (e.kind!=="dasher") { e.x+=Math.cos(kb)*40; e.y+=Math.sin(kb)*40; }
        if (e.hp<=0) killEnemy(j);
      }
    }
  }

  function dropPickup(x, y) {
    const r = Math.random();
    if (r < 0.45) pickups.push({x, y, type:"hp", t:0});
    else if (r < 0.8) pickups.push({x, y, type:"score", t:0});
    else pickups.push({x, y, type:"power", t:0});
  }

  // ================= 输入绑定 =================
  input.bind("up","KeyW","ArrowUp");
  input.bind("down","KeyS","ArrowDown");
  input.bind("left","KeyA","ArrowLeft");
  input.bind("right","KeyD","ArrowRight");
  input.bind("fire","Space");
  input.bind("dash","ShiftLeft","ShiftRight");
  input.bind("pause","KeyP","Escape");
  input.bind("gun","Digit1"); input.bind("sword","Digit2");
  input.bind("laser","Digit3"); input.bind("bomb","Digit4");

  function restart() {
    G.state="play"; G.time=0; G.wave=1; G.score=0; G.kills=0; G.difficulty=1;
    if (G.best == null) G.best = 0;
    player.x=0; player.y=0; player.vx=player.vy=0; player.hp=player.maxHp; player.iframe=0;
    bullets.length=enemies.length=pickups.length=particles.length=0;
    startWave();
  }

  // ================= 主循环 =================
  let last = performance.now(), dmgFlash = 0;
  function frame(now) {
    requestAnimationFrame(frame);          // 先续帧：即使本帧出错，游戏也永不冻结
    try {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    G.time += dt;
    renderer.resize();

    // ---- 暂停 ----
    if (input.wasPressed("pause")) {
      if (G.state==="play"){G.state="pause";sfx.ui();}
      else if (G.state==="pause"){G.state="play";sfx.ui();}
    }
    if (G.state==="title" && (input.wasPressed("Space") || input.mousePressed())) { restart(); sfx.ui(); }
    if (G.state==="dead" && (input.wasPressed("Space") || input.mousePressed())) { restart(); sfx.ui(); }

    if (G.state === "play") {
      // ---------- 玩家移动 ----------
      let mx=(input.isDown("right")?1:0)-(input.isDown("left")?1:0);
      let my=(input.isDown("down")?1:0)-(input.isDown("up")?1:0);
      const len=Math.hypot(mx,my)||1;
      const dashing = input.isDown("dash") && player.dashCd<=0;
      if (dashing) { player.dashCd=1.6; player.iframe=Math.max(player.iframe,0.3); sfx.jump&&audio.play("jump",0.4); }
      const spd = player.speed * (dashing?3:1);
      player.vx += (mx/len*spd - player.vx) * Math.min(1, dt*12);
      player.vy += (my/len*spd - player.vy) * Math.min(1, dt*12);
      player.x += player.vx*dt; player.y += player.vy*dt;
      player.dashCd = Math.max(0, player.dashCd-dt);
      player.iframe = Math.max(0, player.iframe-dt);

      // ---------- 射击（朝鼠标，四种武器 1~4 切换） ----------
      for (const wk of ["gun","sword","laser","bomb"]) {
        if (input.wasPressed(wk)) { G.weapon=wk; sfx.ui(); ui.toast(`切换武器: ${WEAPONS[wk].name} (${WEAPONS[wk].desc})`,1200); }
      }
      player.fireCd -= dt;
      const firing = input.isDown("fire") || input.mouseDown(0);
      if (firing && player.fireCd <= 0) {
        const wp = camera.screenToWorld(input.mouse.x, input.mouse.y);
        const a = Math.atan2(wp[1]-player.y, wp[0]-player.x);
        if (G.weapon==="gun") {
          for (let k=-1;k<=1;k++){         // 三连扇形弹
            const aa=a+k*0.14;
            bullets.push({x:player.x+Math.cos(aa)*22, y:player.y+Math.sin(aa)*22,
                          vx:Math.cos(aa)*760, vy:Math.sin(aa)*760, life:0.9, friendly:true});
          }
          player.fireCd = WEAPONS.gun.cd;
          sfx.shoot();
          burst(player.x+Math.cos(a)*24, player.y+Math.sin(a)*24, [1,0.85,0.3], 3, 120);
        } else if (G.weapon==="sword") {
          // 光刃斩：近身弧形范围瞬间伤害 + 劈砍特效粒子
          const reach = 130, arc = Math.PI*0.75;
          player.fireCd = WEAPONS.sword.cd;
          sfx.slash();
          shake(3);
          for (let k=0;k<18;k++){
            const aa=a-arc/2+arc*k/17;
            particles.push({x:player.x+Math.cos(aa)*reach*0.8, y:player.y+Math.sin(aa)*reach*0.8,
              vx:Math.cos(aa)*160, vy:Math.sin(aa)*160, life:0.22, maxLife:0.22, color:[0.5,1,0.9], size:6});
          }
          for (let j=enemies.length-1;j>=0;j--) {
            const e=enemies[j];
            if (e.invuln) continue;
            const ed=Math.hypot(e.x-player.x,e.y-player.y);
            if (ed < reach+e.r) {
              const ea=Math.atan2(e.y-player.y,e.x-player.x);
              let da=Math.abs(ea-a); if (da>Math.PI) da=Math.PI*2-da;
              if (da < arc/2+e.r/Math.max(ed,1)) {
                e.hp-=3; e.hitFlash=1;
                if (e.hp<=0) { killEnemy(j); }
              }
            }
          }
        } else if (G.weapon==="laser") {
          // 激光束：细长贯穿，穿透打中路径上所有敌人
          player.fireCd = WEAPONS.laser.cd;
          sfx.shoot();
          const range=900, step=26;
          for (let s=step;s<=range;s+=step) {
            const lx=player.x+Math.cos(a)*s, ly=player.y+Math.sin(a)*s;
            particles.push({x:lx,y:ly,vx:0,vy:0,life:0.12,maxLife:0.12,color:[0.45,0.75,1],size:7});
          }
          for (let j=enemies.length-1;j>=0;j--) {
            const e=enemies[j];
            if (e.invuln) continue;
            const ex=e.x-player.x, ey=e.y-player.y;
            const proj=ex*Math.cos(a)+ey*Math.sin(a);          // 沿射线投影
            if (proj<0 || proj>range) continue;
            const perp=Math.abs(-ex*Math.sin(a)+ey*Math.cos(a)); // 垂直距离
            if (perp < e.r+10) {
              e.hp-=1; e.hitFlash=1;
              if (e.hp<=0) killEnemy(j);
            }
          }
        } else {
          // 炸弹：慢速抛射弹，命中或到时爆炸，范围伤害+击退
          bullets.push({x:player.x+Math.cos(a)*24, y:player.y+Math.sin(a)*24,
                        vx:Math.cos(a)*420, vy:Math.sin(a)*420, life:0.75, friendly:true, bomb:true});
          player.fireCd = WEAPONS.bomb.cd;
          sfx.shoot();
        }
      }

      // ---------- 波次刷怪（配额制，随波次批量刷） ----------
      G.waveTimer -= dt;
      if (G.waveTimer <= 0 && G.spawned < G.waveQuota) {
        G.spawnTimer -= dt;
        if (G.spawnTimer <= 0) {
          const burstN = 2 + Math.floor(G.wave * 1.5);            // 高波次一次刷一大群
          for (let k = 0; k < burstN && G.spawned < G.waveQuota; k++) spawnEnemy(k > 0);
          G.spawnTimer = G.spawnInterval;
        }
      }

      // ---------- 敌人 AI ----------
      for (let i=enemies.length-1;i>=0;i--) {
        const e=enemies[i];
        const dx=player.x-e.x, dy=player.y-e.y, d=Math.hypot(dx,dy)||1;
        e.hitFlash = Math.max(0, e.hitFlash-dt*6);

        if (e.kind==="runner") {
          // 斜线奔跑：锁定角度直线狂奔，无敌，冲出远处即消失
          e.x += Math.cos(e.ang)*e.speed*dt;
          e.y += Math.sin(e.ang)*e.speed*dt;
          if (d > 2200) { enemies.splice(i,1); continue; }
          if (player.iframe<=0 && d < e.r+player.r) {
            player.hp -= 8; player.iframe = 0.7; dmgFlash = 0.3;
            shake(6); sfx.hurt();
          }
          continue;
        }
        if (e.kind==="dart") {
          // 全向疾冲：一次锁定方向高速直线，掠过即消散（远处生命周期结束）
          e.x += e.vx*dt; e.y += e.vy*dt;
          e.wobble += dt*10;
          if (d > 1800) { enemies.splice(i,1); continue; }
          if (player.iframe<=0 && d < e.r+player.r) {
            player.hp -= 12; player.iframe = 0.7; dmgFlash = 0.35;
            shake(10); sfx.hurt();
            const kb=Math.atan2(-dy,-dx);
            player.vx += Math.cos(kb)*360; player.vy += Math.sin(kb)*360;
            burst(e.x,e.y,e.color,14,240);
            enemies.splice(i,1); G.kills++;   // 撞玩家后自毁（不给分）
            continue;
          }
          continue;
        }
        if (e.kind==="dasher") {
          // 冲撞怪：游荡逼近 → 停顿蓄力闪红 → 极速冲撞 → 疲劳恢复
          e.phaseT -= dt;
          if (e.phase==="stalk") {
            e.vx = dx/d*e.speed; e.vy = dy/d*e.speed;
            if (e.phaseT<=0 && d < 700) { e.phase="aim"; e.phaseT=0.55; e.vx=e.vy=0; }
            else if (e.phaseT<=0) e.phaseT = 1+Math.random();
          } else if (e.phase==="aim") {
            e.aimA = Math.atan2(dy,dx);          // 蓄力锁定方向
            if (e.phaseT<=0) {
              e.phase="charge"; e.phaseT=0.8;
              e.vx=Math.cos(e.aimA)*e.dashSpeed; e.vy=Math.sin(e.aimA)*e.dashSpeed;
              sfx.ui();
            }
          } else { // charge
            if (e.phaseT<=0) { e.phase="stalk"; e.phaseT=1.2+Math.random(); }
          }
          e.x += e.vx*dt; e.y += e.vy*dt;
          if (player.iframe<=0 && d < e.r+player.r) {
            player.hp -= e.phase==="charge"?30:12;
            player.iframe = 0.7; dmgFlash = 0.4;
            shake(e.phase==="charge"?18:9); sfx.hurt();
            const kb=Math.atan2(-dy,-dx);
            player.vx += Math.cos(kb)*(e.phase==="charge"?650:420);
            player.vy += Math.sin(kb)*(e.phase==="charge"?650:420);
          }
          continue;
        }
        // chaser：原追击逻辑
        e.wobble += dt*6;
        e.vx = dx/d*e.speed + Math.cos(e.wobble)*18;
        e.vy = dy/d*e.speed + Math.sin(e.wobble)*18;
        e.x += e.vx*dt; e.y += e.vy*dt;
        // 撞玩家
        if (player.iframe<=0 && d < e.r+player.r) {
          player.hp -= e.tier?25:10;
          player.iframe = 0.7;
          dmgFlash = 0.35;
          shake(e.tier?14:8);
          sfx.hurt();
          const kb=Math.atan2(-dy,-dx);
          player.vx += Math.cos(kb)*420; player.vy += Math.sin(kb)*420;
          if (player.hp<=0) {
            player.hp=0; G.state="dead"; G.best=Math.max(G.best??0,G.score);
            burst(player.x,player.y,[1,0.4,0.2],60,420);
            shake(24); sfx.boom();
          }
        }
      }
      // 敌人两两分离（简易）
      for (let i=0;i<enemies.length;i++) for (let j=i+1;j<enemies.length;j++) {
        const a=enemies[i],b=enemies[j];
        if (a.kind==="runner"||a.kind==="dart"||b.kind==="runner"||b.kind==="dart") continue;
        const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy), min=a.r+b.r;
        if (d>0 && d<min) {
          const push=(min-d)/d*0.5;
          a.x-=dx*push; a.y-=dy*push; b.x+=dx*push; b.y+=dy*push;
        }
      }

      // ---------- 子弹 ----------
      for (let i=bullets.length-1;i>=0;i--) {
        const b=bullets[i];
        b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
        let dead=b.life<=0;
        if (dead && b.bomb) { explodeBomb(b.x,b.y); bullets.splice(i,1); continue; }
        if (b.friendly) {
          for (let j=enemies.length-1;j>=0;j--) {
            const e=enemies[j];
            if (e.invuln) continue;               // 无敌怪（斜线奔跑队）不受伤害
            if (Math.hypot(e.x-b.x,e.y-b.y) < e.r+4) {
              if (b.bomb) { explodeBomb(b.x,b.y); dead=true; break; }
              e.hp--; e.hitFlash=1; dead=true;
              burst(b.x,b.y,[1,0.9,0.5],5,180);
              if (e.hp<=0) {
                killEnemy(j);
              } else sfx.hit();
              break;
            }
          }
        }
        if (dead) bullets.splice(i,1);
      }

      // ---------- 道具 ----------
      for (let i=pickups.length-1;i>=0;i--) {
        const p=pickups[i]; p.t+=dt;
        const d=Math.hypot(player.x-p.x,player.y-p.y);
        if (d<200) { p.x+=(player.x-p.x)/d*260*dt; p.y+=(player.y-p.y)/d*260*dt; } // 磁吸
        if (d<player.r+14) {
          if (p.type==="hp"){player.hp=Math.min(player.maxHp,player.hp+20);ui.toast("+20 HP",900);}
          else if (p.type==="score"){G.score+=30;}
          else {G.difficulty+=0; player.speed=Math.min(520,player.speed+12); ui.toast("引擎强化!",900);}
          sfx.pick(); pickups.splice(i,1);
        } else if (p.t>12) pickups.splice(i,1);
      }

      // ---------- 波次推进（配额刷完且场上清空，1.2 秒缓冲后进入下一波） ----------
      if (G.spawned >= G.waveQuota && enemies.length===0) {
        if (G._clearT===undefined) G._clearT=G.time;
        if (G.time-G._clearT>0.5) { G.wave++; G.difficulty+=1.5; G._clearT=undefined; startWave(); }
      } else if (G.spawned < G.waveQuota) G._clearT=undefined;

      // ---------- 粒子 ----------
      for (let i=particles.length-1;i>=0;i--) {
        const p=particles[i];
        p.x+=p.vx*dt; p.y+=p.vy*dt;
        p.vx*=Math.exp(-2.2*dt); p.vy*=Math.exp(-2.2*dt);
        p.life-=dt;
        if (p.life<=0) particles.splice(i,1);
      }
    }

    dmgFlash = Math.max(0, dmgFlash-dt);

    // ================= 渲染 =================
    n = 0;
    // 背景视差星空（三层深度）
    for (const s of stars) {
      const c = 0.25 + s.z*0.5;
      push(s.x + camera.x*(1-s.z), s.y + camera.y*(1-s.z), s.s*2, s.s*2, c, c, c*1.1);
    }
    // 道具
    for (const p of pickups) {
      const pulse = 1+Math.sin(p.t*6)*0.2;
      const col = p.type==="hp"?[0.2,1,0.4]:p.type==="score"?[1,0.9,0.3]:[0.4,0.8,1];
      push(p.x,p.y,22*pulse,22*pulse,col[0],col[1],col[2]);
    }
    // 敌人
    for (const e of enemies) {
      const f=e.hitFlash;
      let r=e.color[0],g=e.color[1],bl=e.color[2];
      if (e.kind==="runner") {                       // 无敌奔跑队：呼吸发光
        const glow = 0.75+Math.sin(G.time*10+e.x*0.01)*0.25;
        g = Math.min(1, g*glow+0.2);
      }
      if (e.kind==="dasher" && e.phase==="aim") {    // 冲撞怪蓄力：闪红预警
        const blink = Math.floor(G.time*14)%2===0;
        r = blink?1:1; g = blink?0.1:0.65; bl = blink?0.1:0.1;
      }
      push(e.x,e.y,e.r*2,e.r*2,
        r+f*(1-r), g+f*(1-g), bl+f*(1-bl));
    }
    // 子弹
    for (const b of bullets) {
      if (b.bomb) { push(b.x,b.y,16,16, 1,0.5,0.2); continue; }
      push(b.x,b.y,10,10, b.friendly?1:1, b.friendly?0.9:0.3, b.friendly?0.4:0.5);
    }
    // 粒子
    for (const p of particles) {
      const a=p.life/p.maxLife;
      push(p.x,p.y,p.size*a+1,p.size*a+1, p.color[0],p.color[1]*a+0.2*a,p.color[2]*a+0.1*a);
    }
    // 玩家（闪烁表示无敌帧）
    if (G.state!=="title" && !(player.iframe>0 && Math.floor(G.time*20)%2===0) && G.state!=="dead") {
      // 冲刺冷却环（简化为小方块亮度）
      const dashReady = player.dashCd<=0;
      push(player.x,player.y,player.r*2,player.r*2, 0.3, dashReady?0.85:0.4, 1);
      // 炮口指示（朝鼠标）
      const wp=camera.screenToWorld(input.mouse.x,input.mouse.y);
      const a=Math.atan2(wp[1]-player.y,wp[0]-player.x);
      push(player.x+Math.cos(a)*24, player.y+Math.sin(a)*24, 12,12, 1,0.95,0.5);
    }
    renderer.render(n);

    // 世界坐标文字（跟随物体）
    if (G.state==="play"||G.state==="pause")
      renderer.drawText(`WAVE ${G.wave}`, camera.x, camera.y - camera.viewH/2/camera.zoom + 60,
        { scale: 2.2, color: [0.4,0.8,1], align: "center" });

    // ================= HUD =================
    const hpCells = Math.max(0, Math.min(10, Math.ceil(player.hp/10)));
    hud.set("hp",   `HP ${"█".repeat(hpCells)}${"░".repeat(10-hpCells)} ${Math.max(0,player.hp)}/${player.maxHp}`);
    hud.set("stat", `分数 ${G.score}   击杀 ${G.kills}   波次 ${G.wave}`);
    hud.set("ctrl", `武器[1-4]: ${WEAPONS[G.weapon].name} · WASD移动 · 鼠标/空格射击 · Shift冲刺 · P暂停`);

    // 视觉对话框：标题 / 死亡 / 暂停（替代旧的 hud 大字提示）
    if (G.state==="title") {
      dlgShow("星火守卫", [
        `最高分 ${G.best??0}　·　守卫星域，抵御虫潮`,
        "WASD 移动 · 鼠标射击 · Shift 冲刺",
      ], "▶ 点击或按空格开始");
    } else if (G.state==="dead") {
      dlgShow("战斗结束", [
        `最终分数 <b style="color:#ffd76a">${G.score}</b>`,
        `击杀 ${G.kills} · 坚持到第 ${G.wave} 波`,
        `最高分 ${G.best??G.score}`,
      ], "▶ 按空格重新开始", true);
    } else if (G.state==="pause") {
      dlgShow("已暂停", ["战斗暂时停止，敌人正在等待..."], "▶ 按 P 继续");
    } else dlgHide();

    renderer._dt = dt;
    camera.update(dt, renderer.canvas.width/camera.zoom, renderer.canvas.height/camera.zoom);
    input.endFrame();
    } catch (err) {
      console.error("[frame]", err);
      input.endFrame();
      const ed = document.getElementById("errdlg"), em = document.getElementById("errmsg");
      if (ed && em) { em.textContent = String(err && err.stack || err); ed.style.display = "flex"; }
    }
  }
  window.addEventListener("error", e => {
    const ed = document.getElementById("errdlg"), em = document.getElementById("errmsg");
    if (ed && em && e.error) { em.textContent = String(e.error.stack || e.error); ed.style.display = "flex"; }
  });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
