<!DOCTYPE html>
<html lang="zh">
<head>
    <script src="/js/storage-guard.js?v=1"></script>
<meta charset="utf-8">
<title>贪吃蛇 - Snake Demo</title>
<style>
  html,body{margin:0;height:100%;background:#111;color:#9fe89f;font-family:Consolas,monospace;
    display:flex;flex-direction:column;align-items:center;justify-content:center}
  canvas{background:#0a1a0a;border:2px solid #2f6f2f;image-rendering:pixelated}
  #bar{margin-bottom:10px;letter-spacing:2px}
  #tip{margin-top:10px;color:#557755;font-size:13px}
</style>
</head>
<body>
<div id="bar">分数: <span id="score">0</span>　最高: <span id="best">0</span></div>
<canvas id="cv" width="480" height="480"></canvas>
<div id="tip">方向键 / WASD 移动 · 空格 暂停 · 死亡后按任意方向键重开</div>
<script>
"use strict";
const CELL = 24, COLS = 20, ROWS = 20;
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const scoreEl = document.getElementById("score"), bestEl = document.getElementById("best");

let snake, dir, nextDir, food, score, best = 0, dead = false, paused = false, timer = 0, speed = 130;

function reset() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; nextDir = dir; score = 0; dead = false; paused = false; speed = 130;
  scoreEl.textContent = 0; placeFood();
}
function placeFood() {
  do { food = {x: (Math.random()*COLS)|0, y: (Math.random()*ROWS)|0}; }
  while (snake.some(s => s.x===food.x && s.y===food.y));
}
function step() {
  dir = nextDir;
  const head = {x: snake[0].x+dir.x, y: snake[0].y+dir.y};
  if (head.x<0||head.y<0||head.x>=COLS||head.y>=ROWS ||
      snake.some(s=>s.x===head.x&&s.y===head.y)) { dead = true; GameSound.play('die'); return; }
  snake.unshift(head);
  if (head.x===food.x && head.y===food.y) {
    score += 10; scoreEl.textContent = score; GameSound.play('eat');
    if (score > best) { best = score; bestEl.textContent = best; }
    if (speed > 60) speed -= 4;           // 越吃越快
    placeFood();
  } else snake.pop();
}
function draw() {
  ctx.fillStyle = "#0a1a0a"; ctx.fillRect(0,0,cv.width,cv.height);
  // 网格
  ctx.strokeStyle = "#12240f"; ctx.lineWidth = 1;
  for (let i=1;i<COLS;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,cv.height);ctx.stroke();}
  for (let i=1;i<ROWS;i++){ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(cv.width,i*CELL);ctx.stroke();}
  // 食物
  ctx.fillStyle = "#e85f5f";
  ctx.beginPath(); ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, CELL*0.35, 0, 7); ctx.fill();
  // 蛇
  snake.forEach((s,i) => {
    ctx.fillStyle = i===0 ? "#aaffaa" : "#5fbf5f";
    ctx.fillRect(s.x*CELL+2, s.y*CELL+2, CELL-4, CELL-4);
  });
  if (dead) {
    ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle = "#ff8888"; ctx.font = "32px Consolas"; ctx.textAlign = "center";
    ctx.fillText("GAME OVER", cv.width/2, cv.height/2 - 10);
    ctx.fillStyle = "#9fe89f"; ctx.font = "16px Consolas";
    ctx.fillText("按方向键重新开始  分数: "+score, cv.width/2, cv.height/2 + 24);
  }
  if (paused && !dead) {
    ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle = "#9fe89f"; ctx.font = "24px Consolas"; ctx.textAlign = "center";
    ctx.fillText("已暂停 (空格继续)", cv.width/2, cv.height/2);
  }
}
const KEYMAP = {
  ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0},
  KeyW:{x:0,y:-1}, KeyS:{x:0,y:1}, KeyA:{x:-1,y:0}, KeyD:{x:1,y:0}
};
addEventListener("keydown", e => {
  const d = KEYMAP[e.code];
  if (d) {
    e.preventDefault();
    if (dead) { reset(); return; }
    if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;  // 禁止直接掉头
  } else if (e.code === "Space") { e.preventDefault(); if (!dead) paused = !paused; }
});
let last = performance.now();
function loop(t) {
  const dt = t - last; last = t;
  if (!dead && !paused) { timer += dt; if (timer >= speed) { timer = 0; step(); } }
  draw(); requestAnimationFrame(loop);
}
reset(); requestAnimationFrame(loop);
</script>
</body>
</html>
