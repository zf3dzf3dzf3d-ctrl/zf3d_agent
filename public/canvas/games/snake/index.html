<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="/js/storage-guard.js?v=1"></script>
<meta charset="UTF-8">
<title>贪吃蛇</title>
<style>
  html,body{margin:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#141420;color:#eee;font-family:Consolas,monospace;user-select:none}
  h1{margin:8px 0;font-size:18px}
  #score{font-size:16px;margin-bottom:8px}
  canvas{background:#1c1c2e;border:2px solid #4a4ae8;border-radius:6px;image-rendering:pixelated}
  #tip{margin-top:8px;font-size:13px;color:#999}
  #over{position:absolute;font-size:24px;color:#ff5555;display:none}
  #wrap{position:relative}
  button{margin-top:10px;padding:6px 18px;background:#4a4ae8;border:0;color:#fff;border-radius:4px;cursor:pointer;font-size:14px}
</style>
</head>
<body>
<h1>🐍 贪吃蛇</h1>
<div id="score">得分：0　最高：0</div>
<div id="wrap">
  <canvas id="cv" width="400" height="400"></canvas>
  <div id="over">游戏结束</div>
</div>
<button onclick="location.reload()">重新开始</button>
<div id="tip">方向键 / WASD 控制，空格暂停</div>
<script src="/js/game-sound.js"></script>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const G=20,N=20; // 格子20px，20x20
let snake,dir,food,score,best=+(localStorage.getItem('snake_best')||0),paused=false,dead=false;
const $=id=>document.getElementById(id);
function reset(){
  snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];
  dir={x:1,y:0}; score=0; dead=false; paused=false;
  $('over').style.display='none'; placeFood(); draw(); updateHud();
}
// 游戏循环改为 rAF 驱动：iframe 内 setInterval 会被浏览器节流导致卡顿
function placeFood(){
  do{food={x:Math.random()*N|0,y:Math.random()*N|0}}
  while(snake.some(s=>s.x===food.x&&s.y===food.y));
}
function updateHud(){$('score').textContent=`得分：${score}　最高：${best}`}
function step(){
  if(paused||dead)return;
  const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)){
    dead=true; GameSound.play('die');
    if(score>best){best=score;localStorage.setItem('snake_best',best);GameSound.play('win')}
    $('over').style.display='block'; updateHud(); return;
  }
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){score+=10;GameSound.play('eat');placeFood();updateHud()}
  else snake.pop();
  draw();
}
function draw(){
  ctx.fillStyle='#1c1c2e';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#ffcc44';
  ctx.beginPath();ctx.arc(food.x*G+G/2,food.y*G+G/2,G/2-3,0,7);ctx.fill();
  snake.forEach((s,i)=>{
    ctx.fillStyle=i===0?'#5aff8a':'#3ac96a';
    ctx.fillRect(s.x*G+1,s.y*G+1,G-2,G-2);
  });
}
addEventListener('keydown',e=>{
  if(e.repeat)return; // 长按产生的重复事件直接丢弃，避免输入堆积卡顿
  const k=e.key.toLowerCase();
  const m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];
  if(m&&!(m[0]===-dir.x&&m[1]===-dir.y)){dir={x:m[0],y:m[1]};GameSound.play('turn');e.preventDefault()}
  if(k===' '){paused=!paused;GameSound.play('pause');e.preventDefault()}
});
// 窗口/iframe 失焦自动暂停，回来后再按空格继续
addEventListener('blur',()=>{paused=true});
addEventListener('visibilitychange',()=>{if(document.hidden)paused=true});

// rAF 主循环：按真实时间累积，120ms 走一步，不受定时器节流影响
let acc=0,lastT=performance.now();
function loop(t){
  const dt=Math.min(t-lastT,250); lastT=t;
  if(!paused&&!dead){acc+=dt; while(acc>=120){acc-=120;step();}}
  draw(); requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
