<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="/js/storage-guard.js?v=1"></script>
<meta charset="UTF-8">
<title>HTML 演示查看器</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0d0f14; font-family:"Microsoft YaHei",sans-serif; color:#e8eaf0; overflow:hidden; }

  /* 放映区 */
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  .slide {
    width:1280px; height:720px; color:#f2f4f8;
    background:radial-gradient(1200px 800px at 20% -10%, #1c2233 0%, #12141c 55%, #0b0c12 100%);
    border-radius:18px; box-shadow:0 30px 90px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.06);
    padding:70px 90px; transform-origin:center center;
    display:flex; flex-direction:column; position:relative; overflow:hidden;
  }
  /* 顶部氛围光晕 */
  .slide::before { content:''; position:absolute; top:-160px; right:-120px; width:480px; height:480px;
    border-radius:50%; background:radial-gradient(circle, color-mix(in srgb, var(--accent,#4f6ef7) 28%, transparent), transparent 70%);
    filter:none; pointer-events:none; }
  .slide h1 { font-size:54px; margin-bottom:16px; font-weight:800; letter-spacing:-1px; }
  .slide h2 { font-size:42px; margin-bottom:34px; font-weight:800; letter-spacing:-0.5px; }
  .slide h2 em { font-style:normal; background:linear-gradient(90deg, var(--accent,#4f6ef7), #9f7bff);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .slide p, .slide li { font-size:23px; line-height:1.8; color:#c9cfdd; }
  .slide .foot { position:absolute; bottom:24px; right:40px; font-size:14px; color:#5a6070; }
  .slide.cover { justify-content:center; align-items:center; text-align:center;
    background:radial-gradient(900px 600px at 50% 120%, color-mix(in srgb, var(--accent,#4f6ef7) 26%, #0b0c12), #0b0c12 70%); }
  .slide.cover h1 { font-size:72px; background:linear-gradient(120deg,#fff, #b9c4e8);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .slide.cover p { color:#8a92a8; font-size:26px; margin-top:14px; }

  /* ===== 卡片式内容（苹果发布会风） ===== */
  .cards { display:grid; gap:20px; margin-top:8px; }
  .cards.c2 { grid-template-columns:1fr 1fr; }
  .cards.c3 { grid-template-columns:repeat(3,1fr); }
  .card { background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.09);
    border-radius:16px; padding:26px 28px; 
    box-shadow:0 8px 30px rgba(0,0,0,.35); transition:transform .2s; }
  .card:hover { transform:translateY(-3px); }
  .card h3 { font-size:22px; color:#fff; margin-bottom:10px; font-weight:700;
    display:flex; align-items:center; gap:10px; }
  .card h3::before { content:''; width:10px; height:10px; border-radius:3px; flex:none;
    background:linear-gradient(135deg, var(--accent,#4f6ef7), #9f7bff);
    box-shadow:0 0 12px color-mix(in srgb, var(--accent,#4f6ef7) 70%, transparent); }
  .card p { font-size:18px; line-height:1.65; color:#aeb6c8; }
  .panel { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08);
    border-radius:16px; padding:30px 36px; }
  .panel p { font-size:24px; }
  .panel p + p { margin-top:16px; }

  /* ===== scene 自由画布页型 ===== */
  .slide.scene { padding:0; display:block; background:radial-gradient(1000px 700px at 30% -10%, #1c2233, #0d0f18 70%); }
  .slide.scene .el { position:absolute; transform-origin:center center; }
  .slide.scene .el.wb-sel { outline:3px dashed #36d399; outline-offset:3px; cursor:pointer; }
  .slide.scene .el:hover { outline:2px dashed #4f6ef7; outline-offset:2px; }
  .slide.scene .el-text { line-height:1.4; word-break:break-word; }
  .slide.scene .el-shape { border-radius:8px; }
  .slide.scene .el-image img, .slide.scene .el-image { width:100%; height:100%; object-fit:contain; border-radius:inherit; }

  /* 元素入场动画（叠加在定位 transform 上：定位用 left/top，动画只动 opacity/translate/scale 子属性） */
  @keyframes elFade { from{opacity:0} to{opacity:var(--op,1)} }
  @keyframes elUp    { from{opacity:0; translate:0 40px} to{opacity:var(--op,1); translate:0 0} }
  @keyframes elDown  { from{opacity:0; translate:0 -40px} to{opacity:var(--op,1); translate:0 0} }
  @keyframes elLeft  { from{opacity:0; translate:-60px 0} to{opacity:var(--op,1); translate:0 0} }
  @keyframes elRight { from{opacity:0; translate:60px 0} to{opacity:var(--op,1); translate:0 0} }
  @keyframes elZoom  { from{opacity:0; scale:.4} to{opacity:var(--op,1); scale:1} }
  @keyframes elPop   { 0%{opacity:0; scale:.2} 70%{opacity:var(--op,1); scale:1.15} 100%{scale:1} }
  @keyframes elSpin  { from{opacity:0; rotate:-360deg; scale:.3} to{opacity:var(--op,1); rotate:0deg; scale:1} }
  /* 元素持续动画（与入场组合，作用于内层 wrap 避免属性冲突） */
  @keyframes loopFloat { 0%,100%{translate:0 0} 50%{translate:0 -14px} }
  @keyframes loopPulse { 0%,100%{scale:1} 50%{scale:1.08} }
  @keyframes loopSpin  { to{rotate:360deg} }
  @keyframes loopBlink { 0%,100%{opacity:1} 50%{opacity:.25} }
  .el-loop-float { animation:loopFloat 3s ease-in-out infinite; }
  .el-loop-pulse { animation:loopPulse 2s ease-in-out infinite; }
  .el-loop-spin  { animation:loopSpin 8s linear infinite; }
  .el-loop-blink { animation:loopBlink 1.6s ease-in-out infinite; }
  .slide.scene .el .wrap { width:100%; height:100%; }
  .slide.scene .el .has-enter { animation-fill-mode:both; }

  /* ===== 切换/入场动画 ===== */
  @keyframes slideInR { from { opacity:0; translate:90px 0; } to { opacity:1; translate:0 0; } }
  @keyframes slideInL { from { opacity:0; translate:-90px 0; } to { opacity:1; translate:0 0; } }
  .slide.anim-r { animation:slideInR .38s cubic-bezier(.22,.9,.3,1); }
  .slide.anim-l { animation:slideInL .38s cubic-bezier(.22,.9,.3,1); }
  @keyframes fadeUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:none; } }
  @keyframes cardInL { from { opacity:0; transform:translateX(-46px); } to { opacity:1; transform:none; } }
  @keyframes cardInR { from { opacity:0; transform:translateX(46px); } to { opacity:1; transform:none; } }
  .stat, .card { animation:fadeUp .55s cubic-bezier(.22,.9,.3,1) both; }
  /* 卡片/统计块左右交替入场，错峰更有节奏感 */
  .slide .stat:nth-child(odd), .slide .card:nth-child(odd) { animation-name:cardInL; }
  .slide .stat:nth-child(even), .slide .card:nth-child(even) { animation-name:cardInR; }
  .slide .stat:nth-child(1), .slide .card:nth-child(1) { animation-delay:.12s; }
  .slide .stat:nth-child(2), .slide .card:nth-child(2) { animation-delay:.24s; }
  .slide .stat:nth-child(3), .slide .card:nth-child(3) { animation-delay:.36s; }
  .slide .stat:nth-child(n+4), .slide .card:nth-child(n+4) { animation-delay:.48s; }
  .slide.anim-r > *, .slide.anim-l > * { animation:fadeUp .5s cubic-bezier(.22,.9,.3,1) both; }
  .slide.anim-r > .card, .slide.anim-l > .card,
  .slide.anim-r > .stat, .slide.anim-l > .stat { animation-name:cardInL; }
  .slide.anim-r > .card:nth-of-type(even), .slide.anim-l > .card:nth-of-type(even),
  .slide.anim-r > .stat:nth-of-type(even), .slide.anim-l > .stat:nth-of-type(even) { animation-name:cardInR; }
  .slide.anim-r > *:nth-child(1) { animation-delay:.10s; }
  .slide.anim-r > *:nth-child(2) { animation-delay:.20s; }
  .slide.anim-r > *:nth-child(3) { animation-delay:.30s; }
  .slide.anim-r > *:nth-child(n+4) { animation-delay:.40s; }
  .slide.anim-l > *:nth-child(1) { animation-delay:.10s; }
  .slide.anim-l > *:nth-child(2) { animation-delay:.20s; }
  .slide.anim-l > *:nth-child(3) { animation-delay:.30s; }
  .slide.anim-l > *:nth-child(n+4) { animation-delay:.40s; }
  @keyframes footIn { from { opacity:0 } to { opacity:1 } }
  .slide.anim-r > .foot, .slide.anim-l > .foot { animation:footIn .6s .5s both; }

  /* ===== 扩展页型：大数字 / 图表 / 时间轴 / 引用 / 分栏 / 表格 ===== */
  .stats { display:grid; gap:20px; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); margin-top:8px; }
  .stat { text-align:center; background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.09);
    border-radius:16px; padding:30px 18px; }
  .stat .num { font-size:56px; font-weight:800; letter-spacing:-1px;
    background:linear-gradient(120deg,var(--accent,#4f6ef7),#9f7bff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:numIn .8s cubic-bezier(.22,.9,.3,1) both; }
  .stat .num small { font-size:26px; }
  .stat .lab { font-size:17px; color:#aeb6c8; margin-top:8px; }
  @keyframes numIn { from{opacity:0; scale:.5; } to{opacity:1; scale:1} }

  .chartwrap { flex:1; display:flex; align-items:flex-end; gap:34px; padding:20px 30px 10px; min-height:0; }
  .barcol { flex:1; display:flex; flex-direction:column; align-items:center; gap:10px; height:100%; justify-content:flex-end; }
  .barcol .bv { font-size:20px; font-weight:700; color:#fff; }
  .barcol .bar { width:100%; max-width:90px; border-radius:10px 10px 4px 4px;
    background:linear-gradient(180deg,var(--accent,#4f6ef7),color-mix(in srgb,var(--accent,#4f6ef7) 35%,#12141c));
    box-shadow:0 0 18px color-mix(in srgb,var(--accent,#4f6ef7) 40%,transparent);
    animation:barUp .9s cubic-bezier(.22,.9,.3,1) both; transform-origin:bottom; }
  @keyframes barUp { from{scale:1 0; opacity:0} to{scale:1 1; opacity:1} }
  .barcol .bl { font-size:17px; color:#aeb6c8; }
  .linechart { flex:1; min-height:0; }
  .linechart path.ln { fill:none; stroke:var(--accent,#4f6ef7); stroke-width:4; stroke-linecap:round; stroke-linejoin:round;
    filter:drop-shadow(0 0 8px color-mix(in srgb,var(--accent,#4f6ef7) 60%,transparent));
    stroke-dasharray:2400; stroke-dashoffset:2400; animation:draw 1.4s .2s ease-out forwards; }
  .linechart circle { fill:var(--accent,#4f6ef7); opacity:0; animation:dotIn .4s both; }
  @keyframes draw { to{stroke-dashoffset:0} }
  @keyframes dotIn { from{opacity:0; scale:0} to{opacity:1; scale:1} }
  .radar-poly { transform-origin:500px 400px; transform-box:view-box;
    stroke-dasharray:3000; stroke-dashoffset:3000; animation:radarIn 1.1s .2s ease-out forwards; }
  @keyframes radarIn { 0%{stroke-dashoffset:3000; fill-opacity:0} 60%{fill-opacity:0} 100%{stroke-dashoffset:0; fill-opacity:1} }
  .donutwrap { flex:1; display:flex; align-items:center; gap:50px; }
  .donut { width:300px; height:300px; border-radius:50%; flex:none; position:relative;
    animation:zoomIn .8s cubic-bezier(.22,.9,.3,1) both; }
  .donut::after { content:''; position:absolute; inset:22%; border-radius:50%; background:#12141c; box-shadow:inset 0 0 20px rgba(0,0,0,.6); }
  @keyframes zoomIn { from{opacity:0; scale:.6; rotate:-30deg} to{opacity:1; scale:1; rotate:0deg} }
  .legend { display:flex; flex-direction:column; gap:14px; }
  .legend div { display:flex; align-items:center; gap:12px; font-size:20px; color:#c9cfdd; }
  .legend i { width:14px; height:14px; border-radius:4px; flex:none; }

  /* 横向占比条（share/progress，替代旧环形图） */
  .sharewrap { flex:1; display:flex; flex-direction:column; justify-content:center; gap:28px; padding-right:30px; }
  .sharerow { animation:fadeUp .6s both; }
  .sharerow .sr-top { display:flex; justify-content:space-between; align-items:baseline; font-size:19px; color:#c9cfdd; margin-bottom:9px; }
  .sharerow .sr-top b { color:#fff; font-size:21px; }
  .sharerow .track { height:16px; border-radius:8px; background:rgba(255,255,255,.07); overflow:hidden; }
  .sharerow .fill { height:100%; border-radius:8px;
    background:linear-gradient(90deg, var(--col,#4f6ef7), color-mix(in srgb, var(--col,#4f6ef7) 45%, #9f7bff));
    box-shadow:0 0 12px color-mix(in srgb, var(--col,#4f6ef7) 55%, transparent);
    transform-origin:left; animation:growX 1s .15s cubic-bezier(.22,.9,.3,1) both; }
  @keyframes growX { from{transform:scaleX(0)} to{transform:scaleX(1)} }

  /* 图片组合 */
  .gallery { flex:1; display:grid; gap:14px; margin-top:4px; min-height:0; }
  .gallery .gitem { min-height:0; overflow:hidden; border-radius:12px;
    border:1px solid rgba(255,255,255,.08); box-shadow:0 10px 26px rgba(0,0,0,.45); animation:imgIn .6s both; }
  .gallery .gitem img { width:100%; height:100%; object-fit:cover; display:block; }
  .gallery .gitem figcaption { position:absolute; left:0; right:0; bottom:0; padding:8px 14px;
    font-size:15px; color:#dfe4ef; background:linear-gradient(transparent, rgba(0,0,0,.75)); }
  .gallery .gitem { position:relative; }
  @keyframes imgIn { from{opacity:0; scale:.93} to{opacity:1; scale:1} }
  .gcap { font-size:18px; color:#aeb6c8; margin-top:14px; text-align:center; }

  /* 左文右图 */
  .splitwrap { flex:1; display:flex; gap:48px; align-items:center; min-height:0; }
  .splitwrap .split-text { flex:1.15; min-height:0; }
  .splitwrap .split-text p, .splitwrap .split-text li { font-size:22px; }
  .splitwrap .split-img { flex:1; height:82%; min-height:0; border-radius:16px; overflow:hidden;
    border:1px solid rgba(255,255,255,.1); box-shadow:0 14px 40px rgba(0,0,0,.5); animation:imgInR .8s .15s both; }
  .splitwrap .split-img img { width:100%; height:100%; object-fit:cover; display:block; }
  @keyframes imgInR { from{opacity:0; translate:70px 0} to{opacity:1; translate:0 0} }

  .timeline { flex:1; display:flex; align-items:stretch; margin-top:30px; position:relative; }
  .timeline::before { content:''; position:absolute; top:26px; left:4%; right:4%; height:2px;
    background:linear-gradient(90deg,transparent,var(--accent,#4f6ef7),#9f7bff,transparent); }
  .tstep { flex:1; padding:0 14px; text-align:center; animation:fadeUp .6s both; }
  .tstep .dot { width:18px; height:18px; border-radius:50%; margin:18px auto 16px;
    background:var(--accent,#4f6ef7); box-shadow:0 0 14px var(--accent,#4f6ef7); border:3px solid #0d0f14; position:relative; z-index:1; }
  .tstep h4 { font-size:21px; color:#fff; margin-bottom:8px; }
  .tstep p { font-size:16px; color:#aeb6c8; line-height:1.6; }

  .quotebox { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .quotebox .q { font-size:38px; line-height:1.6; font-weight:700; color:#fff; }
  .quotebox .q::before { content:'“'; font-size:80px; color:var(--accent,#4f6ef7); line-height:0;
    vertical-align:-24px; margin-right:8px; }
  .quotebox .a { margin-top:26px; font-size:20px; color:#8a92a8; padding-left:52px; }

  .split { flex:1; display:grid; grid-template-columns:1fr 1fr; gap:40px; align-items:center; min-height:0; }
  .split .img img { width:100%; max-height:480px; object-fit:contain; border-radius:16px;
    box-shadow:0 20px 50px rgba(0,0,0,.5); animation:imgIn .8s cubic-bezier(.22,.9,.3,1) both; }
  @keyframes imgIn { from{opacity:0; scale:.92} to{opacity:1; scale:1} }
  .split .txt p, .split .txt li { font-size:22px; line-height:1.8; color:#c9cfdd; }
  .split .txt ul { list-style:none; }
  .split .txt li { padding-left:26px; position:relative; margin-bottom:12px; }
  .split .txt li::before { content:''; position:absolute; left:0; top:12px; width:9px; height:9px;
    border-radius:3px; background:linear-gradient(135deg,var(--accent,#4f6ef7),#9f7bff); }

  table.dtable { width:100%; margin-top:10px; border-collapse:separate; border-spacing:0;
    background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.09); border-radius:16px; overflow:hidden; }
  .dtable th { background:rgba(255,255,255,.07); font-size:20px; color:#fff; padding:16px 20px; text-align:left; font-weight:700; }
  .dtable td { font-size:19px; color:#c9cfdd; padding:14px 20px; border-top:1px solid rgba(255,255,255,.06); }
  .dtable tr:hover td { background:rgba(255,255,255,.04); }
  .dtable tr { animation:fadeUp .5s both; }

  /* 底部控制条 */
  #bar {
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    background:rgba(20,22,30,.85); 
    border-radius:24px; padding:8px 20px; display:flex; gap:16px; align-items:center;
    font-size:15px; z-index:20;
  }
  #bar button { background:none; border:none; color:#fff; font-size:18px; cursor:pointer; }
  #bar button:hover { color:#7b9bff; }
  #pageNum { min-width:64px; text-align:center; }

  /* 右上角文件图标 + 侧边栏 */
  #fileBtn {
    position:fixed; top:16px; right:16px; z-index:30;
    width:46px; height:46px; border-radius:12px; border:1px solid #333a4a;
    background:rgba(20,22,30,.85); color:#fff; font-size:22px; cursor:pointer;
  }
  #fileBtn:hover { background:#2a3040; }
  #printBtn {
    position:fixed; top:70px; right:16px; z-index:30;
    width:46px; height:46px; border-radius:12px; border:1px solid #333a4a;
    background:rgba(20,22,30,.85); color:#fff; font-size:22px; cursor:pointer;
  }
  #printBtn:hover { background:#2a3040; }
  @media print{
    body { background:#fff; height:auto; overflow:visible; }
    #fileBtn,#printBtn,#bar,#sidebar,#hint { display:none !important; }
    #stage { position:static; transform:none !important; width:1280px; height:720px; page-break-after:always; border-radius:0; box-shadow:none; }
    * { animation:none !important; transition:none !important; opacity:1 !important; }
  }
  #sidebar {
    position:fixed; top:0; right:-300px; width:280px; height:100%;
    background:rgba(18,20,28,.97); border-left:1px solid #2a2f3d;
    transition:right .25s; z-index:25; padding:70px 0 20px; overflow-y:auto;
  }
  #sidebar.open { right:0; }
  #sidebar h3 { font-size:14px; color:#889; padding:0 20px 10px; border-bottom:1px solid #2a2f3d; }
  .pres-item { padding:12px 20px; cursor:pointer; font-size:15px; color:#cdd3e0; }
  .pres-item:hover { background:#232838; }
  .pres-item.active { color:#7b9bff; border-left:3px solid #4f6ef7; background:#1c2233; }

  /* ===== 首页（演示中心） ===== */
  .homegrid { display:grid; grid-template-columns:repeat(3,1fr); gap:22px; margin-top:40px; }
  .homecard { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:16px;
    padding:26px 22px; cursor:pointer; display:flex; align-items:center; gap:16px; min-height:86px;
    transition:.2s; font-size:18px; color:#e8eaf0; }
  .homecard:hover { background:rgba(79,110,247,.18); border-color:#4f6ef7; transform:translateY(-4px);
    box-shadow:0 12px 32px rgba(79,110,247,.25); }
  .hc-num { flex:none; width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:18px; color:#fff; background:linear-gradient(135deg,#4f6ef7,#9f7bff); }
  .homecard .hc-t { flex:1; overflow:hidden; text-overflow:ellipsis; }
  .homehint { margin-top:34px; color:#8a92a8; font-size:15px; }

</style>
</head>
<body>

<div id="stage"></div>

<div id="bar">
  <button onclick="goStart()" title="起点（第一页）">⏮</button>
  <button onclick="nav(-1)" title="上一页">◀</button>
  <span id="pageNum">1 / 1</span>
  <button onclick="nav(1)" title="下一页">▶</button>
  <button onclick="goEnd()" title="终点（最后一页）">⏭</button>
</div>

<button id="fileBtn" title="演示文稿列表" onclick="document.getElementById('sidebar').classList.toggle('open')">📂</button>
<button id="printBtn" title="打印 / 导出 PDF" onclick="window.print()" style="display:none">🖨</button>
<div id="sidebar"><h3>演示文稿</h3><div id="presList"></div></div>

<script>
let pres = null, idx = 0;
let _homeList = [];   // 首页卡片数据（index.json）
let _isHome = false;  // 当前是否处于首页

function renderHome() {
  _isHome = true; pres = null; idx = 0;
  const el = document.createElement('div');
  el.className = 'slide cover';
  el.innerHTML = `<h1>?? 演示中心</h1><p>点击卡片打开演示稿 · ? 键返回首页</p>` +
    `<div class="homegrid">` +
    _homeList.map((f, i) =>
      `<div class="homecard" data-i="${i}"><span class="hc-num">${i+1}</span><span class="hc-t">${esc(f.title || f.file)}</span></div>`
    ).join('') +
    `</div><div class="homehint">右上角 ?? 可打开侧边栏列表 · 打印按钮可导出当前演示 PDF</div>`;
  el.querySelectorAll('.homecard').forEach(c => {
    c.onclick = () => { openFromHome(parseInt(c.dataset.i, 10)); };
  });
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  stage.appendChild(el);
  fit();
  document.getElementById('pageNum').textContent = '首页';
}

function openFromHome(i) {
  const f = _homeList[i]; if (!f) return;
  _isHome = false;
  document.querySelectorAll('.pres-item').forEach((x, k) => x.classList.toggle('active', k === i));
  loadPres(f.file);
}

async function loadIndex() {
  const r = await fetch('index.json');
  let data = await r.json();
  // 兼容两种格式：数组 或 {categories, flat} 对象（取 flat 列表）
  const list = Array.isArray(data) ? data : (Array.isArray(data.flat) ? data.flat : (Array.isArray(data.items) ? data.items : []));
  const box = document.getElementById('presList');
  box.innerHTML = '';
  list.forEach((f, i) => {
    const d = document.createElement('div');
    d.className = 'pres-item' + (i === 0 ? ' active' : '');
    d.textContent = '📄 ' + f.title;
    d.onclick = () => {
      document.querySelectorAll('.pres-item').forEach(x => x.classList.remove('active'));
      d.classList.add('active');
      loadPres(f.file);
      document.getElementById('sidebar').classList.remove('open');
    };
    box.appendChild(d);
  });
  window._presFiles = list.map(f => f.file);
  _homeList = list;
  /* 支持 ?file=xxx 直接加载指定演示稿（画布 PPT 节点 iframe 传参用） */
  const wantFile = new URLSearchParams(location.search).get('file');
  if (wantFile) { loadPres(wantFile); return; }
  // 非嵌入模式默认显示首页（演示中心）
  if (!EMBED) renderHome();
}

async function loadPres(file) {
  if (!/\.(pres\.)?json$/i.test(file)) file += '.pres.json';
  /* index.json 中 file 可能已带 slides/ 前缀，去重避免 slides/slides/xxx 404 */
  file = file.replace(/^slides\//i, '');
  const r = await fetch('slides/' + file);
  if (!r.ok) { _loadMsg('演示稿加载失败（' + r.status + '）：' + file); return; }
  try { pres = await r.json(); } catch (e) { _loadMsg('演示稿 JSON 解析失败：' + file); return; }
  idx = 0;
  _isHome = false;
  // 支持 #page=N 定位到指定页（工作台单页预览用）
  const m = location.hash.match(/page=(\d+)/);
  if (m) idx = Math.max(0, parseInt(m[1], 10) - 1);
  idx = Math.min(idx, pres.slides.length - 1);
  render();
}

function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

function _loadMsg(t){ let d=document.getElementById('loadMsg'); if(!d){ d=document.createElement('div'); d.id='loadMsg'; d.style.cssText='position:fixed;left:0;right:0;top:40%;text-align:center;color:#8a92a8;font:15px/1.7 "Microsoft YaHei",sans-serif;z-index:9'; document.body.appendChild(d); } d.textContent='⚠ ' + t; }

function elHTML(e) {
  // 自由摆放元素：x/y/w/h(像素,1280x720画布)、rotate(度)、opacity、动画 enter/loop
  const pos = `left:${e.x||0}px;top:${e.y||0}px;` +
    (e.w ? `width:${e.w}px;` : '') + (e.h ? `height:${e.h}px;` : '');
  const st = [];
  if (e.rotate) st.push(`rotate:${e.rotate}deg`);
  if (e.scale && e.scale !== 1) st.push(`scale:${e.scale}`);
  if (e.opacity != null && e.opacity < 1) { st.push(`opacity:${e.opacity}`, `--op:${e.opacity}`); }
  let inner = '';
  if (e.type === 'image') {
    inner = `<img src="${esc(e.src||'')}" alt="" style="${e.fit ? 'object-fit:'+esc(e.fit) : ''}">`;
  } else if (e.type === 'shape') {
    const sty = [];
    if (e.color) sty.push(`background:${e.color}`);
    if (e.radius != null) sty.push(`border-radius:${e.radius}px`);
    if (e.border) sty.push(`border:${e.border}`);
    if (e.shadow) sty.push(`box-shadow:${e.shadow}`);
    inner = `<div class="wrap" style="${sty.join(';')}"></div>`;
  } else { // text
    const sty = [];
    if (e.color) sty.push(`color:${e.color}`);
    if (e.size) sty.push(`font-size:${e.size}px`);
    if (e.bold) sty.push(`font-weight:${e.bold}`);
    if (e.align) sty.push(`text-align:${e.align}`);
    if (e.font) sty.push(`font-family:${e.font}`);
    if (e.line) sty.push(`line-height:${e.line}`);
    if (e.shadow) sty.push(`text-shadow:${e.shadow}`);
    inner = `<div class="wrap" style="${sty.join(';')}">${esc(e.text||'')}</div>`;
  }
  const loop = e.loop ? ' el-loop-' + e.loop : '';
  const enter = e.enter ? `animation:el${e.enter[0].toUpperCase()+e.enter.slice(1)} .7s cubic-bezier(.22,.9,.3,1) ${(e.delay||0)}s both;` : '';
  return `<div class="el el-${e.type==='image'?'image':e.type==='shape'?'shape':'text'}${loop}" style="${pos}${st.length?';'+st.join(';'):''};${enter}">${inner}</div>`;
}

function slideHTML(s) {
  let body = '';
  if (s.type === 'scene') {
    body = (s.title ? `<h2 style="color:#fff;border-color:var(--accent,#4f6ef7)">${esc(s.title)}</h2>` : '') +
      s.elements.map(elHTML).join('');
  } else if (s.type === 'cover') {
    body = `<h1>${esc(s.title)}</h1><p>${esc(s.subtitle||'')}</p>`;
  } else if (s.type === 'stats' || (s.stats && !s.bullets)) {
    // 大数字页：[{value,label}]，value 支持 "99<small>%</small>" 式内嵌 small
    body = `<h2>${esc(s.title)}</h2><div class="stats">` +
      s.stats.map((it,i) => `<div class="stat" style="animation-delay:${i*0.12+0.15}s;animation-name:${i%2?'cardInR':'cardInL'}"><div class="num">${it.value}</div><div class="lab">${esc(it.label||'')}</div></div>`).join('') +
      `</div>`;
  } else if (s.type === 'chart' || s.chart) {
    const c = s.chart || s;
    if (c.kind === 'line') {
      const vals = c.data.map(d => d.value);
      const max = Math.max(...vals), min = Math.min(...vals) * 0.8;
      const W = 1000, H = 380;
      const pts = vals.map((v,i) => [60 + i*(W-120)/(vals.length-1), H-40 - (v-min)/(max-min)*(H-90)]);
      const path = pts.map((p,i)=>(i?'L':'M')+p[0]+','+p[1]).join(' ');
      body = `<h2>${esc(s.title)}</h2><div class="linechart"><svg viewBox="0 0 ${W} ${H}" width="100%" height="100%">` +
        `<path class="ln" d="${path}"/>` +
        pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="7" style="animation-delay:${0.4+i*0.15}s"/>`).join('') +
        pts.map((p,i)=>`<text x="${p[0]}" y="${H-8}" fill="#8a92a8" font-size="20" text-anchor="middle">${esc(c.data[i].label||'')}</text>`).join('') +
        `</svg></div>`;
    } else if (c.kind === 'donut') {
      const total = c.data.reduce((a,d)=>a+d.value,0);
      let off = 0;
      const cols = ['#4f6ef7','#9f7bff','#2dd4bf','#f59e0b','#f472b6','#34d399'];
      const segs = c.data.map((d,i) => {
        const frac = d.value/total;
        const col = d.color || cols[i%cols.length];
        const st = `conic-gradient(from ${off*360}deg, ${col} ${frac*360}deg, transparent 0)`;
        off += frac;
        return {st, col, d};
      });
      body = `<h2>${esc(s.title)}</h2><div class="donutwrap"><div class="donut" style="background:${segs.map(s2=>s2.st).join(',')}"></div><div class="legend">` +
        segs.map((s2,i)=>`<div style="animation:fadeUp .5s ${0.3+i*0.12}s both"><i style="background:${s2.col}"></i>${esc(s2.d.label)} · ${s2.d.value}（${Math.round(s2.d.value/total*100)}%）</div>`).join('') +
        `</div></div>`;
    } else { // bar 默认
      const max = Math.max(...c.data.map(d=>d.value));
      body = `<h2>${esc(s.title)}</h2><div class="chartwrap">` +
        c.data.map((d,i)=>`<div class="barcol"><span class="bv">${d.value}</span><div class="bar" style="height:${Math.round(d.value/max*82)}%;animation-delay:${i*0.12+0.2}s;${d.color?`background:linear-gradient(180deg,${d.color},color-mix(in srgb,${d.color} 35%,#12141c));box-shadow:0 0 18px ${d.color}66;`:''}"></div><span class="bl">${esc(d.label||'')}</span></div>`).join('') +
        `</div>`;
    }
  } else if (s.type === 'share' || (s.chart && s.chart.kind === 'share')) {
    // 横向占比条：data:[{value,label,color?}]，自动按最大值/总和换算宽度
    const c = s.chart || s;
    const useTotal = c.mode === 'percent';
    const sum = c.data.reduce((a,d)=>a+d.value,0) || 1;
    const max = Math.max(...c.data.map(d=>d.value));
    const cols = ['#4f6ef7','#9f7bff','#2dd4bf','#f59e0b','#f472b6','#34d399'];
    body = `<h2>${esc(s.title)}</h2><div class="sharewrap">` +
      c.data.map((d,i)=>{ const w = useTotal ? Math.round(d.value/sum*100) : Math.round(d.value/max*100);
        const col = d.color || cols[i%cols.length];
        const show = useTotal ? `${Math.round(d.value/sum*100)}%` : d.value;
        return `<div class="sharerow" style="animation-delay:${i*0.12+0.15}s"><div class="sr-top"><b>${esc(d.label||'')}</b><span>${show}</span></div><div class="track"><div class="fill" style="--col:${col};width:${w}%"></div></div></div>`; }).join('') +
      `</div>`;
  } else if (s.type === 'radar' || (s.chart && s.chart.kind === 'radar')) {
    // 雷达图：data:[{value,label}]（value 0~100），多边形描线生长动画
    const c = s.chart || s;
    const n = c.data.length, CX = 500, CY = 400, R = 300;
    const pt = (v,i)=>{ const a = -Math.PI/2 + i*2*Math.PI/n; const r = R*Math.max(0,Math.min(100,v))/100;
      return [CX + r*Math.cos(a), CY + r*Math.sin(a)]; };
    const poly = c.data.map((d,i)=>pt(d.value,i).join(',')).join(' ');
    let grid = '';
    for (let g=1; g<=4; g++) { const rr = R*g/4;
      grid += `<polygon points="${c.data.map((d,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return (CX+rr*Math.cos(a))+','+(CY+rr*Math.sin(a));}).join(' ')}" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="1.5"/>`; }
    body = `<h2>${esc(s.title)}</h2><div class="linechart"><svg viewBox="0 0 1000 700" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">` + grid +
      `<polygon class="radar-poly" points="${poly}" fill="color-mix(in srgb, var(--accent,#4f6ef7) 25%, transparent)" stroke="var(--accent,#4f6ef7)" stroke-width="3.5" style="filter:drop-shadow(0 0 10px color-mix(in srgb,var(--accent,#4f6ef7) 55%,transparent))"/>` +
      c.data.map((d,i)=>{ const p = pt(d.value,i);
        return `<circle cx="${p[0]}" cy="${p[1]}" r="7" style="animation-delay:${0.5+i*0.12}s"/><text x="${p[0]}" y="${p[1]-18}" fill="#e8eaf0" font-size="24" text-anchor="middle" style="animation:fadeUp .5s ${0.4+i*0.12}s both">${esc(d.label||'')} ${d.value}</text>`; }).join('') +
      `</svg></div>`;
  } else if (s.type === 'gallery') {
    // 图片组合：images:[{src,caption?}]，layout: grid2(默认2x2)/grid3/row（1横排）/col（1竖列）
    const imgs = s.images || [];
    const lay = s.layout || (imgs.length <= 1 ? 'row' : imgs.length <= 2 ? 'row' : imgs.length <= 4 ? 'grid2' : 'grid3');
    const style = lay === 'row' ? 'grid-template-columns:repeat(' + Math.max(imgs.length,1) + ',1fr);' :
      lay === 'col' ? 'grid-template-rows:repeat(' + imgs.length + ',1fr);' :
      lay === 'grid3' ? 'grid-template-columns:repeat(3,1fr);' : 'grid-template-columns:repeat(2,1fr);';
    body = (s.title ? `<h2>${esc(s.title)}</h2>` : '') +
      `<div class="gallery" style="${style}">` +
      imgs.map((im,i)=>`<figure class="gitem" style="animation-delay:${i*0.12+0.15}s"><img src="${esc(im.src||'')}" alt=""><figcaption>${esc(im.caption||'')}</figcaption></figure>`).join('') +
      `</div>` + (s.caption ? `<div class="gcap">${esc(s.caption)}</div>` : '');
  } else if (s.type === 'split' || s.image) {
    // 左文右图：text/bullets 在左，image 在右
    const bullets = s.bullets || [];
    body = `<h2>${esc(s.title)}</h2><div class="splitwrap">` +
      `<div class="split-text">` + (s.text ? `<p>${esc(s.text)}</p>` : '') +
      (bullets.length ? `<ul>${bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>` : '') + `</div>` +
      `<figure class="split-img"><img src="${esc((s.image&&s.image.src)||s.image||'')}" alt=""></figure></div>`;
  } else if (s.type === 'timeline' || s.timeline) {
    body = `<h2>${esc(s.title)}</h2><div class="timeline">` +
      s.timeline.map((t,i)=>`<div class="tstep" style="animation-delay:${i*0.15+0.15}s"><div class="dot"></div><h4>${esc(t.time||t.title||'')}</h4><p>${esc(t.title&&t.time?t.desc||'':t.desc||'')}</p></div>`).join('') +
      `</div>`;
  } else if (s.type === 'quote') {
    body = `<h2 style="opacity:0;height:0;margin:0">${esc(s.title||'')}</h2><div class="quotebox"><div class="q">${esc(s.quote||s.text||'')}</div><div class="a">— ${esc(s.author||'')}</div></div>`;
  } else if (s.type === 'split') {
    body = `<h2>${esc(s.title)}</h2><div class="split">` +
      `<div class="img"><img src="${s.img||''}" alt=""></div>` +
      `<div class="txt">${s.bullets ? '<ul>'+s.bullets.map(b=>`<li>${esc(b)}</li>`).join('')+'</ul>' : `<p>${esc(s.text||'')}</p>`}</div></div>`;
  } else if (s.type === 'table' || s.table) {
    const t = s.table || s;
    body = `<h2>${esc(s.title)}</h2><table class="dtable"><thead><tr>` +
      t.head.map(h=>`<th>${esc(h)}</th>`).join('') +
      `</tr></thead><tbody>` +
      t.rows.map((r,i)=>`<tr style="animation-delay:${i*0.1+0.15}s">${r.map(cel=>`<td>${esc(cel)}</td>`).join('')}</tr>`).join('') +
      `</tbody></table>`;
  } else if (s.bullets) {
    // 卡片式网格（苹果发布会风）：每条 bullet 一张毛玻璃卡片，「：」前为卡片标题
    const cls = s.bullets.length > 4 ? 'c3' : 'c2';
    body = `<h2>${esc(s.title)}</h2><div class="cards ${cls}">` +
      s.bullets.map(b => {
        const i = b.indexOf('：');
        const t = i > 0 ? b.slice(0, i) : b;
        const d = i > 0 ? b.slice(i + 1) : '';
        return `<div class="card" style="animation-delay:${i*0.12+0.12}s;animation-name:${i%2?'cardInR':'cardInL'}"><h3>${esc(t)}</h3><p>${esc(d)}</p></div>`;
      }).join('') + `</div>`;
  } else {
    // 正文段落放进玻璃面板，行首的引导词自动渐变高亮
    body = `<h2>${esc(s.title)}</h2><div class="panel">` +
      esc(s.text||'').split('\n').filter(x=>x.trim()).map(p =>
        `<p>${p.replace(/^([^，。：]{2,12})：/, '<strong style="color:var(--accent,#4f6ef7)">$1</strong>：')}</p>`
      ).join('') + `</div>`;
  }
  return body + (s.footer ? `<div class="foot">${esc(s.footer)}</div>` : '');
}

function render(dir) {
  if (!pres) return;
  const s = pres.slides[idx];
  const el = document.createElement('div');
  el.className = 'slide' + (s.type === 'cover' ? ' cover' : '')
    + (s.anim ? ' ' + s.anim : dir === 'r' ? ' anim-r' : dir === 'l' ? ' anim-l' : '');
  if (s.accent) el.style.setProperty('--accent', s.accent);
  if (s.bg) el.style.background = s.bg;
  el.innerHTML = slideHTML(s);
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  stage.appendChild(el);
  fit();
  document.getElementById('pageNum').textContent = `${idx+1} / ${pres.slides.length}`;
}

function fit() {
  const el = document.querySelector('.slide');
  if (!el) return;
  // 用舞台容器实际尺寸计算（嵌入 iframe 时比 innerWidth/innerHeight 更准）
  const st = document.getElementById('stage');
  const W = (st && st.clientWidth) || innerWidth;
  const H = (st && st.clientHeight) || innerHeight;
  const k = Math.min(W / 1320, H / 760);
  el.style.setProperty('--fit', `scale(${k})`);
  /* 用 zoom 而不是 transform:scale：zoom 是重排级缩放，文字按最终尺寸真实渲染，清晰不模糊；
     transform:scale 是 GPU 合成层缩放，非整数倍时文字位图插值会发虚。
     Firefox 不支持 zoom 时回退到 transform 方案。 */
  if (CSS.supports('zoom: 0.5')) {
    el.style.zoom = k;
    el.style.transform = 'none';
  } else {
    el.style.transform = `scale(${k})`;
  }
  el.style.transformOrigin = 'center center';
}

/* iframe/窗口尺寸变化时重算（嵌入模式下 iframe 大小由外层画布节点控制） */
if (window.ResizeObserver && document.getElementById('stage')) {
  new ResizeObserver(function () { fit(); }).observe(document.getElementById('stage'));
} else {
  addEventListener('resize', fit);
}
function nav(d) {
  // 首页状态下：← 仍留在首页，→/点击不进入（需点卡片）
  if (_isHome) return;
  if (d < 0 && idx === 0) { renderHome(); return; }   // 第一页再往前 = 回首页
  if (!pres) return;
  const n = Math.min(Math.max(idx + d, 0), pres.slides.length - 1);
  if (n === idx) return;
  idx = n;
  render(d > 0 ? 'r' : 'l');
}
function goStart() { if (_isHome) return; if (idx === 0) { renderHome(); return; } idx = 0; render('l'); }
function goEnd() { if (!pres || idx === pres.slides.length - 1) return; idx = pres.slides.length - 1; render('r'); }
// Home/End 键跳转首尾页
addEventListener('keydown', e => {
  if (e.key === 'Home') goStart();
  if (e.key === 'End') goEnd();
});
addEventListener('resize', fit);
// 嵌入节点缩放时，iframe 尺寸变化不触发 window resize，用 ResizeObserver 监听舞台
try { if (window.ResizeObserver) new ResizeObserver(fit).observe(document.getElementById('stage')); } catch (e) {}
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') nav(1);
  if (e.key === 'ArrowLeft') nav(-1);
});

// 空白处点击翻页：左键点击 = 左半屏下一页、右半屏上一页；右键点击 = 上一页
// 注：iframe 内右键不会弹浏览器菜单以外的冲突，用 contextmenu 拦截实现
addEventListener('contextmenu', e => {
  if (e.target.closest('#bar') || e.target.closest('#fileBtn') || e.target.closest('#sidebar')) return;
  e.preventDefault();
  nav(-1);
});
addEventListener('click', e => {
  if (e.target.closest('#bar') || e.target.closest('#fileBtn') || e.target.closest('#sidebar')) return;
  nav(1); // 左键 = 下一页（上一页用右键 / ◀ / Home）
});
// 触屏滑动翻页
let tx = 0;
addEventListener('touchstart', e => tx = e.touches[0].clientX, {passive:true});
addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 50) nav(dx < 0 ? 1 : -1);
}, {passive:true});

const EMBED = new URLSearchParams(location.search).has('embed');
const EDITMODE = new URLSearchParams(location.search).has('edit');

/* 精细编辑模式：工作台 iframe 嵌入时 (?edit=1)，点击 scene 元素上报坐标索引 */
if (EDITMODE) {
  // 工作台嵌入：屏蔽翻页手势/点击，专注元素点选
  document.addEventListener('click', e => e.stopPropagation(), true);
  document.addEventListener('keydown', e => e.stopPropagation(), true);
  const stage = document.getElementById('stage');
  stage.addEventListener('click', e => {
    const elDiv = e.target.closest('.el');
    if (!elDiv) return;
    e.stopPropagation();
    const els = Array.from(stage.querySelectorAll('.slide .el'));
    const i = els.indexOf(elDiv);
    if (i < 0) return;
    elDiv.classList.add('wb-sel');
    els.forEach(x => { if (x !== elDiv) x.classList.remove('wb-sel'); });
    try { parent.postMessage({ src: 'viewer', cmd: 'pick', slide: idx, el: i }, '*'); } catch (err) {}
  }, true);

  /* 拖拽移动 scene 元素，松手时把最终坐标回传工作台写入 JSON */
  let drag = null;
  stage.addEventListener('mousedown', e => {
    const elDiv = e.target.closest('.el');
    if (!elDiv) return;
    const els = Array.from(stage.querySelectorAll('.slide .el'));
    const i = els.indexOf(elDiv);
    if (i < 0) return;
    const sl = document.querySelector('.slide');
    let k = 1;
    if (sl) { const t = getComputedStyle(sl).transform; if (t && t !== 'none') { try { k = new DOMMatrix(t).a || 1; } catch (err) {} } }
    drag = { el: elDiv, i, sx: e.clientX, sy: e.clientY,
      ox: parseFloat(getComputedStyle(elDiv).left) || 0, oy: parseFloat(getComputedStyle(elDiv).top) || 0, k };
    e.preventDefault(); e.stopPropagation();
  }, true);
  addEventListener('mousemove', e => {
    if (!drag) return;
    drag.el.style.left = Math.round(drag.ox + (e.clientX - drag.sx) / drag.k) + 'px';
    drag.el.style.top = Math.round(drag.oy + (e.clientY - drag.sy) / drag.k) + 'px';
  });
  addEventListener('mouseup', () => {
    if (!drag) return;
    const nx = parseInt(drag.el.style.left, 10), ny = parseInt(drag.el.style.top, 10), i = drag.i;
    drag = null;
    try { parent.postMessage({ src: 'viewer', cmd: 'move', slide: idx, el: i, x: nx, y: ny }, '*'); } catch (err) {}
  });
}

function wbHighlight(elIdx) {
  document.querySelectorAll('.slide .el').forEach((x, i) => x.classList.toggle('wb-sel', i === elIdx));
}

if (EMBED) {
  document.documentElement.classList.add('embed');
  document.getElementById('fileBtn').style.display = 'none';
  document.getElementById('sidebar').style.display = 'none';
}

addEventListener('message', e => {
  const d = e.data || {};
  if (d.type === 'pres-load' && d.file) {
    loadPres(d.file);
    document.querySelectorAll('.pres-item').forEach((x, i) => {
      x.classList.toggle('active', d.file === (window._presFiles && window._presFiles[i]));
    });
  }
  if (d.type === 'pres-page' && typeof d.n === 'number') {
    idx = Math.min(Math.max(d.n, 0), pres ? pres.slides.length - 1 : 0);
    if (pres) render();
  }
  if (d.type === 'pres-highlight' && typeof d.el === 'number') wbHighlight(d.el);
});

loadIndex();
</script>
</body>
</html>
