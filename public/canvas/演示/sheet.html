<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="/js/storage-guard.js?v=1"></script>
<meta charset="UTF-8">
<title>大模型表格 · Excel 查看器</title>
<style>
  :root{--bg:#1e2229;--panel:#262b34;--line:#3a4150;--fg:#e8ecf3;--dim:#9aa5b5;--acc:#4da3ff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  header b{font-size:16px}
  header .meta{color:var(--dim);font-size:12px}
  header input{margin-left:auto;background:var(--bg);border:1px solid var(--line);color:var(--fg);padding:5px 10px;border-radius:6px;width:220px}
  #tabs{display:flex;gap:6px;padding:8px 16px 0;background:var(--panel)}
  #tabs button{background:var(--bg);color:var(--dim);border:1px solid var(--line);border-bottom:none;padding:6px 18px;border-radius:8px 8px 0 0;cursor:pointer;font-size:13px}
  #tabs button.on{color:var(--acc);border-color:var(--acc)}
  #gridWrap{flex:1;overflow:auto;padding:12px 16px}
  table{border-collapse:collapse;min-width:100%;background:var(--panel);border-radius:8px;overflow:hidden}
  th,td{border:1px solid var(--line);padding:6px 12px;text-align:left;white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis}
  th{background:#2f3542;color:var(--acc);position:sticky;top:0;font-weight:600}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  tr:nth-child(even) td{background:#2a2f3a}
  tr:hover td{background:#33405c}
  mark{background:#ffd54f;color:#000;border-radius:2px}
  #empty{color:var(--dim);padding:40px;text-align:center}
  #stat{padding:6px 16px;color:var(--dim);font-size:12px;border-top:1px solid var(--line);background:var(--panel)}
</style>
</head>
<body>
<header><b>📊</b><b id="title">加载中…</b><span class="meta" id="meta"></span>
  <input id="q" placeholder="🔍 搜索单元格内容…"></header>
<div id="tabs"></div>
<div id="gridWrap"><div id="empty">未指定文件，用法：sheet.html?file=名字.sheet.json（相对 演示/ 目录）</div></div>
<div id="stat"></div>
<script>
let data=null, cur=0, q='';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function hl(s){ if(!q) return esc(s); try{ return esc(s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>'<mark>'+m+'</mark>'); }catch(e){return esc(s);} }
function isNum(v){return typeof v==='number'||(typeof v==='string'&&v!==''&&!isNaN(v)&&/^\s*-?[\d.,%\s￥$元]+$/.test(v))}
function render(){
  const sh=data.sheets[cur]; if(!sh) return;
  const cols=sh.cols||[], rows=sh.rows||[];
  const hit=q?rows.filter(r=>r.some(c=>String(c).toLowerCase().includes(q.toLowerCase()))):rows;
  let h='<table><thead><tr><th style="width:44px">#</th>'+cols.map(c=>'<th>'+hl(c)+'</th>').join('')+'</tr></thead><tbody>';
  hit.forEach(r=>{ h+='<tr><td style="color:#5f6b7d">'+(rows.indexOf(r)+1)+'</td>'+r.map(c=>'<td class="'+(isNum(c)?'num':'')+'">'+hl(c)+'</td>').join('')+'</tr>'; });
  h+='</tbody></table>';
  document.getElementById('gridWrap').innerHTML=h;
  document.getElementById('stat').textContent='工作表「'+sh.name+'」：'+cols.length+' 列 × '+rows.length+' 行'+(q?'，命中 '+hit.length+' 行':'');
}
function tabs(){
  document.getElementById('tabs').innerHTML=data.sheets.map((s,i)=>'<button class="'+(i===cur?'on':'')+'" data-i="'+i+'">'+esc(s.name||('Sheet'+(i+1)))+'</button>').join('');
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;tabs();render();});
}
function load(){
  const f=new URLSearchParams(location.search).get('file');
  if(!f) return;
  fetch('/pres/'+encodeURIComponent(f)).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(j=>{
    data=j.sheets?j:{title:j.title,sheets:[j]};
    document.getElementById('title').textContent=data.title||f;
    document.getElementById('meta').textContent=f;
    tabs();render();
  }).catch(e=>{document.getElementById('empty').textContent='加载失败：'+e.message});
}
document.getElementById('q').oninput=e=>{q=e.target.value.trim();render();};
load();
</script>
</body>
</html>
