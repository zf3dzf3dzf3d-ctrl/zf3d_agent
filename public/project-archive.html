<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📁 项目档案</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #0f1420; color: #d7dce6; display: flex; height: 100vh; }
  #side { width: 280px; border-right: 1px solid #2a3244; overflow-y: auto; padding: 12px; }
  #side h3 { font-size: 14px; color: #8fa3c8; margin-bottom: 10px; }
  .proj { padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 6px; font-size: 13px; }
  .proj:hover { background: #1a2233; }
  .proj.active { background: #2b3b5e; color: #fff; }
  #main { flex: 1; display: flex; flex-direction: column; padding: 16px 24px; overflow: hidden; }
  #title { font-size: 17px; font-weight: bold; margin-bottom: 10px; color: #fff; }
  #editor { flex: 1; width: 100%; background: #151b29; color: #d7dce6; border: 1px solid #2a3244; border-radius: 8px; padding: 14px; font-family: Consolas, monospace; font-size: 13px; line-height: 1.7; resize: none; }
  #bar { margin-top: 12px; display: flex; gap: 10px; align-items: center; }
  button { background: #3b5bab; color: #fff; border: none; border-radius: 6px; padding: 8px 18px; cursor: pointer; font-size: 13px; }
  button:hover { background: #4a6fc4; }
  button.gray { background: #2a3244; }
  #status { font-size: 12px; color: #7ec27e; }
  .empty { color: #5c6880; font-size: 13px; padding: 20px; }
</style>
</head>
<body>
<div id="side"><h3>📁 项目档案（项目/ 分区）</h3><div id="list" class="empty">加载中…</div></div>
<div id="main">
  <div id="title">选择左侧项目查看档案</div>
  <textarea id="editor" spellcheck="false" style="display:none"></textarea>
  <div id="bar" style="display:none">
    <button onclick="saveArchive()">💾 保存</button>
    <button class="gray" onclick="location.reload()">🔄 刷新</button>
    <span id="status"></span>
  </div>
</div>
<script>
var API = '/api/tools/project_record';
var current = null;
function post(body){ return fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}).then(function(r){return r.json();}); }
function loadList(){
  post({action:'list'}).then(function(res){
    var el = document.getElementById('list');
    if (!(res && res.ok && res.records)) { el.textContent = '读取失败'; return; }
    // list 接口不返回 子目录/ 层级的记录，兜底：把当前项目名从 URL 参数 ?project= 或 localStorage 取，直接挂一条
    var names = res.records.map(function(n){ return typeof n === 'string' ? n : (n && n.name) || ''; });
    var items = names.filter(function(n){ return n.indexOf('项目/') === 0; });
    var cur = new URLSearchParams(location.search).get('project') || localStorage.getItem('zf_current_project') || '';
    if (cur) {
      var full = '项目/' + cur + '/档案';
      if (items.indexOf(full) === -1) items.unshift(full);
    }
    el.innerHTML = '';
    if (!items.length) { el.textContent = '暂无项目档案。可通过 ?project=项目名 打开，或对话中让 AI 创建'; return; }
    items.forEach(function(n){
      var d = document.createElement('div');
      d.className = 'proj'; d.textContent = '📄 ' + n;
      d.onclick = function(){ openArchive(n, d); };
      el.appendChild(d);
    });
    // 自动打开当前项目档案
    if (cur) {
      var full = '项目/' + cur + '/档案';
      var target = Array.prototype.find.call(document.querySelectorAll('.proj'), function(p){ return p.textContent.indexOf(full) !== -1; });
      if (target) target.click();
    }
  });
}
function openArchive(name, el){
  current = name;
  document.querySelectorAll('.proj').forEach(function(p){ p.classList.remove('active'); });
  el.classList.add('active');
  document.getElementById('title').textContent = '📁 ' + name;
  post({action:'read', name:name}).then(function(res){
    var ed = document.getElementById('editor');
    ed.style.display = 'block';
    document.getElementById('bar').style.display = 'flex';
    ed.value = res && res.ok ? (res.content||'') : '（档案不存在或读取失败）';
  });
}
function saveArchive(){
  if (!current) return;
  post({action:'write', name:current, content:document.getElementById('editor').value}).then(function(res){
    document.getElementById('status').textContent = res && res.ok ? '✅ 已保存 ' + new Date().toLocaleTimeString() : '❌ 保存失败';
  });
}
loadList();
</script>
</body>
</html>
