    (function(){

        s.onload = onReady;
        document.head.appendChild(s);

        if (typeof marked !== 'undefined' && typeof window.App !== 'undefined' && App._remdDegraded) {
          try { App._remdDegraded(); } catch(e){}

          if (s.src.indexOf('marked.min.js') !== -1) retry('marked', 'js/marked.min.js?v=2');
          else if (s.src.indexOf('highlight.min.js') !== -1) retry('hljs', 'js/highlight.min.js?v=1');

      }, true);

        setTimeout(function(){
          if (typeof marked === 'undefined') retry('marked', 'js/marked.min.js?v=2');
          if (typeof hljs === 'undefined') retry('hljs', 'js/highlight.min.js?v=1');
          setTimeout(onReady, 1500);
        }, 800);
      });
    })();
    </script>
