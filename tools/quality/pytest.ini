# pytest 配置（工程基建总纲 P1.4/P2 20261123）
# 由 scripts/run_checks.py 以 -c 显式引用（--rootdir 定位项目根）。
# 【为何不在根 pyproject.toml】根目录 pyproject.toml 当日被后台清理进程两次删除，
# pytest 失去 testpaths 约束后漫游全仓收进 server/plaza 脚本式测试炸掉收集（退出码3）。
# 配置挪入 tools/quality/ 子目录避扫。tests/conftest.py 的 AST 脚本式排除仍生效。

[pytest]
testpaths = tests
