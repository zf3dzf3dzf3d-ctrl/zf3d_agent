<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#060607">
<title>朱峰智能体</title>
<style>
:root{--bg:#060607;--bg2:#111114;--bg3:#1a1a1f;--fg:#c8c8cc;--fg2:#6a6a72;--acc:#8a8a92;--acc2:#9a9aa2;--ok:#6f9c82;--err:#c06b6b;--rad:6px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);font-size:15px;overflow:hidden}
.page{position:absolute;inset:0;display:none;flex-direction:column}
.page.on{display:flex}
/* ---------- 登录页（品牌化·深空科技风） ---------- */
#pgLogin{justify-content:center;padding:32px 28px;position:relative;overflow:hidden}
.brand-bg{position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 120% 70% at 50% -10%,rgba(140,140,152,.28),transparent 60%),radial-gradient(ellipse 80% 50% at 85% 105%,rgba(120,120,130,.16),transparent 60%)}
.brand-orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;pointer-events:none}
.orb1{width:220px;height:220px;background:#9a9aa2;top:-60px;left:-70px;animation:orbFloat 11s ease-in-out infinite}
.orb2{width:180px;height:180px;background:#7a7a82;bottom:-50px;right:-50px;animation:orbFloat 13s ease-in-out infinite reverse}
.orb3{width:120px;height:120px;background:#2a2a32;top:40%;right:-40px;animation:orbFloat 15s ease-in-out infinite;opacity:.35}
@keyframes orbFloat{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,26px)}}
#pgLogin>*:not(.brand-bg):not(.brand-orb){position:relative;z-index:1}
.logo{width:84px;height:84px;margin:0 auto 14px;animation:logoIn .7s cubic-bezier(.2,.9,.3,1.3) both,logoBreath 3.2s ease-in-out .8s infinite}
.logo img{width:100%;height:100%;display:block;border-radius:18px;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 8px 24px rgba(0,0,0,.5)}
@keyframes logoIn{from{opacity:0;transform:scale(.6) translateY(14px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes logoBreath{0%,100%{filter:drop-shadow(0 0 6px rgba(140,140,152,.45))}50%{filter:drop-shadow(0 0 20px rgba(120,120,130,.8))}}
h1{text-align:center;font-size:22px;margin-bottom:4px;background:linear-gradient(90deg,#e8edf2,#8a8a92);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;color:var(--fg2);font-size:13px;margin-bottom:28px}
.sub b{color:#8a8a92;font-weight:600}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--fg2);margin-bottom:6px}
.field input{width:100%;padding:13px 14px;border:1px solid var(--bg3);border-radius:var(--rad);background:rgba(17,17,20,.72);color:var(--fg);font-size:15px;outline:none;transition:border-color .25s,box-shadow .25s}
.field input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(138,138,146,.25)}
.btn{width:100%;padding:14px;border:1px solid #2a2a30;border-radius:var(--rad);background:#1a1a1f;color:#d8d8dc;font-size:16px;font-weight:600;margin-top:6px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .25s;box-shadow:none}
.btn:active{transform:scale(.98);box-shadow:none}
.btn::after{content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.06),transparent);animation:btnShine 3.4s ease-in-out infinite}
@keyframes btnShine{0%,55%{left:-80%}75%,100%{left:130%}}
.btn[disabled]{opacity:.5}
#loginMsg{color:var(--err);font-size:13px;text-align:center;min-height:18px;margin-top:10px}
/* 工具计数徽标（融合进 tools 按钮，>0 才显示） + +1 动画 */
#btnTools{position:relative}
/* 顶栏图标已上移到 App 原生导航栏：网页 header 的 工具/日志/列表/新建 隐藏（DOM 保留供原生按钮触发） */
#btnTools,#btnLogs,#btnHist,#btnNew{display:none!important}

.tcount.tbadge{display:none;min-width:16px;padding:0 5px;margin-left:4px;position:relative;top:-8px}
.tcount.tbadge.on{display:inline-block}
.tcount{display:inline-block;min-width:20px;padding:2px 7px;margin-left:8px;border-radius:999px;background:var(--acc);color:#fff;font-size:12px;font-weight:700;text-align:center;transition:transform .15s}
.tcount.pop{animation:tpop .45s ease}
@keyframes tpop{0%{transform:scale(1)}40%{transform:scale(1.7);background:#7a7a82}100%{transform:scale(1)}}
.titem.run{outline:1px solid var(--acc);border-radius:10px}
.toastplus{position:fixed;right:18px;top:70px;z-index:99;background:var(--acc);color:#fff;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:all .4s}
.toastplus.on{opacity:1;transform:translateY(-8px)}
/* ---------- 对话页 ---------- */
header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:var(--bg2);border-bottom:1px solid var(--bg3)}
header .t{flex:1;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header select{background:var(--bg3);color:var(--fg);border:0;border-radius:8px;padding:6px 8px;font-size:12px;max-width:130px}
header .ib{width:34px;height:34px;border:0;border-radius:10px;background:var(--bg3);color:var(--fg);font-size:16px;flex:none}
#chat{flex:1;overflow-y:auto;padding:14px 12px 8px;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
.msg{max-width:100%;width:100%;box-sizing:border-box;margin-bottom:12px;padding:10px 13px;border-radius:var(--rad);line-height:1.55;word-break:break-word;font-size:15px;touch-action:pan-y;user-select:text;-webkit-user-select:text}
.msg.ai,.msg.user{white-space:pre-wrap}
.msg .md p{margin:0 0 8px}
.msg .md p:last-child{margin-bottom:0}
.msg .md h1,.msg .md h2,.msg .md h3{margin:10px 0 6px;line-height:1.3}
.msg .md h1{font-size:19px}.msg .md h2{font-size:17px}.msg .md h3{font-size:15px}
.msg .md code{background:#0e0e11;border:1px solid var(--bg3);border-radius:5px;padding:1px 5px;font-family:Menlo,Consolas,monospace;font-size:13px;color:#aeb0b6}
.msg .md pre{background:#0e0e11;border:1px solid var(--bg3);border-radius:6px;padding:10px 12px;overflow-x:auto;margin:8px 0;position:relative;touch-action:pan-x pan-y}
.msg .md pre code{background:none;border:0;padding:0;color:#e8edf2;white-space:pre;display:block}
.msg .md .cpy{position:absolute;top:6px;right:6px;border:1px solid var(--bg3);border-radius:6px;background:var(--bg3);color:var(--fg2);font-size:11px;padding:3px 8px}
.msg .md ul,.msg .md ol{padding-left:22px;margin:6px 0}
.msg .md li{margin:3px 0}
.msg .md blockquote{border-left:3px solid var(--acc);padding-left:10px;color:var(--fg2);margin:6px 0}
.msg .md a{color:var(--acc)}
.msg .md table{border-collapse:collapse;margin:8px 0;font-size:13px;max-width:100%;display:block;overflow-x:auto}
.msg .md th,.msg .md td{border:1px solid var(--bg3);padding:4px 8px}
.msg .md th{background:var(--bg3)}
.msg .md hr{border:0;border-top:1px solid var(--bg3);margin:10px 0}
.panel{position:absolute;top:0;right:0;bottom:0;width:86%;max-width:360px;background:var(--bg2);border-left:1px solid var(--bg3);transform:translateX(100%);transition:transform .25s;z-index:20;display:flex;flex-direction:column}
.panel.full{width:100%;max-width:none;border-left:0}
.panel.on{transform:translateX(0)}
.panel .ph{display:flex;align-items:center;padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;border-bottom:1px solid var(--bg3);font-weight:600;gap:10px}
.panel .ph .x{margin-left:auto;border:0;background:none;color:var(--fg2);font-size:18px;padding:4px 8px}
.panel .pc{flex:1;overflow-y:auto;padding:12px}
.mp-cat{font-size:12px;color:var(--fg2);margin:12px 4px 6px}
.mp-item{padding:10px 12px;border:1px solid var(--bg3);border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:14px}
.mp-item small{display:block;color:var(--fg2);font-size:11px;margin-top:2px}
.mp-item.on{border-color:var(--ok);background:rgba(143,211,160,.08)}
.pbtns{display:flex;gap:6px}
.pbtns .ib{font-size:13px}
.titem{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border:1px solid var(--bg3);border-radius:10px;margin-bottom:8px}
.titem .ti{font-size:20px;flex:none}
.titem .tn{flex:1;font-size:14px;font-weight:600}
.titem .td{font-size:12px;color:var(--fg2);margin-top:2px;font-weight:400}
.titem .use{border:0;border-radius:8px;background:var(--bg3);color:var(--acc);font-size:12px;padding:6px 10px;flex:none}
.logline{font-family:Menlo,Consolas,monospace;font-size:11px;padding:5px 8px;border-bottom:1px solid var(--bg3);word-break:break-all;white-space:pre-wrap}
/* ---- 问题反馈面板（全屏版式） ---- */
#pnLogs .pc{padding:0}
.log-sec{padding:12px 14px 4px;font-size:13px;font-weight:700;color:#9a9aa2;display:flex;align-items:center;gap:8px}
.log-sec::after{content:'';flex:1;height:1px;background:var(--bg3)}
.log-card{margin:8px 12px;padding:10px 12px;border:1px solid var(--bg3);border-radius:12px;background:var(--bg3);font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.log-card .lc-head{font-size:11px;color:var(--fg2);margin-bottom:4px;display:flex;gap:8px;align-items:center}
.log-card .lc-role{font-weight:700;color:var(--acc2)}
.log-card .lc-msg{margin:6px 0}
.log-card .lc-msg.u .lc-role{color:var(--acc2)}
.log-card .lc-msg.a .lc-role{color:var(--acc)}
.log-card.u{border-left:3px solid var(--acc2)}
.log-card.a{border-left:3px solid var(--acc)}
.log-empty{padding:20px 16px;text-align:center;color:var(--fg2);font-size:13px}
.logline.e{color:var(--err)}
.logline.t{color:var(--ok)}
.logline.w{color:#e0b050}
#mask{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;z-index:15}
#mask.on{display:block}
.msg.user{margin-left:auto;background:#17171b;color:#d8d8dc;border:1px solid #26262c;border-bottom-right-radius:4px}
.msg.ai{background:var(--bg2);border:1px solid var(--bg3);border-bottom-left-radius:4px}
.msg.err{color:var(--err);border-color:var(--err)}
.msg .cursor{display:none}/*去掉流式回复气泡顶部闪烁小方块（原紫色光标动画）*/
@keyframes bl{50%{opacity:0}}
#bar{display:flex;padding:8px 10px calc(env(safe-area-inset-bottom) + 10px);background:var(--bg2);border-top:1px solid var(--bg3)}
#inp{flex:1;min-width:0;padding:6px 4px;border:0;background:transparent;color:var(--fg);font-size:15px;outline:none;resize:none;max-height:90px;line-height:1.4}
#inp:focus{border:0}
#btnPlus{width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:var(--acc);font-size:22px;line-height:1;padding:0;flex:none;display:flex;align-items:center;justify-content:center}
#send{width:36px;height:36px;flex:none;border:0;border-radius:50%;background:transparent;color:var(--acc);font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0}
#send.stop{background:transparent;color:var(--err)}
#send svg{width:26px;height:26px;pointer-events:none}
#attachRow{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 4px}
#attachRow:empty{display:none}
.att{position:relative;width:56px;height:56px;border-radius:10px;overflow:hidden;border:1px solid var(--bg3);background:var(--bg2)}
.att img{width:100%;height:100%;object-fit:cover}
.msg img{max-width:100%;height:auto;border-radius:8px;margin:6px 0}
.msg video,.msg audio,.msg iframe{max-width:100%;width:100%;border-radius:8px;margin:6px 0}
.msg pre,.msg code{white-space:pre-wrap;word-break:break-word}
.att .fname{position:absolute;left:0;right:0;bottom:0;font-size:9px;background:rgba(0,0,0,.6);color:#fff;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att .x{position:absolute;top:1px;right:1px;width:18px;height:18px;border:0;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:11px;line-height:1}
.attmenu{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom) + 84px);background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--rad);padding:6px;display:none;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.attmenu.on{display:block}
.attmenu button{display:block;width:100%;text-align:left;padding:11px 14px;border:0;background:none;color:var(--fg);font-size:15px;border-radius:8px}
.attmenu button:active{background:var(--bg3)}
#send .ico-stop{display:none}
#send.stop .ico-send{display:none}
.aladdin-fx .a-flame{transform-origin:5px 11px;animation:zfLampFlame 1.6s ease-in-out infinite;}@keyframes zfLampFlame{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.25) translateY(-.6px);opacity:1}}.aladdin-fx .a-smoke{opacity:0;animation:zfLampSmoke 2.2s ease-out infinite;}@keyframes zfLampSmoke{0%{opacity:0;transform:translateY(0)}30%{opacity:.85}100%{opacity:0;transform:translateY(-3px)}}.ico-send{display:block}
#send.stop .ico-stop{display:block}
#send.stop .ico-stop{animation:zfCarpet 1.8s ease-in-out infinite;transform-origin:12px 13px}
/* 输入框容器：把 ＋ / textarea / 发送 三者包进同一圆角框内，整体更简洁 */
#inputBox{flex:1;display:flex;align-items:center;gap:8px;padding:4px 4px 4px 6px;border:1px solid var(--bg3);border-radius:var(--rad);background:var(--bg);transition:border-color .15s}
#inputBox:focus-within{border-color:var(--acc)}
#bar>#inputBox{min-height:44px}
@keyframes zfCarpet{0%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-1.6px) rotate(-4deg)}50%{transform:translateY(-2.4px) rotate(0deg)}75%{transform:translateY(-1.2px) rotate(4deg)}100%{transform:translateY(0) rotate(0deg)}}
/* ===== 工具执行记录卡片（toolpanel 移植） ===== */
.trc-title{padding:10px 14px 4px;font-size:12px;color:var(--fg2);border-bottom:1px solid var(--bg3)}
.trc-wrap{flex:1;min-height:60px}
.trc-card{background:var(--bg);border:1px solid var(--bg3);border-radius:10px;margin-bottom:8px;overflow:hidden}
.trc-card.trc-fail{border-color:rgba(255,107,107,.5)}
.trc-head{display:flex;align-items:center;gap:8px;padding:9px 11px;font-size:13px;cursor:pointer}
.trc-head .trc-name{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trc-card.trc-fail .trc-head{color:var(--err)}
.trc-ms{font-size:11px;color:var(--fg2);flex:none}
.trc-body{display:none;border-top:1px solid var(--bg3);padding:8px 11px;max-height:260px;overflow-y:auto}
.trc-card.trc-open .trc-body{display:block}
.trc-sec{margin-bottom:8px}
.trc-lab{font-size:11px;color:var(--fg2);margin-bottom:3px}
.trc-sec pre{font-family:Menlo,Consolas,monospace;font-size:11px;white-space:pre-wrap;word-break:break-all;color:var(--fg);background:var(--bg2);border-radius:6px;padding:6px;max-height:120px;overflow-y:auto}
.trc-empty{color:var(--fg2);font-size:12px;text-align:center;padding:16px 0}
/* ===== 台球工具球（移植自桌面版，手机适配：球14px、飞入70px） ===== */
.tt-row{position:relative;display:inline-flex;flex-direction:row;align-items:center;gap:6px;margin-top:6px;vertical-align:middle;transition:opacity .3s}
.tt-row.tt-done{opacity:0}
.tt-hole{position:relative;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#0a0f1f 0%,#060a16 70%);box-shadow:inset 0 1px 2px rgba(0,0,0,.8);flex-shrink:0}
/* 旋转的是左边的"洞"（袋口光环），不是文字球：对齐 PC 端，球静止逐个累积、洞转起来 */
.tt-hole::after{content:'';position:absolute;left:-2px;top:-2px;right:-2px;bottom:-2px;border-radius:50%;border:2px solid rgba(150,150,158,.75);border-top-color:transparent;border-bottom-color:transparent;animation:typing-spin 1s linear infinite}
.thinking-tools{display:inline-flex;gap:5px;flex-shrink:0}
.tt-circle{display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;border-radius:50%;background:rgba(150,150,158,.15);border:1.5px solid rgba(150,150,158,.35);color:#e8eeff;font-size:16px;font-weight:700;line-height:1;animation:tt-pop .35s ease both;flex-shrink:0}
@keyframes tt-pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.tt-circle.tt-fly-in{animation:ttFlyIn .55s cubic-bezier(.18,.9,.28,1.05) both}
@keyframes ttFlyIn{0%{transform:translateX(105px) scale(.4) rotate(180deg);opacity:0}35%{opacity:1}75%{transform:translateX(-5px) scale(1.06) rotate(-8deg);opacity:1}100%{transform:translateX(0) scale(1) rotate(0deg);opacity:1}}
.tt-circle.tt-new{background:rgba(150,150,158,.35);border-color:rgba(170,170,178,.75);color:#d8d8dc;box-shadow:0 0 6px rgba(150,150,158,.45)}
.tt-circle.tt-hit{animation:ttHit .5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes ttHit{0%{transform:translateX(0) scale(1);box-shadow:0 0 0 rgba(160,160,168,0)}18%{transform:translateX(-3px) scale(1.18);box-shadow:0 0 10px 3px rgba(160,160,168,.65)}55%{transform:translateX(2px) scale(.96);box-shadow:0 0 6px 2px rgba(160,160,168,.35)}100%{transform:translateX(0) scale(1);box-shadow:0 0 0 rgba(160,160,168,0)}}
.tt-plus-pop{position:absolute;left:6px;top:-14px;font-size:11px;font-weight:800;color:#c8c8cc;text-shadow:0 0 6px rgba(160,160,168,.8);pointer-events:none;animation:ttPlusPop 1.1s ease-out both;z-index:3}
@keyframes ttPlusPop{0%{opacity:0;transform:translateY(4px) scale(.6)}25%{opacity:1;transform:translateY(-6px) scale(1.15)}70%{opacity:1;transform:translateY(-14px) scale(1)}100%{opacity:0;transform:translateY(-22px) scale(.9)}}
.tt-hole.tt-burst{animation:ttBurst .7s ease both}
@keyframes ttBurst{0%{box-shadow:0 0 0 0 rgba(160,160,168,.6);transform:scale(1)}30%{transform:scale(1.5);box-shadow:0 0 18px 8px rgba(160,160,168,.65)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(160,160,168,0)}}
.thinking-tools.tt-potting .tt-circle{animation:ttRollToHole .5s cubic-bezier(.5,0,.9,.4) both}
.thinking-tools.tt-potting .tt-circle:nth-child(2){animation-delay:.05s}
.thinking-tools.tt-potting .tt-circle:nth-child(3){animation-delay:.1s}
.thinking-tools.tt-potting .tt-circle:nth-child(4){animation-delay:.15s}
.thinking-tools.tt-potting .tt-circle:nth-child(5){animation-delay:.2s}
.thinking-tools.tt-potting .tt-circle:nth-child(6){animation-delay:.25s}
.thinking-tools.tt-potting .tt-circle:nth-child(7){animation-delay:.3s}
.thinking-tools.tt-potting .tt-circle:nth-child(8){animation-delay:.35s}
.thinking-tools.tt-potting .tt-circle:nth-child(9){animation-delay:.4s}
.thinking-tools.tt-potting .tt-circle:nth-child(10){animation-delay:.45s}
@keyframes ttRollToHole{to{transform:translateX(-20px) scale(.15);opacity:0}}
/* ===== 折叠卡片（对齐PC端）：思考片段/工具调用/结果默认只显示一行摘要，点击展开全文 ===== */
.tc-card{max-width:100%;width:100%;box-sizing:border-box;margin:4px 0;border-radius:8px;background:var(--bg2);border:1px solid var(--bg3);font-size:12px;overflow:hidden}
.tc-card .tc-head{padding:5px 10px;color:var(--fg2);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none}
.tc-card .tc-body{padding:6px 10px;color:var(--fg2);white-space:pre-wrap;word-break:break-all;max-height:220px;overflow-y:auto;border-top:1px dashed var(--bg3)}
.msg ul{list-style:disc;padding-left:20px;margin:6px 0}
.msg ol{list-style:decimal;padding-left:22px;margin:6px 0}
.msg li{margin:2px 0}
.msg table{border-collapse:collapse;margin:6px 0;max-width:100%;display:block;overflow-x:auto}
.msg th,.msg td{border:1px solid var(--bg3);padding:4px 8px;font-size:13px;text-align:left}
.msg th{background:var(--bg2);font-weight:600}
.msg blockquote{border-left:3px solid var(--acc);padding:2px 10px;margin:6px 0;color:var(--fg2)}

/* 手机峰控面板全屏修复：工具/历史/日志侧滑面板铺满全屏，内部弹性滚动，防中间截断 */
.panel{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;max-width:none;transform:translateY(100%)}
.panel.on{transform:translateY(0)}
.panel .pc{flex:1;min-height:0;overflow-y:auto}
/* ---------- 自研全局弹窗（替代原生 confirm/alert/prompt，统一深空科技风） ---------- */
.zf-dlg-overlay{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;background:rgba(6,9,20,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:26px;opacity:0;transition:opacity .2s ease}
.zf-dlg-overlay.on{display:flex;opacity:1}
.zf-dlg{width:100%;max-width:340px;background:var(--bg2);border:1px solid var(--bg3);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 1px rgba(138,138,146,.12);padding:0;overflow:hidden;transform:scale(.9) translateY(10px);transition:transform .24s cubic-bezier(.2,.9,.3,1.25)}
.zf-dlg-overlay.on .zf-dlg{transform:scale(1) translateY(0)}
.zf-dlg-head{display:flex;align-items:center;gap:8px;padding:18px 20px 0}
.zf-dlg-icon{font-size:20px;line-height:1}
.zf-dlg-title{font-size:16px;font-weight:700;color:var(--fg);letter-spacing:.3px}
.zf-dlg-msg{padding:10px 20px 4px;font-size:14px;line-height:1.6;color:var(--fg2);word-break:break-word;white-space:pre-wrap}
.zf-dlg-input{margin:12px 20px 2px;width:calc(100% - 40px);padding:11px 13px;border:1px solid var(--bg3);border-radius:12px;background:rgba(11,14,26,.7);color:var(--fg);font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s}
.zf-dlg-input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(138,138,146,.22)}
.zf-dlg-actions{display:flex;gap:10px;padding:16px 20px 18px}
.zf-dlg-btn{flex:1;padding:11px 0;border:0;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .12s,filter .2s;-webkit-tap-highlight-color:transparent}
.zf-dlg-btn:active{transform:scale(.97)}
.zf-dlg-btn.cancel{background:var(--bg3);color:var(--fg2)}
.zf-dlg-btn.ok{background:#1a1a1f;border:1px solid #2a2a30;color:#d8d8dc;box-shadow:none}
.zf-dlg-btn.danger{background:#3a1e1e;border:1px solid #5a3030;color:#e0b0b0;box-shadow:none}

<script>
function zfApiBase(){try{if(location.protocol==='http:'||location.protocol==='https:')return location.origin}catch(e){}return (typeof window.ZF_SERVER_BASE==='string'&&window.ZF_SERVER_BASE)?window.ZF_SERVER_BASE:''}
'use strict';
/* ===== 自研全局弹窗组件（替代原生 confirm/alert/prompt，统一视觉，异步 Promise） ===== */
window.zfDialog=(function(){
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function open(cfg){
    cfg=cfg||{};
    return new Promise(function(resolve){
      var ov=document.createElement('div');ov.className='zf-dlg-overlay';
      var isInput=!!cfg.input;
      var okCls=cfg.danger?'danger':'ok';
      var html='<div class="zf-dlg" role="dialog" aria-modal="true">'
        +'<div class="zf-dlg-head"><span class="zf-dlg-icon">'+(cfg.icon||'&#128172;')+'</span><span class="zf-dlg-title">'+esc(cfg.title||'提示')+'</span></div>'
        +'<div class="zf-dlg-msg">'+esc(cfg.message||'')+'</div>'
        +(isInput?'<input class="zf-dlg-input" type="text" value="'+esc(cfg.default||'')+'" placeholder="'+esc(cfg.placeholder||'')+'" autocomplete="off" spellcheck="false">':'')
        +'<div class="zf-dlg-actions">'
        +(isInput||cfg.showCancel?'<button class="zf-dlg-btn cancel" data-r="0">'+esc(cfg.cancelText||'取消')+'</button>':'')
        +'<button class="zf-dlg-btn '+okCls+'" data-r="1">'+esc(cfg.okText||'确定')+'</button>'
        +'</div></div>';
      ov.innerHTML=html;
      document.body.appendChild(ov);
      var inp=ov.querySelector('.zf-dlg-input');
      requestAnimationFrame(function(){ov.classList.add('on');if(inp){try{inp.focus();inp.select()}catch(e){}}});
      var closed=false;
      function done(val){if(closed)return;closed=true;ov.classList.remove('on');setTimeout(function(){try{ov.remove()}catch(e){}},220);resolve(val)}
      ov.addEventListener('click',function(ev){
        var b=ev.target.closest?ev.target.closest('.zf-dlg-btn'):null;
        if(b){
          if(b.getAttribute('data-r')==='1'){done(isInput?(inp?inp.value:''):true)}
          else{done(isInput?null:false)}
        } else if(ev.target===ov){done(isInput?null:false)}
      });
      if(inp){inp.addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();done(inp.value)}})}
    });
  }
  return {
    confirm:function(msg,opts){opts=opts||{};return open({message:msg,title:opts.title||'请确认',icon:opts.icon||'❓',danger:opts.danger,okText:opts.okText||'确定',cancelText:opts.cancelText||'取消',showCancel:true})},
    alert:function(msg,opts){opts=opts||{};return open({message:msg,title:opts.title||'提示',icon:opts.icon||'ℹ️',okText:opts.okText||'知道了'})},
    prompt:function(msg,def,opts){opts=opts||{};return open({message:msg,title:opts.title||'请输入',icon:opts.icon||'✏️',input:true,default:def||'',placeholder:opts.placeholder||'',okText:opts.okText||'确定',cancelText:opts.cancelText||'取消'})}
  };
})();
/* ===== 调试：全局错误捕获，仅输出到 console（不显示在聊天区，避免泄露内部信息） ===== */
function _dbgErr(label,msg){try{console.log('['+label+'] '+msg)}catch(e){}try{pushLog('e',label+': '+msg)}catch(e2){}}
window.addEventListener('error',function(ev){_dbgErr('JS错误',(ev.message||'')+' @'+(ev.lineno||'?')+':'+(ev.colno||'?'))});
window.addEventListener('unhandledrejection',function(ev){var r=ev.reason;_dbgErr('Promise',(r&&(r.message||r))||String(r))});
// ---- 原生 fetch shim：file:// 页在新版 WebView 中 fetch 被 CORS 拦截，转交原生 HTTP 桥 ----
(function(){
  try{
    if(location.protocol!=='file:'||!window.ZFHttp||window.__zfFetchShim)return;
    window.__zfFetchShim=true;
    var __origFetch=window.fetch.bind(window);
    var __pending={},__seq=0;
    window.__zfHttpDone=function(id,resp){
      var p=__pending[id];if(!p)return;delete __pending[id];
      var ok=resp.status>=200&&resp.status<300;
      p.res({status:resp.status,ok:ok,statusText:ok?'OK':'Error',
        headers:{get:function(){return null}},
        text:function(){return Promise.resolve(resp.body)},
        json:function(){return Promise.resolve(JSON.parse(resp.body))}});
    };
    window.fetch=function(input,init){
      init=init||{};
      var url=typeof input==='string'?input:(input&&input.url)||'';
      if(!/^https?:/i.test(url))return __origFetch(input,init);
      var headers={};
      var src=init.headers||((input&&input.headers)||(typeof Headers!=='undefined'&&new Headers())||{});
      try{
        if(typeof src.forEach==='function')src.forEach(function(v,k){headers[k]=v});
        else for(var k in src)headers[k]=src[k];
      }catch(e){}
      var body=init.body;
      if(body&&typeof body!=='string'){
        try{body=body.toString()}catch(e){body=String(body)}
      }
      var id='h'+(++__seq);
      var sig=init.signal;
      return new Promise(function(resolve,reject){
        var _aborted=function(){
          if(__pending[id]){delete __pending[id];try{window.ZFHttp.cancel(id)}catch(e){}reject(new DOMException('Aborted','AbortError'))}
        };
        if(sig){
          if(sig.aborted){_aborted();return}
          try{sig.addEventListener('abort',_aborted)}catch(e){}
        }
        __pending[id]={res:function(v){try{sig&&sig.removeEventListener('abort',_aborted)}catch(e){}resolve(v)},rej:function(e){try{sig&&sig.removeEventListener('abort',_aborted)}catch(e){}reject(e)}};
        window.ZFHttp.request(id,url,(init.method||'GET'),JSON.stringify(headers),body||null);
        setTimeout(function(){if(__pending[id]){delete __pending[id];reject(new TypeError('连接超时：网络较慢或服务器未响应，请稍后重试'))}},150000);
      });
    };
  }catch(e){}
})();
var ZF='https://www.zf3d.com';
var LS=window.localStorage;
function $(id){return document.getElementById(id)}
function save(k,v){try{LS.setItem(k,typeof v==='object'?JSON.stringify(v):v)}catch(e){}}
function load(k,d){try{var v=LS.getItem(k);return v===null?d:(v&&(v[0]==='{'||v[0]==='[')?JSON.parse(v):v)}catch(e){return d}}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
/* 智能滚动：仅当用户本来就在底部附近时才自动跟滚；用户上翻阅读时不打扰（修复思考期间无法拖拽滚动） */
function _nearBottom(){try{var c=$('chat');return c.scrollHeight-c.scrollTop-c.clientHeight<90}catch(e){return true}}
function scrollEnd(force){var c=$('chat');try{if(force||_nearBottom())c.scrollTop=c.scrollHeight}catch(e){}}

/* ---------- 登录：直接 POST zf3d.com/api/auth.asp ---------- */
var agKey=load('zf_agkey',''), zfUser=parseInt(load('zf_uid','0'))||0, zfName=load('zf_name','');
async function doLogin(){
  var u=$('user').value.trim(), p=$('pass').value;
  if(!u||!p){$('loginMsg').textContent='请输入账号和密码';return}
  $('btnLogin').disabled=true;$('loginMsg').textContent='登录中…';
  try{
    var fd=new URLSearchParams();fd.set('a','login');fd.set('username',u);fd.set('password',p);
    var r=await fetch(ZF+'/api/auth.asp',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded','Referer':ZF+'/'},body:fd.toString()});
    var txt=await r.text();
      var j;try{j=JSON.parse(txt)}catch(e){throw new Error('服务器响应异常，请稍后重试')}
    if(!j.success)throw new Error(j.message||'登录失败，请检查账号密码');
    var d=j.data||{};
    if(typeof d==='string')try{d=JSON.parse(d)}catch(e){}
    agKey=(d&&d.agent_api_key)||'';
    zfUser=parseInt((d&&d.user_id)||0)||0;
    save('zf_agkey',agKey);save('zf_uid',zfUser);save('zf_name',u);
    enterChat();
  }catch(e){
    $('loginMsg').textContent='⚠️ '+(e.message||'网络连接失败，请检查手机网络后重试');
    // 预填上次账号
  }finally{$('btnLogin').disabled=false}
}
$('btnLogin').onclick=doLogin;
$('pass').onkeydown=function(e){if(e.key==='Enter')doLogin()};
$('eye').onclick=function(){var p=$('pass');p.type=p.type==='password'?'text':'password';this.textContent=p.type==='password'?'👁':'🙈'};
/* 注册入口：朱峰账号注册仅在网页完成，点击用系统浏览器打开官网（原生桥优先，兜底新窗口） */
$('btnReg').onclick=function(ev){
  ev.preventDefault();
  var url=ZF+'/';
  try{
    if(typeof bJson==='function'&&(window.ZFBridge||window.ZFMobile)){
      var rc=bJson('openUrl',url);
      if(rc&&rc.ok)return;
    }
  }catch(e){}
  try{window.open(url,'_blank','noopener');}catch(e){$('loginMsg').textContent='请用浏览器访问 '+url+' 注册账号';}
};

/* ---------- 模型：恒用官方推荐（选择模型功能已删除） ---------- */
/* 【v88 修复"没反应/模型没弄到"】初值即内置官方默认（实测 zf_models_config.json：
   chat=zf-glm-flash / vision=zf-glm-vision），即使 loadModels 因启动竞态/BOM 解析失败
   未能填充，MODEL.chat 也不为空，发送不会因"未获取到默认模型"被拦截 */
var MODEL={chat:'zf-glm-flash',vision:'zf-glm-vision'};
var MODELS={chat:[],vision:[]};
function _mId(m){
  if(m.modelIds&&m.modelIds.length){var mi=m.modelIds[0];return (typeof mi==='string')?mi:mi.id}
  return m.model||m.id||'';
}
async function loadModels(){
  try{
    var r=await fetch(ZF+'/api/zf_models_config.json');
    /* 【v88 修复"模型没弄到"】实测 config 响应体开头带 UTF-8 BOM(﻿)，老 WebView 的
       r.json() 遇 BOM 抛错 → MODELS 没填充 → MODEL.chat 留空 → 发送被拦截"没反应"。
       改为 text 取响应、手动 strip BOM 再 JSON.parse，更稳 */
    var cfgTxt=await r.text();var cfg=JSON.parse(String(cfgTxt).replace(/^\uFEFF/,''));
    var list=(cfg&&cfg.models)||[];
    MODELS={chat:[],vision:[]};
    list.forEach(function(m){
      if(m.enabled===false)return;
      var cat=m.category||'chat';
      var rec=(m.isDefault===true||m.recommended===true||m.recommend===true||m.default===true);
      var id=_mId(m);if(!id)return;
      MODELS[cat].push({id:id,name:m.name||m.label||'',rec:rec});
      if(rec||!MODEL[cat])MODEL[cat]=id;
    });
  }catch(e){
    console.warn('模型配置加载失败，用缓存/默认',e);
  }
  if(!MODEL.chat){var _fb=load('zf_model_cache','')||''; if(!_fb&&MODELS.chat&&MODELS.chat.length)_fb=MODELS.chat[0].id; MODEL.chat=_fb;}
  if(!MODEL.vision){var _fv=load('zf_vision_cache','')||''; if(!_fv&&MODELS.vision&&MODELS.vision.length)_fv=MODELS.vision[0].id; MODEL.vision=_fv;}
  /* 墓碑：选择模型功能（⚙按钮/pnModel面板/手动选择逻辑）已按用户要求删除，严禁恢复 btnModel/pnModel/zf_model_sel 相关 UI 或逻辑，模型恒用官方推荐 */
  save('zf_model_cache',MODEL.chat);save('zf_vision_cache',MODEL.vision);
  try{var stEl2=document.getElementById('stTxt');if(stEl2)stEl2.textContent='峰控'}catch(e2){}
}

function raceOne(model,msgs,ctl,genSig){

async function sendRace(msgs,span,onDone,genSig){
  var n=raceCount();
  var base=MODEL.chat;
  /* 赛道模型列表：zf_race_models 逗号分隔，不足补当前模型，超出截断 */
  var list=String(load('zf_race_models','')||'').split(',').map(function(s){return s.trim()}).filter(Boolean);
  while(list.length<n)list.push(base);
  list=list.slice(0,n);
  var ctls=list.map(function(){return new AbortController()});
  var results=list.map(function(){return null});
  var done=0,settled=false;
  span.textContent='🏁 '+n+' 路赛道并行中（'+list.join(' / ')+'）…';scrollEnd();
  function check(){
    done++;if(settled)return;
    var win=null;
    for(var i=0;i<results.length;i++)if(results[i]&&results[i].out){win=results[i];break}
    if(!win){
      if(done<results.length)return;
      settled=true;
      onDone(new Error('全部赛道失败：'+results.map(function(r){return (r.model||'?')+': '+(r.err||'?')}).join('；')),null);
      return;
    }
    settled=true;
    ctls.forEach(function(c,j){if(results[j]!==win){try{ctls[j].abort()}catch(e){}}});
    var losers=results.filter(function(r){return r&&r!==win});
    onDone(null,{win:win,losers:losers});
  }
  var ps=list.map(function(mo,i){
    var go=function(){return raceOne(mo,msgs,ctls[i],genSig)
      .then(function(out){results[i]={model:mo,out:out};check()})
      .catch(function(e){results[i]={model:mo,err:(e&&e.name==='AbortError')?'已取消':e.message};check()})};
    return i?new Promise(function(res){setTimeout(res,200*i)}).then(go):go();
  });

/* 工具执行器：等价于底层 _brain_tool_exec */
/* 高危工具 JS 硬门禁（审核建议）：L3 确认门落地前的最小拦截，弹窗须用户明确同意 */
var HIGH_RISK_TOOLS={'delete_file':1};
/* 峰控手机端 → 服务器内置浏览器 /api/browser 桥（GET方式，避免CORS/POST复杂度） */
function zfApiBase(){try{if(location.protocol==='http:'||location.protocol==='https:')return location.origin}catch(e){}return (typeof window.ZF_SERVER_BASE==='string'&&window.ZF_SERVER_BASE)?window.ZF_SERVER_BASE:''}
async function _brApi(payload){
  var b=zfApiBase();if(!b)return '错误:无法连接服务器(接口地址未知)';
  var qs=Object.keys(payload).filter(function(kk){return payload[kk]!==undefined&&payload[kk]!==null&&payload[kk]!==''}).map(function(kk){return kk+'='+encodeURIComponent(payload[kk])}).join('&');
  var r=await bJsonA('httpGet',b+'/api/browser?'+qs);/*异步：不阻塞主线程，计算中仍可拖拽/停止*/

  if(!(r&&r.ok))r=await bJsonA('httpGet',b+'/api/browser?'+qs);/*偶发失败重试一次*/

  if(!(r&&r.ok))return '错误:'+((r&&r.error)||'请求失败（服务器不可达？可改用 phone_browser_open 用手机内置浏览器打开）');
  var t=r.text||'';
  try{var j=JSON.parse(t);}catch(e){return t.slice(0,4000)||'成功';}
  if(j&&j.ok===false)return '错误:'+(j.error||JSON.stringify(j).slice(0,500));
  return (typeof j.data==='string')?j.data.slice(0,4000):JSON.stringify(j.data!==undefined?j.data:j).slice(0,4000);
}
async function _brShot(session){
  var b=zfApiBase();if(!b)return '错误:无法连接服务器';
  /* 先让引擎拍一张 */
  var r=await bJsonA('httpGet',b+'/api/browser?action=screenshot&session='+(session||'default'));
  /* 再拉图 */
  var u=b+'/api/browser?action=shot&fmt=jpeg&session='+(session||'default');
  var img=await bJsonA('httpGet',u);
  if(img&&img.ok&&img.base64)return 'data:image/jpeg;base64,'+img.base64;
  return (r&&r.ok)?('已触发截图（图片请在服务器端查看: '+u+'）'):('错误:'+((r&&r.error)||'截图失败'));
}
async function agentExecTool(fn,args){

    var desc=(args&&(args.to||args.number||args.path||args.pkg||args.package))||'';
    var ok=await window.zfDialog.confirm('助手请求执行高危操作：'+fn+(desc?(' → '+desc):'')+'。是否允许？',{title:'高危操作确认',icon:'⚠️',danger:true,okText:'允许执行',cancelText:'拒绝'});
    if(!ok)return '用户未授权，操作已取消';
  }
  function J(){var r=bCall.apply(null,[fn.replace(/_/g,'')].map(function(k){return args[k]}));try{return JSON.parse(r)}catch(e){return r}}
  switch(fn){
    case 'read_file':{var r=await bJsonA('readFile',normPath(args.path));return r?(r.ok?String(r.content||'').slice(0,4000):'错误:'+(r.error||'失败')):'bridge不可用';}

    case 'append_file':{var pa=normPath(args.path),ca=args.content||'';var rra=await bJsonA('appendFile',pa,ca);return (rra&&rra.ok)?('已追加 '+pa+'（现'+(rra.size||'?')+'字节）'):('错误:'+((rra&&rra.error)||'失败'));}
    case 'list_files':{var _lp=normPath(args.path);var r3=await bJsonA('listFiles',_lp);if(!(r3&&r3.ok)){

    case 'search_files':{var r4=await bJsonA('searchFiles',args.dir,args.keyword,true);return (r4&&r4.ok)?('命中'+r4.total+'条：\n'+r4.hits.slice(0,30).join('\n')):('错误:'+((r4&&r4.error)||'失败'));}
    case 'delete_file':{var r5=await bJsonA('deleteFile',normPath(args.path));return (r5&&r5.ok)?'已删除 '+args.path:('错误:'+((r5&&r5.error)||'失败'));}
    case 'web_search':{

    case 'fetch_url':{var r7=await bJsonA('httpGet',args.url);return (r7&&r7.ok)?r7.text.slice(0,4000):('抓取失败:'+((r7&&r7.error)||''));}

/* ===== 工具执行记录（移植自 PC 端 toolpanel）：按发起会话存进 sess.recs，随 zf_sessions 落 localStorage+原生 Prefs 双备份，切会话/重启不丢 ===== */
var TOOL_EXEC_LOG=[]; /* 兼容旧引用：仅作占位，真实数据落在 sess.recs */
function _sessOf(id){for(var i=0;i<SESSIONS.length;i++)if(SESSIONS[i].id===id)return SESSIONS[i];return null}
function curRecs(){var s=curSess();return (s&&s.recs)||[]}
function toolRecPush(fn,args,result,ms,ok,sessId){
  try{
    var s=(sessId&&_sessOf(sessId))||curSess();if(!s)return;
    var recs=s.recs||(s.recs=[]);
    recs.push({fn:fn,args:JSON.stringify(args||{}),result:String(result||'').slice(0,600),ms:Math.round(ms),ok:!!ok,t:Date.now()});
    if(recs.length>100)recs.splice(0,recs.length-100); /* 每会话上限100条，防 localStorage 膨胀 */
    /* 仅当面板正显示「该会话」时才刷新，避免切到别的会话时把别的会话记录渲染进来 */
    if(s.id===CUR){var tlEl=document.getElementById('toolRecList');if(tlEl&&tlEl.offsetParent!==null)renderToolRec()}
    persist(); /* 落 localStorage（原生层每5秒再同步一份 Prefs，重装/杀进程可恢复） */
  }catch(e){}
}
function renderToolRec(){
  var box=document.getElementById('toolRecList');if(!box)return;
  var list=curRecs().slice(-100).reverse(); /* 默认渲染当前会话最近100条（上限100），方便排错 */
  box.textContent='';
  if(!list.length){var e0=document.createElement('div');e0.className='trc-empty';e0.textContent='（本会话暂无工具执行记录）';box.appendChild(e0);return;}
  list.forEach(function(rec){
    var card=document.createElement('div');card.className='trc-card'+(rec.ok?'':' trc-fail');
    var head=document.createElement('div');head.className='trc-head';
    var st=document.createElement('span');st.textContent=rec.ok?'✓':'✗';
    var nm=document.createElement('span');nm.className='trc-name';nm.textContent='🔧 '+rec.fn;
    var ms=document.createElement('span');ms.className='trc-ms';ms.textContent=rec.ms+'ms';
    head.appendChild(st);head.appendChild(nm);head.appendChild(ms);
    head.addEventListener('click',function(){card.classList.toggle('trc-open')});
    var body=document.createElement('div');body.className='trc-body';
    var pa=document.createElement('div');pa.className='trc-sec';
    var pal=document.createElement('div');pal.className='trc-lab';pal.textContent='入参';
    var pav=document.createElement('pre');pav.textContent=rec.args;
    pa.appendChild(pal);pa.appendChild(pav);
    var rb=document.createElement('div');rb.className='trc-sec';
    var rbl=document.createElement('div');rbl.className='trc-lab';rbl.textContent='出参';
    var rbv=document.createElement('pre');rbv.textContent=rec.result;
    rb.appendChild(rbl);rb.appendChild(rbv);

    card.appendChild(head);card.appendChild(body);
    box.appendChild(card);
  });

/* ===== 工具利用率统计（峰控 App ← 服务器 /api/tool/stats）===== */
var _usageCache=null;
function usageFetch(days,cb){
  var b=zfApiBase();if(!b){cb('错误:无法连接服务器(接口地址未知)');return;}
  try{
    var r=bJson('httpGet',b+'/api/tool/stats?days='+(days||30));
    if(!(r&&r.ok)){cb('错误:'+((r&&r.error)||'请求失败（服务器不可达？）'));return;}
    var j=JSON.parse(r.text||'{}');
    if(!j.ok){cb('错误:'+(j.err||'失败'));return;}
    _usageCache=j;cb(null,j);
  }catch(e){cb('错误:'+e.message)}
}
function usageText(j){
  var items=j.items||[];
  if(!items.length)return '（近'+(j.days||30)+'天暂无工具使用数据）';
  var tot=0;items.forEach(function(x){tot+=x.calls});
  var lines=['【工具利用率统计】近'+(j.days||30)+'天 | 工具'+items.length+'个 | 总调用'+tot+'次',
    '排名 | 分类 | 工具 | 调用 | 错误 | 错误率 | 均耗时 | 活跃天数'];
  items.forEach(function(x,i){
    var er=x.calls?(100*x.errors/x.calls).toFixed(1)+'%':'-';
    var avg=x.calls?Math.round(x.total_ms/x.calls)+'ms':'-';
    lines.push((i+1)+' | '+(x.category||'未知')+' | '+x.tool+' | '+x.calls+' | '+x.errors+' | '+er+' | '+avg+' | '+x.active_days+'天');
  });
  return lines.join('\n');
}

/* 包装 agentExecTool：首尾埋点 + try/finally 兜底失败路径 */
var _agentExecToolRaw=agentExecTool;
agentExecTool=async function(fn,args,sessId){
  var t0=Date.now(),r;
  try{r=await _agentExecToolRaw(fn,args);}
  catch(e){r='工具执行失败:'+e.message;toolRecPush(fn,args,r,Date.now()-t0,false,sessId);throw e;}
  var ok=!/^错误:|^失败|工具执行失败|未知工具/.test(String(r).slice(0,12));
  toolRecPush(fn,args,r,Date.now()-t0,ok,sessId);
  return r;
}

/* 台球工具球：挂在当前 AI 气泡旁的洞口+球队列，满10颗进洞清零（移植自桌面版） */
var _ttRow=null,_ttHole=null,_ttTools=null,_ttCount=0,_ttRound=0;
function ttGetRow(){
  var chat=$('chat');
  var bub=chat&&chat.lastElementChild;
  /* 关键修复：台球行 _ttRow 本身被 appendChild 在 chat 末尾，若不排除会让 lastElementChild 变成台球行自身，导致下一个工具误判「气泡变了」而重建清空旧球（表现为 4 个工具只并列 1 个球、后球吞掉前球）。台球行在末尾时取其前一个兄弟作为真正气泡 */
  if(bub&&bub===_ttRow&&_ttRow.previousElementSibling)bub=_ttRow.previousElementSibling;
  if(!bub)return null;
  if(_ttRow&&_ttRow._bub===bub&&document.body.contains(_ttRow))return _ttRow;
  /* 气泡变化时先移除旧的台球行，保证全屏幕始终只有一行台球（左边洞只出现一次），防止残留多行堆成多列 */
  if(_ttRow&&_ttRow.parentNode){try{_ttRow.remove()}catch(eRM){}}
  _ttRow=document.createElement('div');_ttRow.className='tt-row';_ttRow._bub=bub;
  _ttHole=document.createElement('span');_ttHole.className='tt-hole';_ttRow.appendChild(_ttHole);
  /* 「正在思考…」文字已按需求移除：台球小球区保留，不再显示文字 */
  _ttTools=document.createElement('span');_ttTools.className='thinking-tools';_ttRow.appendChild(_ttTools);
  /* 台球固定在最下面：插到气泡后并挪到 chat 末尾 */
  chat.appendChild(_ttRow);
  _ttCount=0;_ttRound=0;
  return _ttRow;
}
var _ttTipEl=null,_ttTipTimer=null;
function ttShowTip(el, ev){
  try{
    if(_ttTipEl){_ttTipEl.remove();_ttTipEl=null}
    var tip=document.createElement('div');tip.className='tt-tip';
    tip.textContent=el.getAttribute('data-tip')||el.title||'工具';
    document.body.appendChild(tip);_ttTipEl=tip;
    var x,y;
    if(ev.touches&&ev.touches[0]){x=ev.touches[0].clientX;y=ev.touches[0].clientY}
    else if(ev.clientX!=null){x=ev.clientX;y=ev.clientY}
    else{var r=el.getBoundingClientRect();x=r.left+r.width/2;y=r.top}
    if(x==null){var r2=el.getBoundingClientRect();x=r2.left;y=r2.top}
    var rect=tip.getBoundingClientRect();
    var L=Math.max(8,Math.min((window.innerWidth-rect.width-8),x-rect.width/2));
    var T=y-rect.height-14; if(T<8)T=y+24;
    tip.style.left=L+'px';tip.style.top=T+'px';
    if(_ttTipTimer)clearTimeout(_ttTipTimer);
    _ttTipTimer=setTimeout(function(){if(_ttTipEl){_ttTipEl.remove();_ttTipEl=null}},1800);
  }catch(e){}
}
function ttPush(toolName){
  try{
    var row=ttGetRow();if(!row)return;
    if(_ttHole.classList.contains('tt-burst'))return;
    _ttCount++;
    var ch=String(toolName||'?').charAt(0).toUpperCase();
    var sp=document.createElement('span');
    sp.className='tt-circle tt-fly-in tt-new';
    sp.setAttribute('data-tip',toolName);
    sp.textContent=ch;
    _ttTools.appendChild(sp);
    /* 飞入 0.55s 后移除 tt-fly-in：ttFlyIn 的 both 会锁住 transform，
       移除后小球静止落位、逐个累积（对齐 PC 端），旋转交给左边的"洞" */
    setTimeout(function(){try{sp.classList.remove('tt-fly-in')}catch(e){}},600);
    sp.addEventListener('click', function(ev){ ev.stopPropagation(); try{ttShowTip(sp, ev)}catch(e){} });
    sp.addEventListener('touchstart', function(ev){ try{ttShowTip(sp, ev)}catch(e){} }, {passive:true});
    var prev=sp.previousElementSibling;
    if(prev&&prev.classList.contains('tt-circle')){
      prev.classList.remove('tt-hit');void prev.offsetWidth;prev.classList.add('tt-hit');
      setTimeout(function(){prev.classList.remove('tt-hit')},600);
    }
    var balls=_ttTools.querySelectorAll('.tt-circle');
    for(var i=0;i<balls.length-1;i++)balls[i].classList.remove('tt-new');
    if(_ttCount>=10){
      _ttHole.classList.add('tt-burst');
      _ttTools.classList.add('tt-potting');
      _ttRound++;
      var plus=document.createElement('span');plus.className='tt-plus-pop';plus.textContent='+'+_ttRound;
      _ttRow.insertBefore(plus,_ttHole);
      setTimeout(function(){try{plus.remove()}catch(e){}},1200);
      setTimeout(function(){
        _ttTools.classList.remove('tt-potting');_ttTools.innerHTML='';_ttCount=0;
        try{_ttHole.classList.remove('tt-burst')}catch(e){}
      },700);
    }
  }catch(eTT){}
}

/* 底层循环：与 brain_chat 的 for _round in range(MAX_TOOL_ROUNDS) 一致 */
async function agentLoop(msgs,onStep,ctx){
  var toolLog=[],loopThink='',poolOk=false;
  /* 开局捕获本次生成的停止信号（会话级，不依赖全局 aborter）：后台生成切走也不中止 */
  ctx=ctx||{};
  var _sig=ctx.signal||null;
  var _stop=function(){return (_sig&&_sig.aborted)||(ctx.isStop?ctx.isStop():false)};
  for(var round=0;round<AGENT_MAX_ROUNDS;round++){
    if(_stop())throw new DOMException('Aborted','AbortError');
    var payload={model:MODEL.chat,messages:msgs,stream:false,temperature:0.7,max_tokens:32768};
    payload.tools=AGENT_TOOLS;
    var j=null;
    /* 池托管（首轮或上轮池成功则延续）：经电脑端 chat-pool 车道排队+断点续读；失败回退直连 */
    if(pcPoolOn()&&(round===0||poolOk)){
      try{pushLog('t','[池] 提交电脑池托管请求…')}catch(_pl){}
      var pr=await zfPoolCall(msgs,payload,_sig||null);
      if(pr){
        if(!pr.ok)throw new Error('HTTP '+(pr.status||0)+(pr.error?'：'+String(pr.error).slice(0,150):''));
        j=(pr.data&&pr.data.choices)?pr.data:(pr.choices?pr:null);
        if(j){poolOk=true;pushLog('t','[池] 电脑池返回 ✓')}
      }else{poolOk=false}
    }
    if(!j){
      /* 【v86 修复"消息发不出去/没反应"】主对话 fetch 原无超时，服务端挂起时永久 pending，
         aborter 不释放导致后续发送全被 if(aborter)return 吞掉。加 90s 超时兜底：超时抛普通 Error，
         走报错气泡并在 finally 释放 aborter，恢复可发送。 */
      var _toP=(function(ms){var t,p=new Promise(function(_,rej){t=setTimeout(function(){rej(new Error('请求超时（'+Math.round(ms/1000)+'秒）：服务器未响应，请检查网络后重试'))},ms)});p._c=function(){clearTimeout(t)};return p})(90000);
      var r,txt;
      try{
        var _chain=fetch(ZF+'/api/zf_models_relay.asp?model='+encodeURIComponent(MODEL.chat),{
          method:'POST',signal:_sig||undefined,
          headers:{'Content-Type':'application/json','X-ZF-Key':agKey,'X-ZF-User':String(zfUser||'')},
          body:JSON.stringify(payload)
        }).then(function(_r){return _r.text().then(function(_t){return {_r:_r,_t:_t}})});
        var _res=await Promise.race([_chain,_toP]);
        r=_res._r;txt=_res._t;
      }finally{try{_toP._c()}catch(e){}}
      if(!r.ok)throw new Error(r.status===401?'朱峰登录已失效，请退出后重新登录账号再发送':('HTTP '+r.status+(txt?'：'+txt.slice(0,150):'')));
      try{j=JSON.parse(txt)}catch(e){throw new Error('响应非JSON: '+txt.slice(0,120))}
      if(j.error)throw new Error(j.error.message||j.error);
    }
    var msg=(j.choices&&j.choices[0]&&j.choices[0].message)||{};
    if(msg.reasoning_content){var _th=String(msg.reasoning_content).trim();if(_th){loopThink+=(_th+'\n');try{addThinkCard(_th)}catch(_eT){}}}
    var tcs=msg.tool_calls||[];
    var content=String(msg.content||'').trim();
    if(!tcs.length){
      if(!content)content=String(msg.reasoning_content||'').trim()||'（模型返回为空）';
      return {out:content,toolLog:toolLog,think:loopThink};
    }
    /* 回放 assistant（含 tool_calls），逐个本地执行，再回填 role=tool —— 与底层完全一致 */
    if(content){try{addMsg('ai',content)}catch(_eM){}if(AUTO_VOICE)ttsSpeak(content)} /* 中途 AI 正文（工具调用前模型说的话）渲染成气泡并念出；去掉「中途消息：」前缀，使朗读与屏幕气泡文本完全一致 */
    msgs.push({role:'assistant',content:content,tool_calls:tcs});
    for(var i=0;i<tcs.length;i++){
      var tc=tcs[i],fn=((tc.function||{}).name)||'',fargs={};
      try{fargs=JSON.parse((tc.function||{}).arguments||'{}');if(typeof fargs!=='object'||fargs===null||Array.isArray(fargs))fargs={}}catch(e){
        /* arguments 被截断/非法时的抢救：截到最后一个完整键值对再补括号重试 */
        try{var _a=String((tc.function||{}).arguments||'');var _c=_a.slice(0,_a.lastIndexOf('}},')+3);if(_c.indexOf('{')===0){fargs=JSON.parse(_c+'}')||{}}}catch(e2){}
      }
      var _argsP=JSON.stringify(fargs).slice(0,120);
      toolBump(fn);
      var _sl1=addSysLine('🔧 '+fn+' '+_argsP);
      /* 不再播报"调用工具 xxx"，改为只播报工具执行结果（见下方 _rLine 播报） */
      var result;
      if(_stop())throw new DOMException('Aborted','AbortError');
      /* 让出主线程一拍：先让停止按钮的点击事件被处理（abort 生效），再执行同步工具，否则工具执行期间UI卡死点停止无反应 */
      await new Promise(function(rs){setTimeout(rs,0)});
      if(_stop())throw new DOMException('Aborted','AbortError');
      try{result=await agentExecTool(fn,fargs,ctx&&ctx.sessId)}catch(eT){result='工具执行失败:'+eT.message}
      archRegister(fn,fargs,result); /* 【阶段D】登记已执行工具，供压缩索引防重复调用 */
      pushLog('t','R'+(round+1)+' '+fn+'('+JSON.stringify(fargs).slice(0,120)+') => '+String(result).slice(0,200));
      toolLog.push(fn+' -> '+String(result).slice(0,120));
      var _rs;try{_rs=typeof result==='object'?JSON.stringify(result):String(result)}catch(_re){_rs=String(result)}
      var _rLine=(String(_rs).indexOf('失败')>=0||String(_rs).indexOf('⚠️')>=0?'⚠️ ':'✅ ')+fn+' → '+String(_rs).slice(0,200);
      addSysLine(_rLine);
      /* 【朗读对齐屏幕】工具结果行屏幕已不显示（addSysLine 内部禁用），故此处不再朗读，避免「听到工具播报但屏幕看不到」的不一致 */
      msgs.push({role:'tool',tool_call_id:tc.id||'',content:String(result).slice(0,4000)});
    }
  }
  return {out:'（已达工具轮数上限 '+AGENT_MAX_ROUNDS+' 轮，已中止。已完成操作：'+toolLog.slice(-5).join('；')+'）',toolLog:toolLog};
}

/* ===== 上下文管理员：历史过长时压缩早期内容为摘要，存入当前会话 ===== */
/* 【阶段D·峰控对齐】工具执行登记 + 压缩时生成「已执行工具索引」注入摘要，防止 AI 失忆后重复调用已执行过的工具 */
var _archSeq=0;
function archRegister(fn,fargs,result){
  try{
    var s=curSess();
    if(!s.archIdx)s.archIdx=[];
    /* 按 id 查重：同一会话同一序号只登记一次 */
    var brief=fn+'('+(function(a){try{return JSON.stringify(a)}catch(e){return ''}})(fargs).slice(0,60)+')';
    var first=String(result||'').split('\n').map(function(x){return x.trim()}).filter(function(x){return x})[0]||'';
    if(first.length>16)first=first.substring(0,16)+'…';
    var last=s.archIdx[s.archIdx.length-1];

/* 【2026-10-12】移动端图片压缩：canvas 长边1568 + JPEG q0.82，超4MB逐级降质；fail-open 失败回退原图。
   Android WebView/file:// 下 createImageBitmap 兼容性差，用 Image+dataURL 加载。 */
function _compressImageMob(dataUrl, cb){
  try{
    var img=new Image();
    img.onload=function(){
      try{
        var w=img.naturalWidth,h=img.naturalHeight;
        if(!w||!h){cb(dataUrl);return}
        var MAX=1568,scale=Math.min(1,MAX/Math.max(w,h));
        /* 极端长图保护：缩放后最短边不得低于24px，否则放弃缩图只转码 */
        if(Math.round(Math.min(w,h)*scale)<24)scale=Math.max(scale,24/Math.min(w,h));
        var cw=Math.round(w*scale),ch=Math.round(h*scale);
        var cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
        var ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cw,ch);ctx.drawImage(img,0,0,cw,ch);
        var q=0.82,out='';
        (function loop(){
          out=cv.toDataURL('image/jpeg',q);
          if(out.length>4*1024*1024*4/3&&q>0.5){q-=0.15;loop()}else{cb(out.length<dataUrl.length?out:dataUrl)}
        })();
      }catch(e){cb(dataUrl)}
    };
    img.onerror=function(){cb(dataUrl)};
    img.src=dataUrl;
  }catch(e){cb(dataUrl)}
}
function fileToDataUrl(f,cb){var r=new FileReader();r.onload=function(){cb(r.result)};r.readAsDataURL(f)}
function addFiles(files){
  Array.prototype.forEach.call(files,function(f){
    /* Android WebView 文件选择器回传的 name 可能无扩展名、type 可能为空，不能只靠名字判断；
       先读 dataURL，以 data:image 开头即按图片处理（缩略图+关闭按钮），否则按文本附件 */
    var r=new FileReader();
    r.onload=function(){
      var u=String(r.result||'');
      if(/^data:image\//.test(u)){
        if(/^data:image\/gif/.test(u)){ATTACH.push({type:'image',dataUrl:u,name:f.name||'图片'});renderAttach();return}
        _compressImageMob(u,function(cu){
          if(cu!==u)try{addMsg('ai','🗜️ 大图已自动压缩')}catch(e){}
          ATTACH.push({type:'image',dataUrl:cu,name:f.name||'图片'});renderAttach();
        });

        var r2=new FileReader();
        r2.onload=function(){ATTACH.push({type:'file',name:f.name||'文件',text:String(r2.result).slice(0,8000)});renderAttach()};
        r2.onerror=function(){ATTACH.push({type:'file',name:f.name||'文件',text:'（文件读取失败）'});renderAttach()};
        r2.readAsText(f);

    };

  });
}

function ttsSpeak(txt){
  if(!txt)return;
  /* 新朗读先掐断上一段（递增打断令牌）：任何时刻只有一串朗读，新旧互不冲突 */
  try{if(typeof zfStopSpeak==='function')zfStopSpeak()}catch(_eS){}
  var plain=String(txt)
    .replace(/```[\s\S]*?```/g,' [代码] ')
    .replace(/[#*_>`|]+/g,'')
    .replace(/\r/g,'');
  /* 全文分段（无总长度上限）：再长的回答也会切成多段逐段读完 */
  var segs=_zfSplitSpeak(plain,600);
  if(!segs.length){pushLog('t','无正文可朗读');return;}
  var token=(window._zfSpeakToken=(window._zfSpeakToken||0)+1);
  var base=_zfApiBase();
  /* 通道1：服务端 TTS + 逐段续读（手机 App 主通道，可完整朗读超长文本） */
  if(base){
    pushLog('t','分段朗读：共 '+segs.length+' 段，服务端 TTS 逐段续读');
    _zfPlayServerSeg(base,segs,0,token);
    return;
  }
  /* 通道2：手机 App（file:// 加载，无 http base）原生桥逐段续读 —— 本次修复主路径。
     优先原生 serverSpeak（电脑服务端 TTS + MediaPlayer，绕开 WebView fetch/自动播放死路）；
     未连电脑时降级本机 speak。两者均逐段读、轮询播完再续下一段，绝不整段一次性提交，
     从根本上解决“长文只读半句就断”。带打断令牌，停止即时生效。 */
  var nativeOK=false;
  try{ nativeOK=(typeof bJson==='function')&&!!(window.ZFBridge||window.ZFMobile); }catch(_e){}
  if(nativeOK){
    pushLog('t','分段朗读：共 '+segs.length+' 段，原生桥逐段续读');
    _zfPlayNativeSeg(segs,0,token);
    return;
  }
  /* 通道3：浏览器 WebSpeech（分段 speak 自动排队续读） */
  try{
    if(window.speechSynthesis){
      speechSynthesis.cancel();
      for(var i=0;i<segs.length;i++){
        var u=new SpeechSynthesisUtterance(segs[i]);u.lang='zh-CN';u.rate=1.1;
        speechSynthesis.speak(u);
      }
      pushLog('t','分段朗读：共 '+segs.length+' 段，浏览器 WebSpeech 续读');
      return;
    }
  }catch(_e){}
  pushLog('t','当前版本无可用朗读通道(原生TTS未就绪)');
}
function addVoiceBtn(bub,txt){

    if(!bub||!txt)return;
    /* 防重复：同一气泡只加一次操作条 */

    var bar=document.createElement('div');
    bar.style.cssText='display:flex;gap:8px;margin-top:8px;align-items:center';
    function mkBtn(label,fn){
      var b=document.createElement('button');b.className='vbtn';b.textContent=label;
      b.style.cssText='padding:4px 12px;border:1px solid var(--bg3);border-radius:999px;background:var(--bg3);color:var(--fg2);font-size:12px;cursor:pointer';
      b.onclick=function(ev){ev.stopPropagation();fn(b)};

    /* 🔊 朗读：先停上一段再读，播完自动恢复按钮文字 */
    var vb=mkBtn('🔊 朗读',function(b){
      try{if(typeof zfStopSpeak==='function')zfStopSpeak()}catch(_e){}
      try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(_e2){}
      b.textContent='🔊 朗读中…';ttsSpeak(txt);

    });
    /* 📋 复制 */
    var cb=mkBtn('📋 复制',function(b){
      var ok=false;
      try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt); ok=true; } }catch(e){}
      if(!ok){
        try{var ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove();}catch(e2){}
      }
      b.textContent=ok?'✅ 已复制':'❌ 复制失败';
      setTimeout(function(){b.textContent='📋 复制'},1500);
    });
    bar.appendChild(vb);bar.appendChild(cb);
    bub.appendChild(bar);
  }catch(_eV){}
}

/* ---- 轻量 Markdown 渲染：先整体转义防 XSS，再生成安全标签 ---- */
function e2(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
/* ===== 富媒体渲染辅助：图片/视频/音频/HTML 标签 ===== */
var ZF_TAG_OK=/^(img|video|audio|source|br|hr|p|div|span|a|strong|em|b|i|u|s|ul|ol|li|table|thead|tbody|tfoot|tr|th|td|blockquote|h[1-6]|code|pre|figure|figcaption|iframe|section|article|header|footer|main|nav|aside|center|small|sub|sup|details|summary|label|input|select|option|button|form)$/i;
function zfAttr(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
/* 净化单个 HTML 标签：白名单 + 去事件属性 + 禁 javascript: + iframe 强制 sandbox */
function zfSanTag(t){
  var m=t.match(/^<(\/?)([a-zA-Z][a-zA-Z0-9]*)\b([\s\S]*?)\/?>$/);
  if(!m)return e2(t);
  var close=m[1],name=m[2].toLowerCase(),attrs=m[3];
  if(!ZF_TAG_OK.test(name))return e2(t);
  if(close)return '</'+name+'>';
  attrs=attrs.replace(/\son[a-z]+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi,'');
  attrs=attrs.replace(/(href|src|formaction|action)\s*=\s*(['"])\s*javascript:[\s\S]*?\2/gi,'$1="#"');
  attrs=attrs.replace(/(href|src)\s*=\s*javascript:[^\s>]*/gi,'$1="#"');
  if(name==='iframe'){
    attrs=attrs.replace(/\ssandbox\s*=\s*("[^"]*"|'[^']*')/i,'');
    return '<'+close+name+attrs+' sandbox="allow-scripts" loading="lazy" style="max-width:100%;min-height:240px;border:1px solid var(--bg3);border-radius:8px;margin:6px 0">';
  }
  if(name==='a'){if(!/\starget\s*=/i.test(attrs))attrs+=' target="_blank"';if(!/\srel\s*=/i.test(attrs))attrs+=' rel="noopener"';}
  if(name==='img'&&!/\sloading\s*=/i.test(attrs))attrs+=' loading="lazy"';
  if(name==='video'&&!/\scontrols\s*=/i.test(attrs))attrs+=' controls playsinline';
  if(name==='audio'&&!/\scontrols\s*=/i.test(attrs))attrs+=' controls';
  return '<'+close+name+attrs+'>';
}
/* 把 ![](...) 的 url 按类型渲染成富媒体；非白名单协议降级为转义文本 */
function zfMedia(url,alt){
  var u=String(url),lu=u.toLowerCase();
  if(/\.(mp4|webm|ogv|mov|m4v)(\?|#|$)/.test(lu)||/^data:video\//.test(lu))
    return '<video src="'+zfAttr(u)+'" controls playsinline preload="metadata" style="max-width:100%;width:100%;border-radius:8px;margin:6px 0"></video>';
  if(/\.(mp3|wav|m4a|aac|flac|ogg|opus)(\?|#|$)/.test(lu)||/^data:audio\//.test(lu))
    return '<audio src="'+zfAttr(u)+'" controls preload="metadata" style="width:100%;margin:6px 0"></audio>';
  var safe=/^(https?:\/\/|data:image\/|\/sdcard\/|file:\/\/|content:\/\/|\/|\.\.\/)/i.test(u);
  if(safe){
    return '<img src="'+zfAttr(u)+'" alt="【图片未能内嵌：'+zfAttr(alt||u)+'】" loading="lazy" onerror="this.outerHTML=this.alt" style="max-width:100%;height:auto;border-radius:8px;margin:6px 0;display:block">';
  }
  return zfAttr(alt||u);
}
function renderMD(src){
  /* 【统一渲染层 v1】桌面与手机版共用 public/js/md-render.js 同一实现，
     下方旧内联解析器保留作极端兜底（ZFMD 未加载时才走）。 */
  if (typeof ZFMD !== 'undefined') { try { return ZFMD.render(src, { wrap: 'zfmd', media: true, tags: 'rich' }); } catch (e) {} }
  var blocks=[],text=String(src);
  /* 【修复 v81】**加粗** 跨行时不渲染：先把段内跨行的 **…** 合并回单行再走逐行解析 */
  text=text.replace(/\*\*([^*\n](?:[^*]|\*(?!\*))*?)\*\*(?=\s*(?:\r?\n|$))/gs,function(m,inner){return '**'+inner.replace(/\s*\r?\n\s*/g,' ')+'**'});
  text=text.replace(/\*\*([^*]+)\*\*/g,function(m,inner){return '**'+inner.replace(/\s*\r?\n\s*/g,' ')+'**'});
  text=text.replace(/```(\w*)\n?([\s\S]*?)(```|$)/g,function(m,lang,code){
    blocks.push(code.replace(/\n$/,''));
    return '\u0000B'+(blocks.length-1)+'\u0000';
  });
  var lines=text.split(/\r?\n/),html=[],inUl=false,inOl=false;
  function closeLists(){if(inUl){html.push('</ul>');inUl=false}if(inOl){html.push('</ol>');inOl=false}}
  function inline(s){
    var store=[];
    function stash(html){store.push(html);return '\u0001S'+(store.length-1)+'\u0001';}
    /* 行内代码（内部转义） */
    s=s.replace(/`([^`]+)`/g,function(m,c){return stash('<code>'+e2(c)+'</code>');});
    /* Markdown 图片 ![](url) —— 支持 http/data/本地/sdcard，按类型渲染图/视频/音频 */
    s=s.replace(/!\[([^\]]*)\]\(\s*([^)\s]+)(?:\s+"[^"]*")?\s*\)/g,function(m,alt,url){return stash(zfMedia(url,alt));});
    /* Markdown 链接 [](url)（防 javascript:，支持任意安全协议/本地路径；URL 支持一层嵌套括号避免截断） */
    s=s.replace(/\[([^\]]+)\]\(\s*((?:[^()\s]|\([^)\s]*\))+)(?:\s+"[^"]*")?\s*\)/g,function(m,txt,url){
      if(/^\s*javascript:/i.test(url))return stash(e2(txt));
      return stash('<a href="'+zfAttr(url)+'" target="_blank" rel="noopener">'+e2(txt)+'</a>');
    });
    /* 原生 HTML 标签（白名单净化后渲染，自闭/普通标签均捕获） */
    s=s.replace(/<\/?[a-zA-Z][a-zA-Z0-9]*(?:\s[^<>]*)?\/?>/g,function(m){return stash(zfSanTag(m));});
    /* 剩余纯文本转义 */
    s=e2(s);
    s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    s=s.replace(/(^|[^\w*])\*([^*\s][^*]*)\*(?![\w*])/g,'$1<em>$2</em>');
    s=s.replace(/\u0001S(\d+)\u0001/g,function(m,i){return store[i]||'';});
    return s;
  }
  for(var i=0;i<lines.length;i++){var L=lines[i];
    var bm=L.trim().match(/^\u0000B(\d+)\u0000$/);
    if(bm){closeLists();var code=blocks[parseInt(bm[1])]||'';
      html.push('<pre><button class="cpy" data-code="'+encodeURIComponent(code)+'">复制</button><code>'+e2(code)+'</code></pre>');continue}
    var h=L.match(/^(#{1,3})\s+(.*)$/);
    if(h){closeLists();var hn=h[1].length;html.push('<h'+hn+'>'+inline(h[2])+'</h'+hn+'>');continue}
    if(/^\s*(---+|\*\*\*+)\s*$/.test(L)){closeLists();html.push('<hr>');continue}
    var ul=L.match(/^\s*[-*+]\s+(.*)$/);
    if(ul){if(inOl){html.push('</ol>');inOl=false}if(!inUl){html.push('<ul>');inUl=true}html.push('<li>'+inline(ul[1])+'</li>');continue}
    var ol=L.match(/^\s*\d+[.、)]\s+(.*)$/);
    if(ol){if(inUl){html.push('</ul>');inUl=false}if(!inOl){html.push('<ol>');inOl=true}html.push('<li>'+inline(ol[1])+'</li>');continue}
    var qt=L.match(/^&gt;\s?(.*)$/);
    if(qt){closeLists();html.push('<blockquote>'+inline(qt[1])+'</blockquote>');continue}
    if(!L.trim()){closeLists();continue}
    if(/^\s*\|.*\|\s*$/.test(L)||(/\|/.test(L)&&/^\s*\|/.test(L))){
      var tbl=[],j=i,_sb=false;
      while(j<lines.length){
        var L2=lines[j];
        if(/^\s*\|.*\|?\s*$/.test(L2)||(/\|/.test(L2)&&/^\s*\|/.test(L2))){tbl.push(L2.trim().replace(/^\||\|$/g,''));j++;_sb=true}
        else if(_sb&&!L2.trim()&&j+1<lines.length&&(/^\s*\|/.test(lines[j+1]))){j++;continue}
        else break;
      }
      if(tbl.length>=2){
        function parseRow(r){return r.split('|').map(function(c){return c.trim()})}
        var isSep=function(cs){return cs.length>0&&cs.every(function(c){return /^:?-{2,}:?$/.test(c)||c===''})};
        var rows=tbl.map(parseRow);
        var head=rows[0],k=1;
        if(rows.length>1&&isSep(rows[1]))k=2;
        var tHtml='<table style="border-collapse:collapse;width:100%;margin:8px 0;font-size:13px">';
        if(!isSep(head)&&head.some(function(c){return c!==''})){
          tHtml+='<tr>'+head.map(function(c){return '<th style="border:1px solid var(--bg3);padding:6px 8px;text-align:left;background:var(--bg2)">'+inline(c)+'</th>'}).join('')+'</tr>';
        }
        for(var ti=k;ti<rows.length;ti++){
          if(isSep(rows[ti]))continue;
          tHtml+='<tr>'+rows[ti].map(function(c){return '<td style="border:1px solid var(--bg3);padding:6px 8px;text-align:left">'+inline(c)+'</td>'}).join('');
          for(var pj=rows[ti].length;pj<head.length;pj++)tHtml+='<td style="border:1px solid var(--bg3);padding:6px 8px"></td>';
          tHtml+='</tr>';
        }
        tHtml+='</table>';
        closeLists();html.push(tHtml);i=j-1;continue;
      }
    }
    closeLists();html.push('<p>'+inline(L)+'</p>');
  }
  closeLists();
  return html.join('');
}

  var code='';try{code=decodeURIComponent(btn.getAttribute('data-code')||'')}catch(e){code=btn.getAttribute('data-code')||''}

    if(window.ZFBridge&&ZFBridge.clipboardCopy){ZFBridge.clipboardCopy(code);btn.textContent='已复制';setTimeout(function(){btn.textContent='复制'},1200);pushLog('t','代码块已复制到剪贴板')}
    else{btn.textContent='桥不可用'}
  }catch(e){btn.textContent='失败'}
});
/* ---- 消息长按菜单（500ms）：复制 / 重新生成 ---- */
var _msgMenu=document.createElement('div');_msgMenu.style.cssText='position:fixed;z-index:999;display:none;background:var(--bg2);border:1px solid var(--bg3);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.3);overflow:hidden;font-size:14px';
_msgMenu.innerHTML='<button style="display:block;width:100%;padding:12px 22px;border:0;background:none;color:var(--fg);text-align:left" data-act="copy">\uD83D\uDCCB 复制</button><button style="display:block;width:100%;padding:12px 22px;border:0;background:none;color:var(--fg);text-align:left;border-top:1px solid var(--bg3)" data-act="select">\uD83E\uDDED 选择本条</button>';
document.body.appendChild(_msgMenu);
var _lpTimer=null,_lpMsg=null,_lpMsgEl=null;
function _hideMenu(){_msgMenu.style.display='none'}
_msgMenu.addEventListener('click',function(ev){
  var b=ev.target.closest?ev.target.closest('button'):null;if(!b)return;
  var act=b.getAttribute('data-act');_hideMenu();
  if(!_lpMsg)return;
  if(act==='copy'){
    try{
      if(window.ZFBridge&&ZFBridge.clipboardCopy){ZFBridge.clipboardCopy(_lpMsg);pushLog('t','已复制消息')}
      else{var ta=document.createElement('textarea');ta.value=_lpMsg;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();pushLog('t','已复制消息(execCommand)')}
    }catch(e){pushLog('e','复制失败:'+e.message)}
  }else if(act==='select'){
    /* 程序化选中整条消息，交系统文本选择/复制句柄 */
    try{
      var r=document.createRange();r.selectNodeContents(_lpMsgEl);
      var s=window.getSelection();s.removeAllRanges();s.addRange(r);
      pushLog('t','已选中整条消息，可用系统菜单复制')
    }catch(e){pushLog('e','选择失败:'+e.message)}
  }
});
document.addEventListener('click',function(ev){if(!_msgMenu.contains(ev.target))_hideMenu()});
var _lpSX=0,_lpSY=0,_lpMoved=false;
$('chat').addEventListener('touchstart',function(ev){
  var b=ev.target.closest?ev.target.closest('.msg.user'):null;if(!b)return;
  _lpSX=ev.touches[0].clientX;_lpSY=ev.touches[0].clientY;_lpMoved=false;
  _lpMsgEl=b;_lpTimer=setTimeout(function(){
    /* 有系统选区时让位，避免与长按选字冲突 */
    var _sel=window.getSelection&&window.getSelection();
    if(_sel&&String(_sel).length>0)return;
    /* 气泡持有原文 _srcText，直接取用，避免 DOM↔hist 索引错位 */
    _lpMsg=_lpMsgEl._srcText||'';
    if(!_lpMsg)return;
    var t0={clientX:_lpSX,clientY:_lpSY};
    _msgMenu.style.left=Math.min(t0.clientX,window.innerWidth-130)+'px';
    _msgMenu.style.top=Math.min(t0.clientY,window.innerHeight-150)+'px';
    _msgMenu.style.display='block';
    try{bJson('vibrate',30)}catch(e){}
  },500);
},{passive:true});
$('chat').addEventListener('touchmove',function(ev){
  if(_lpTimer&&!_lpMoved){
    var dx=ev.touches[0].clientX-_lpSX,dy=ev.touches[0].clientY-_lpSY;
    /* 位移超过12px视为滚动，才取消长按；抗手抖 */
    if(dx*dx+dy*dy>144){clearTimeout(_lpTimer);_lpTimer=null;_lpMoved=true}
  }
},{passive:true});
$('chat').addEventListener('touchend',function(){if(_lpTimer){clearTimeout(_lpTimer);_lpTimer=null}},{passive:true});

$('btnCopyLog').onclick=function(){
  var s='';
  try{
    s+='======== 对话记录 ========\n';
    (SESSIONS||[]).forEach(function(ss){
      s+='\n【会话】'+(ss.title||'未命名')+'（'+new Date(ss.ts||Date.now()).toLocaleString()+'）\n';
      (ss.msgs||[]).forEach(function(m){
        s+=(m.role==='user'?'用户':'AI')+'：'+(m.content==null?'':String(m.content)).slice(0,1500)+'\n';
      });
    });
    if(!(SESSIONS&&SESSIONS.length))s+='（无对话记录）\n';
  }catch(e){s+='（对话记录读取失败）\n'}
  s+='\n======== 运行日志 ========\n'+(ZLOGS.join('\n')||'（空）');
  try{if(window.ZFBridge&&ZFBridge.clipboardCopy){ZFBridge.clipboardCopy(s);this.textContent='已复制全部';var b=this;setTimeout(function(){b.textContent='复制'},1500)}}
  catch(e){}
};
$('btnClearLog').onclick=async function(){
  if(!await window.zfDialog.confirm('确定清空日志和全部对话记录吗？此操作不可恢复。',{title:'清空记录',icon:'🗑️',danger:true,okText:'清空',cancelText:'取消'}))return;
  ZLOGS=[];
  (SESSIONS||[]).forEach(function(s){s.msgs=[]});
  try{localStorage.removeItem('zf_sessions')}catch(e){}
  hist=[];CUR='s'+Date.now();
  SESSIONS=[{id:CUR,title:'新对话',ts:Date.now(),msgs:hist}];
  persist();$('chat').innerHTML='';renderHist();renderLogs();
};
