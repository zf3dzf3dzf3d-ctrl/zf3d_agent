<!-- 朱峰智能体无限 悬浮切换按钮 注入开始 -->
<style id="zf-switch-style">
  #zf-fab {
    position: fixed; right: 14px; bottom: 14px; z-index: 2147483000;
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, #ff7a18, #af002d);
    color: #fff; font-size: 22px; font-weight: bold; line-height: 44px;
    text-align: center; cursor: pointer; user-select: none;
    box-shadow: 0 4px 14px rgba(0,0,0,.45); opacity: .85;
    transition: transform .15s, opacity .15s;
    font-family: sans-serif;
  }
  #zf-fab:hover { opacity: 1; transform: scale(1.1); }
  #zf-dock {
    position: fixed; inset: 0; z-index: 2147482000; display: none;
    background: #0d1117; border: 0;
  }
  body.zf-mode #zf-dock { display: block; }
  body.zf-mode > #root { display: none; }
  body.zf-mode #zf-fab { background: linear-gradient(135deg, #18b6ff, #002baf); }
</style>
<div id="zf-fab" title="切换 朱峰无限桌面 / ZCode">峰</div>
<iframe id="zf-dock" src="http://127.0.0.1:8793"></iframe>
<script>
(function () {
  var fab = document.getElementById('zf-fab');
  fab.addEventListener('click', function () {
    document.body.classList.toggle('zf-mode');
  });
  setInterval(function () {
    var on = document.body.classList.contains('zf-mode');
    fab.textContent = on ? 'Z' : '峰';
    fab.title = on ? '切回 ZCode' : '切换到 朱峰无限桌面';
  }, 400);
})();
</script>
<!-- 朱峰智能体无限 悬浮切换按钮 注入结束 -->
