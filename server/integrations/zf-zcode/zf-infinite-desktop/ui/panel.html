<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0;height:100%;font-family:"Segoe UI",system-ui,sans-serif;background:#11151c;color:#d7dee8}
  #boot{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px}
  #boot h2{margin:0;font-size:16px}
  #boot p{margin:0;font-size:12px;color:#8a94a3}
  #startBtn{padding:10px 26px;font-size:14px;border:0;border-radius:8px;background:#3b82f6;color:#fff;cursor:pointer}
  #startBtn:hover{background:#2563eb}
  #frame{width:100%;height:100%;border:0;display:none}
</style>
</head>
<body>
<div id="boot">
  <h2>朱峰无限桌面</h2>
  <p id="status">正在检测本地桥服务…</p>
  <button id="startBtn" style="display:none">启动无限桌面</button>
</div>
<iframe id="frame" src="about:blank"></iframe>
<script>
const BASE = 'http://127.0.0.1:8791';
const frame = document.getElementById('frame');
const boot = document.getElementById('boot');
const status = document.getElementById('status');
const startBtn = document.getElementById('startBtn');

function embed(){
  boot.style.display='none';
  frame.src = BASE + '/';
  frame.style.display='block';
}

async function probe(){
  try{
    const r = await fetch(BASE + '/api/health', {cache:'no-store'});
    if(r.ok){ embed(); return true; }
  }catch(e){}
  return false;
}

async function start(){
  startBtn.disabled = true; startBtn.textContent='启动中…';
  // 先尝试唤起（launch.py 幂等：已在跑则直接复用端口）
  try{ await fetch(BASE + '/api/health', {cache:'no-store'}); }catch(e){}
  // 轮询最多 15 秒
  for(let i=0;i<15;i++){
    if(await probe()) return;
    await new Promise(r=>setTimeout(r,1000));
  }
  status.textContent='未检测到服务，请重启 ZCode 或在插件目录运行 bridge_lite/launch.py';
  startBtn.disabled=false; startBtn.textContent='重试';
}

startBtn.addEventListener('click', start);
probe().then(ok=>{ if(!ok){ status.textContent='本地桥服务未运行'; startBtn.style.display='block'; } });
</script>
</body>
</html>
